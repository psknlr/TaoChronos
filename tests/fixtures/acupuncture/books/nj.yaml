- book: nj
  passages:
    - {id: nj.64, locator: {chapter: 六十四难}, text: 阴井木，阳井金；阴荥火，阳荥水；阴俞土，阳俞木；阴经金，阳经火；阴合水，阳合土。}
    - {id: nj.68, locator: {chapter: 六十八难}, text: 井主心下满，荥主身热，俞主体重节痛，经主喘咳寒热，合主逆气而泄。}
    - {id: nj.69, locator: {chapter: 六十九难}, text: 虚者补其母，实者泻其子，当先补之，然后泻之。}
    - {id: nj.45, locator: {chapter: 四十五难}, text: 府会太仓，藏会季胁，筋会阳陵泉，髓会绝骨，血会鬲俞，骨会大杼，脉会太渊，气会三焦外一筋直两乳内也。}
    - {id: nj.67, locator: {chapter: 六十七难}, text: 五藏募皆在阴，而俞皆在阳者，何谓也？然：阴病行阳，阳病行阴，故令募在阴，俞在阳。}
