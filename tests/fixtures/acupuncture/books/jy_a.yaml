- book: jy_a
  passages:
    - {id: jy_a.01, locator: {volume: 卷三, chapter: 手太阴及臂凡一十八穴第二十四}, text: 鱼际者：火也。在手大指本节后内侧散脉中，手太阴脉之所溜也，为荥。刺入二分，留三呼，灸三壮。太渊者：土也。在掌后陷者中，手太阴脉之所注也}
    - {id: jy_a.02, locator: {volume: 卷三, chapter: 手太阴及臂凡一十八穴第二十四}, text: ，为俞。刺入二分，留二呼，灸三壮。经渠者：金也。在寸口陷者中，手太阴脉之所行也，为经，刺入三分，留三呼，不可灸，灸之伤人神明。列缺者：手太阴之络，去腕上一寸五分，别走阳明者。刺入三分，留三呼，灸五壮。}
    - {id: jy_a.03, locator: {volume: 卷三, chapter: 足阳明及股凡三十穴第三十三}, text: 三里，土也。在膝下三寸䯒外廉，足阳明脉气所入也，为合。刺入一寸五分，留七呼，灸三壮。}
    - {id: jy_a.04, locator: {volume: 卷三, chapter: 腹自鸠尾循任脉下行至会阴凡十五穴第十九}, text: 中脘，一名太仓，胃募也，在上脘下一寸，居心蔽骨与脐之中，手太阳、少阳、足阳明所生，任脉之会，刺入一寸二分，灸七壮。}
    - {id: jy_a.05, locator: {volume: 卷三, chapter: 腹自鸠尾循任脉下行至会阴凡十五穴第十九}, text: 脐中，神阙穴也，一名气舍，灸三壮，禁不可刺，刺之令人恶疡遗矢者，死不治。}
    - {id: jy_a.06, locator: {volume: 卷三, chapter: 足太阴及股凡二十二穴第三十}, text: 三阴交，在内踝上三寸骨下陷者中，足太阴、厥阴、少阴之会，刺入三分，留七呼，灸三壮。}
    - {id: jy_a.07, locator: {volume: 卷九, chapter: 脾胃大肠受病发腹胀满肠中鸣短气第七}, text: 肠中寒，胀满善噫，闻食臭，胃气不足，肠鸣腹痛，泄，食不化，心下胀，三里主之。腹胀不通，寒中伤饱，食饮不化，中脘主之。}
    - {id: jy_a.08, locator: {volume: 卷九, chapter: 邪在心胆及诸脏腑发悲恐太息口苦不乐及惊第五}, text: 心澹澹而善惊恐，心悲，内关主之。}
    - {id: jy_a.09, locator: {volume: 卷七, chapter: 六经受病发伤寒热病第一}, text: 热病汗不出，呕吐，胸满，尺泽、曲泽主之。}
    - {id: jy_a.10, locator: {volume: 卷八, chapter: 五脏传病发寒热第一}, text: 臂厥，肩膺胸满痛，咳，喘不得息，太渊主之。}
