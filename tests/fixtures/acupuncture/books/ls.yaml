- book: ls
  passages:
    - {id: ls.1, locator: {chapter: 九针十二原第一}, text: 所出为井，所溜为荥，所注为腧，所行为经，所入为合，二十七气所行，皆在五腧也。}
    - {id: ls.2, locator: {chapter: 九针十二原第一}, text: 五脏有六腑，六腑有十二原，十二原出于四关，四关主治五脏，五脏有疾，当取之十二原。}
    - {id: ls.3, locator: {chapter: 邪气藏府病形第四}, text: 荥输治外经，合治内府。胃合于三里，大肠合入于巨虚上廉，小肠合入于巨虚下廉，三焦合入于委阳，膀胱合入于委中央，胆合入于阳陵泉。}
    - {id: ls.4, locator: {chapter: 顺气一日分为四时第四十四}, text: 病在藏者，取之井；病变于色者，取之荥；病时间时甚者，取之输；病变于音者，取之经；经满而血者，病在胃及以饮食不节得病者，取之于合。}
    - {id: ls.5, locator: {chapter: 经筋第十三}, text: 治在燔针劫刺，以知为数，以痛为输。}
    - {id: ls.6, locator: {chapter: 邪气藏府病形第四}, text: 胃病者，腹䐜胀，胃脘当心而痛，取三里也。}
