- book: jy_b
  passages:
    - {id: jy_b.1, locator: {volume: 卷三, chapter: 手太隂及臂凡一十八穴第二十四}, text: 太淵者水也在掌後陷者中手太隂脈之所注也為俞刺入二分留二呼灸三壯經渠者金也在寸口陷者中手太隂之所行也為經刺入三分留三呼不可灸灸之傷人神明}
    - {id: jy_b.2, locator: {volume: 卷三, chapter: 手陽明及臂凡二十八穴第二十七}, text: 三里在曲池下二寸按之肉起兑肉之端刺入三分灸三壯}
    - {id: jy_b.3, locator: {volume: 卷三, chapter: 足陽明及股凡三十穴第三十三}, text: 三里土也在膝下三寸䯒外亷足陽明脈氣所入也為合刺入一寸五分留七呼灸三壯}
