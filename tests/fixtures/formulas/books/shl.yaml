- book: shl
  passages:
    - {id: shl.f1, locator: {chapter: 辨太阳病脉证并治上, section: 桂枝汤方}, text: 桂枝汤方　桂枝三两，去皮　芍药三两　甘草二两，炙　生姜三两，切　大枣十二枚，擘　右五味，以水七升，微火煮取三升，去滓，适寒温，服一升。}
    - {id: shl.f2, locator: {chapter: 辨太阳病脉证并治中, section: 葛根汤方}, text: 葛根汤方　葛根四两　麻黄三两，去节　桂枝二两，去皮　芍药二两　甘草二两，炙　生姜三两，切　大枣十二枚，擘　右七味，以水一斗，先煮麻黄、葛根，内诸药，煮取三升，去滓，温服一升。}
    - {id: shl.f3, locator: {chapter: 辨太阳病脉证并治中, section: 麻黄汤方}, text: 麻黄汤方　麻黄三两，去节　桂枝二两，去皮　甘草一两，炙　杏仁七十个，去皮尖　右四味，以水九升，煮取二升半，去滓，温服八合。}
    - {id: shl.f4, locator: {chapter: 辨太阳病脉证并治下, section: 白虎汤方}, text: 白虎汤方　知母六两　石膏一斤，碎　甘草二两，炙　粳米六合　右四味，以水一斗，煮米熟汤成，去滓，温服一升，日三服。}
    - {id: shl.f5, locator: {chapter: 辨太阳病脉证并治上, section: 白虎加人参汤方}, text: 白虎加人参汤方　知母六两　石膏一斤，碎　甘草二两，炙　粳米六合　人参三两　右五味，以水一斗，煮米熟汤成，去滓，温服一升，日三服。}
    - {id: shl.f6, locator: {chapter: 辨太阳病脉证并治中, section: 小柴胡汤方}, text: 小柴胡汤方　柴胡半斤　黄芩三两　人参三两　半夏半升，洗　甘草三两，炙　生姜三两，切　大枣十二枚，擘　右七味，以水一斗二升，煮取六升，去滓，再煎取三升，温服一升，日三服。}
    - {id: shl.f7, locator: {chapter: 辨太阴病脉证并治, section: 四逆汤方}, text: 四逆汤方　甘草二两，炙　干姜一两半　附子一枚，生用，去皮，破八片　右三味，以水三升，煮取一升二合，去滓，分温再服。}
    - {id: shl.f8, locator: {chapter: 辨太阳病脉证并治中, section: 五苓散方}, text: 五苓散方　猪苓十八铢，去皮　泽泻一两六铢　白术十八铢　茯苓十八铢　桂枝半两，去皮　右五味，捣为散，以白饮和服方寸匕，日三服。}
