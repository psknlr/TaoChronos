- book: jk
  passages:
    - {id: jk.1, locator: {chapter: 痰饮咳嗽病脉证并治, section: 甘遂半夏汤方}, text: 甘遂半夏汤方　甘遂大者三枚　半夏十二枚（以水一升，煮取半升，去滓）　芍药五枚　甘草如指大一枚（炙）　右四味，以水二升，煮取半升，去滓，以蜜半升，和药汁煎取八合，顿服之。}
    - {id: jk.2, locator: {chapter: 痉湿暍病脉证治, section: 白虎加人参汤方}, text: 白虎加人参汤方　知母六两　石膏一斤，碎　甘草二两　粳米六合　人参三两　右五味，以水一斗，煮米熟汤成，去滓，温服一升，日三服。}
    - {id: jk.3, locator: {chapter: 妇人妊娠病脉证并治, section: 桂枝汤方}, text: 桂枝汤方　桂枝三两，去皮　芍药三两　甘草二两，炙　生姜三两　大枣十二枚　右五味，以水七升，微火煮取三升，去滓，服一升。}
