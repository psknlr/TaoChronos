[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "taochronos"
version = "0.1.0"
description = "TaoChronos: a provenance-grounded, evidence-native research harness for knowledge discovery from ancient Chinese medical classics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["traditional-chinese-medicine", "digital-humanities", "multi-agent", "knowledge-discovery", "provenance", "hypergraph"]

# Each lower bound is the first release with no published advisory (requirements/README.md); the versions installed
# are the hashed lockfiles in requirements/
[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
litellm = ["litellm>=1.103.1"]  # the LiteLLM provider (optional: a LiteLLM proxy needs nothing extra)
dev = ["pytest>=9.0.3"]
parquet = ["pyarrow>=23.0.1"]  # `corpus catalog|ingest hf-tcm-canon` reads the Hugging Face Parquet file
pdf = ["pypdf>=6.21.4"]  # `corpus catalog|ingest aeam` reads the 東亜医学協会 PDF texts

[project.scripts]
taochronos = "taochronos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
