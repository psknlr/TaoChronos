name: audit

# The published advisories against everything this repository pins (docs/adr/0026-pinned-supply-chain-and-enforced-
# policies.md): the Python lockfiles (requirements/, read by pip-audit against PyPI's advisory data), the Workers'
# npm lockfiles (npm audit against the npm registry's) and TaoCore's Cargo.lock (cargo-deny against RustSec's, with its
# rules on licences and sources: rust/deny.toml).  Every week — a new advisory changes nothing in the repository —
# and on every change to what is pinned, Dependabot's pull requests among them.  A failure names the package, the
# advisory and the release that fixes it: requirements/lock.sh --upgrade (requirements/README.md), or Dependabot's pull
# request for a Worker.  Nothing is installed from the lockfiles read here, and nothing is sent but package names and
# versions.
on:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - "requirements/**"
      - "pyproject.toml"
      - "relay/package-lock.json"
      - "cloud/site/package-lock.json"
      - "cloud/corpus/package-lock.json"
      - "rust/Cargo.lock"
      - "rust/deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "requirements/**"
      - "pyproject.toml"
      - "relay/package-lock.json"
      - "cloud/site/package-lock.json"
      - "cloud/corpus/package-lock.json"
      - "rust/Cargo.lock"
      - "rust/deny.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit (the hashed lockfile requirements/audit.txt)
        run: pip install --require-hashes -r requirements/audit.txt
      # each lockfile with its platform markers taken off (the hashes kept): a package pinned for Windows or for Pyodide
      # only is read here too, not skipped because this runner is Linux
      - name: Every lockfile against the advisories
        run: |
          status=0
          for f in requirements/*.txt; do
            sed -E 's/^([A-Za-z0-9._-]+==[^ ;]+) ;[^\\]*/\1 /' "$f" > "$RUNNER_TEMP/all.txt"
            echo "::group::$f"
            pip-audit --strict --progress-spinner off --disable-pip --require-hashes -r "$RUNNER_TEMP/all.txt" || { status=1; echo "::error::$f: a pinned package has a published advisory (the table above)"; }
            echo "::endgroup::"
          done
          exit "$status"

  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [relay, cloud/site, cloud/corpus]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # the whole lockfile, dev dependencies included: wrangler is one, and it is what deploys
      - name: ${{ matrix.worker }}/package-lock.json against the advisories
        working-directory: ${{ matrix.worker }}
        run: npm audit --package-lock-only

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # built from crates.io by its own lockfile (cargo checks every crate's checksum), not a binary downloaded
      - name: Install cargo-deny
        run: rustup toolchain install --no-self-update && cargo install --locked cargo-deny@0.22.1
      - name: rust/Cargo.lock against the advisories, and rust/deny.toml's rules
        run: cargo deny --locked check
