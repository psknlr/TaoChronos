name: chat-logs

# The conversation records of 道乃久默认服务 — only visitors who agreed are recorded (the page asks first) — collected
# from the relay into data/chat-logs/YYYY/MM/DD.jsonl every hour, then deleted from the relay; and, the same way, the
# sentinel's events from both Workers (security/README.md) into data/security-logs/.  The records stay in this
# repository: keep it private, or move them out, before it is ever made public.  Needs the LOG_EXPORT_TOKEN secret.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-logs
  cancel-in-progress: false

env:
  RELAY_URL: ${{ vars.RELAY_URL || 'https://chat-api.impf.ai' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://chat.impf.ai' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Is the relay set up?
        id: ready
        env:
          TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: |
          # the collector's token goes to our own hosts only (the addresses are repository variables)
          for u in "$RELAY_URL" "$SITE_URL"; do
            case "$u" in https://*.impf.ai|https://*.impf.ai/*) ;; *) echo "::error::$u is not one of our hosts (RELAY_URL / SITE_URL)"; exit 1;; esac
          done
          if [ -z "$TOKEN" ]; then
            echo "::notice::LOG_EXPORT_TOKEN is not set: nothing to collect"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'
      - name: Pull the new records
        id: pull
        if: steps.ready.outputs.go == '1'
        env:
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: python3 relay/collect.py pull --relay "$RELAY_URL" --out data/chat-logs
      - name: Pull the sentinels' events (security/README.md)
        id: sentinel
        if: steps.ready.outputs.go == '1'
        env:
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: python3 security/collect.py pull --relay "$RELAY_URL" --site "$SITE_URL" --out data/security-logs
      - name: Commit them
        if: steps.ready.outputs.go == '1' && (steps.pull.outputs.new != '0' || steps.sentinel.outputs.new != '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chat-logs data/security-logs
          git commit -q -m "chat-logs: ${{ steps.pull.outputs.new }} records through #${{ steps.pull.outputs.last }}; security: ${{ steps.sentinel.outputs.new }} events [skip ci]"
          pushed=0
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 5))
            git pull -q --rebase origin main
          done
          [ "$pushed" = 1 ] || { echo "::error::the records could not be pushed; the relay keeps them for the next run"; exit 1; }
      - name: The relay may delete what the repository now holds
        if: steps.ready.outputs.go == '1' && steps.pull.outputs.new != '0'
        env:
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: python3 relay/collect.py ack --relay "$RELAY_URL" --through "${{ steps.pull.outputs.last }}"
      - name: The sentinels may delete what the repository now holds
        if: steps.ready.outputs.go == '1' && steps.sentinel.outputs.new != '0'
        env:
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: python3 security/collect.py ack --relay "$RELAY_URL" --site "$SITE_URL" --out data/security-logs
