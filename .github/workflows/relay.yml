name: relay

# 道乃久默认服务: relay/ deployed to Cloudflare as chat-api.impf.ai (relay/README.md).
# Repository secrets it needs (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# MINIMAX_API_KEY, LOG_EXPORT_TOKEN; optional: OPENAI_API_KEY (the second model, GPT-6 Luna), SPONSOR_SECRET (visitors'
# sponsored keys, encrypted under it; 32+ characters), SENTINEL_SALT (security/README.md), STATS_TOKEN.  The keys and the
# tokens become secrets of the Worker; none is ever printed or written into the repository or the site.  Until they are set, this workflow
# tests the relay and deploys nothing.  Optional repository variable: ARCHIVE_BUCKET, the private R2 bucket the records
# and the sentinel's events are drained into instead of the repository (security/bind-archive.sh; relay/SETUP.md, 归档).
# Optional repository secret: ACTIVITY_KEY (32+ characters), which switches the activity ledger on — the Worker is then
# bound to its registry, the D1 database taochronos-activity (security/bind-ledger.sh; security/README.md, 活动账本; the
# token needs Account → D1 → Edit).  Without it the relay keeps no ledger.
on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - "security/**"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

env:
  RELAY_URL: ${{ vars.RELAY_URL || 'https://chat-api.impf.ai' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test the relay and the sentinel
        run: node --test relay/test/relay.test.js security/test/sentinel.test.js security/test/archive.test.js security/test/visitor.test.js security/test/ledger.test.js
      - name: Are its secrets set?
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.MINIMAX_API_KEY }}
          TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KEY" ] || missing="$missing MINIMAX_API_KEY"
          [ -n "$TOKEN" ] || missing="$missing LOG_EXPORT_TOKEN"
          token="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"
          if [ -n "$missing" ]; then
            echo "::warning::the relay is not deployed until these repository secrets are set:$missing (see relay/SETUP.md)"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          elif [ "${#token}" -lt 16 ]; then
            echo "::error::LOG_EXPORT_TOKEN must be at least 16 characters"
            exit 1
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      # wrangler and every package under it, exactly as relay/package-lock.json has them (versions and integrity
      # hashes); no install script runs, and no secret is in this step's environment
      - name: Install wrangler from the lockfile
        if: steps.secrets.outputs.ready == '1'
        working-directory: relay
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy the Worker, then give it its secrets
        if: steps.secrets.outputs.ready == '1'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}
          SENTINEL_SALT: ${{ secrets.SENTINEL_SALT }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPONSOR_SECRET: ${{ secrets.SPONSOR_SECRET }}
          ARCHIVE_BUCKET: ${{ vars.ARCHIVE_BUCKET }}
          ACTIVITY_KEY: ${{ secrets.ACTIVITY_KEY }}
          ACTIVITY_DB_NAME: ${{ vars.ACTIVITY_DB_NAME }}
          WRANGLER_SEND_METRICS: "false"
        # a space or line break pasted with a secret is not part of it (no value has any)
        run: |
          # the archive's private bucket, when the owner named one and it is private (security/bind-archive.sh)
          cp wrangler.toml wrangler.deploy.toml
          bash ../security/bind-archive.sh wrangler.deploy.toml
          # the activity ledger's registry, when the owner switched the ledger on (security/bind-ledger.sh)
          bash ../security/bind-ledger.sh wrangler.deploy.toml
          npx --no -- wrangler deploy --config wrangler.deploy.toml
          printf '%s' "$MINIMAX_API_KEY" | tr -d '[:space:]' | npx --no -- wrangler secret put MINIMAX_API_KEY --config wrangler.deploy.toml
          printf '%s' "$LOG_EXPORT_TOKEN" | tr -d '[:space:]' | npx --no -- wrangler secret put LOG_EXPORT_TOKEN --config wrangler.deploy.toml
          if [ -n "$SENTINEL_SALT" ]; then printf '%s' "$SENTINEL_SALT" | tr -d '[:space:]' | npx --no -- wrangler secret put SENTINEL_SALT --config wrangler.deploy.toml; fi
          # the token that reads the counts in the page's settings (统计; docs/web.md): optional, 16 characters or more
          stats="$(printf '%s' "$STATS_TOKEN" | tr -d '[:space:]')"
          if [ "${#stats}" -ge 16 ]; then printf '%s' "$stats" | npx --no -- wrangler secret put STATS_TOKEN --config wrangler.deploy.toml
          elif [ -n "$stats" ]; then echo "::warning::STATS_TOKEN is shorter than 16 characters: not set, the counts stay closed (docs/web.md)"; fi
          # the second model's key (GPT-6 Luna, through OpenAI): optional; without it the page offers Tao-R1 only
          openai="$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')"
          if [ -n "$openai" ]; then printf '%s' "$openai" | npx --no -- wrangler secret put OPENAI_API_KEY --config wrangler.deploy.toml
          else echo "the second model: none (the repository secret OPENAI_API_KEY is not set)"; fi
          # the key the visitors' sponsored keys are encrypted under, and the owner reads them with: optional, 32+ characters
          sponsor="$(printf '%s' "$SPONSOR_SECRET" | tr -d '[:space:]')"
          if [ "${#sponsor}" -ge 32 ]; then printf '%s' "$sponsor" | npx --no -- wrangler secret put SPONSOR_SECRET --config wrangler.deploy.toml
          elif [ -n "$sponsor" ]; then echo "::warning::SPONSOR_SECRET is shorter than 32 characters: not set, sponsorship stays off (relay/SETUP.md)"; fi
          # the activity ledger's key, once the Worker has its registry: visitors' ids are made with it, and the page's
          # passes read with it — the same key as the site's (security/visitor.js), and one that must stay what it is
          if grep -q 'binding = "ACTIVITY_DB"' wrangler.deploy.toml; then
            printf '%s' "$ACTIVITY_KEY" | tr -d '[:space:]' | npx --no -- wrangler secret put ACTIVITY_KEY --config wrangler.deploy.toml
          fi
      - name: Check it answers, and that MiniMax takes its key (one tiny call)
        if: steps.secrets.outputs.ready == '1'
        env:
          LOG_EXPORT_TOKEN: ${{ secrets.LOG_EXPORT_TOKEN }}  # the relay tells where it calls the models from to this token only
        run: python3 relay/collect.py check --relay "$RELAY_URL"
