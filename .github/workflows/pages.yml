name: pages

# The web client on GitHub Pages: https://psknlr.github.io/TaoChronos/, a mirror of https://chat.impf.ai/ — which Cloudflare
# serves (site.yml, cloud/README.md).  Once chat.impf.ai is on Cloudflare, remove the custom domain under Settings → Pages
# (cloud/SETUP.md); until then this site answers for it.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "profiles/**"
      - "domains/**"
      - "corpus/demo/**"
      - "corpus/catalog/**"
      - "corpus/modern/**"
      - "corpus/web/**"
      - "agents/**"
      - "skills/**"
      - "evals/gold/**"
      - "architecture-policy.yaml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Check the chat runtime the site ships
        run: |
          python - <<'EOF'
          from taochronos.chat import ChatRuntime
          rt = ChatRuntime.create("full-discovery", kind="ci", ephemeral=True)
          out = rt.call("classics.search", {"query": "桂枝汤", "k": 2})
          assert out["ok"] and out["citations"], out
          print(rt.info()["corpus"], len(rt.catalog("all")["tools"]), "tools")
          EOF
      - name: Build the site (client, in-browser runtime, 要籍语料, providers, pinned Pyodide, the relay's address)
        # the page uses 道乃久默认服务 (relay/) when it answers, and asks for the visitor's own key when it does not
        run: taochronos web build -o _site --relay "${{ vars.RELAY_URL || 'https://chat-api.impf.ai' }}"
      - name: Check the 要籍语料 the site ships, as the browser will read it
        run: |
          python - <<'EOF'
          import json, lzma, pathlib, tempfile
          from taochronos.chat import ChatRuntime
          from taochronos.plugins.classics.domain import DomainPack
          from taochronos.plugins.classics.webcorpus import index_state, index_store
          site = pathlib.Path("_site/runtime")
          meta = json.loads((site / "manifest.json").read_text())["files"]["corpus.sqlite.xz"]
          data = pathlib.Path(tempfile.mkdtemp())
          (data / "corpus").mkdir()
          db = data / "corpus" / "tcm.sqlite"
          db.write_bytes(lzma.decompress((site / "corpus.sqlite.xz").read_bytes()))
          normalize = DomainPack(pathlib.Path("domains/classics")).variants.normalize_text
          # as the browser does: the first-ranked works, then the rest
          assert index_store(db, normalize, phase="core") == meta["core_passages"]
          assert index_store(db, normalize) == meta["passages"] - meta["core_passages"]
          assert index_state(db)["state"] == "built"
          rt = ChatRuntime.create("web-canon", kind="browser", ephemeral=True, data_dir=data)
          out = rt.call("classics.search", {"query": "桂枝汤", "k": 2})
          assert out["ok"] and out["citations"], out
          boot = json.loads((site / "boot.json").read_text(encoding="utf-8"))
          same = lambda a, b: json.dumps(a, ensure_ascii=False, sort_keys=True) == json.dumps(b, ensure_ascii=False, sort_keys=True)
          assert same(boot["info"], rt.info()) and same(boot["catalogs"]["all"], rt.catalog("all")), "boot.json is not what the runtime reports"
          print(rt.info()["corpus"]["label"], rt.info()["corpus"]["canon"], meta["bytes"], "bytes")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
