name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,anthropic]"
      - name: Architecture governance
        run: taochronos governance
      - name: Tests
        run: pytest
      - name: Quick evaluation
        run: taochronos eval --quick
      - name: Demo research run
        run: taochronos --data "$RUNNER_TEMP/taochronos" demo --session ci

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The relay (道乃久默认服务)
        run: node --test relay/test/relay.test.js
