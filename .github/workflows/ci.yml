name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,anthropic]"
      - name: Architecture governance
        run: taochronos governance
      - name: Tests
        run: pytest
      - name: Quick evaluation
        run: taochronos eval --quick
      - name: Demo research run
        run: taochronos --data "$RUNNER_TEMP/taochronos" demo --session ci

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The relay (道乃久默认服务) and the sentinel both Workers share (security/)
        run: node --test relay/test/relay.test.js security/test/sentinel.test.js security/test/usage.test.js security/test/archive.test.js

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A small D1 backup for its tests (ten books, made by the D1 exporter; docs/adr/0017-d1-backup.md)
        run: |
          pip install -e .
          python -m taochronos.chat.d1 fixture cloud/.d1-fixture
      - name: The site's Worker (and its D1 backup) and the corpus Worker (cloud/)
        run: REQUIRE_D1_FIXTURE=1 node --test cloud/test/site.test.js cloud/test/corpus.test.js cloud/test/backup.test.js
