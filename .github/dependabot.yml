# Keeps the pins current (docs/adr/0026-pinned-supply-chain-and-enforced-policies.md): the Actions by commit, each
# Worker's wrangler by its lockfile, the full corpus's base images by digest, TaoCore's crates by its Cargo.lock.  A pull request each week at most per
# group; the tests (tests/test_supply_chain.py) check that whatever it changes is still pinned.  The Python lockfiles
# (requirements/) are regenerated with requirements/lock.sh, and the audit workflow reads them every week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # the Workers' toolchain: wrangler, and under it undici, sharp, workerd (the deployment's P1 of 2026-10-26)
  - package-ecosystem: npm
    directories: ["/relay", "/cloud/site", "/cloud/corpus", "/cloud/api", "/cloud/console"]
    schedule:
      interval: weekly
    groups:
      workers:
        patterns: ["*"]

  # the type checker (tools/typecheck): typescript, and the Workers' types within the range wrangler names as its peer —
  # a pull request of their own, so that what the checker reports holds up no deployment's toolchain; a new major of
  # TypeScript, which reads unannotated JavaScript otherwise, is a change of its own
  - package-ecosystem: npm
    directory: /tools/typecheck
    schedule:
      interval: weekly
    groups:
      typecheck:
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # the digests of python:3.12-slim and of the Rust image TaoCore's extension is built in; the image stays on Python 3.12
  # (a new minor is a change of its own), and the Rust image on the release rust/rust-toolchain.toml names (the two move
  # together, with the committed browser module: tests/test_supply_chain.py)
  - package-ecosystem: docker
    directory: /cloud/corpus
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # TaoCore's crates (rust/Cargo.lock): PyO3 and what builds it; the kernel itself depends on nothing
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]

  # the platform's Workers in Rust (rust/platform/Cargo.lock: workers-rs, the curves, serde) — apart from TaoCore's, as
  # their workspaces are; wasm-bindgen moves with the CLI rust/platform/build.sh pins (it says so if they part)
  - package-ecosystem: cargo
    directory: /rust/platform
    schedule:
      interval: weekly
    groups:
      platform:
        patterns: ["*"]
