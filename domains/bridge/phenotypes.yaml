# 古籍原子表型 — the atomic clinical findings of the classics, the written forms that name them, and their projection
# into the Human Phenotype Ontology (the Ancient–Modern Bridge, plugins/classics/bridge).
#
# A phenotype here is a finding as the texts state it (渴欲饮水, 小便反多, 消瘦), not a diagnosis.  Its projection says how
# far it overlaps a modern phenotype term, with a relation type — never an equation of an ancient disease with a modern
# one (see ../classics/presentism.yaml):
#
#   EXACT                     the same observable (吐血 → Hematemesis)
#   CLOSE                     nearly the same, the ancient term a little wider or narrower in use (渴欲饮水 → Polydipsia)
#   BROADER / NARROWER        the ancient finding is wider / narrower than the HPO term (目赤 is wider than Conjunctivitis)
#   PARTIAL_OVERLAP           they share part of their extension (小便不利: scanty *or* difficult urination → Oliguria)
#   CONTEXT_DEPENDENT         the projection depends on the passage (目如脱状: the eyes of a man gasping for breath)
#   HISTORICAL_SEMANTIC_SHIFT the written form meant something else in the period of the text (哕: hiccup before the Song)
#   NO_MODERN_EQUIVALENT      a finding of TCM's own (脉浮, 舌白, 恶风): kept as a TCM phenotype, not projected
#
# HPO identifiers and labels were checked against the HPO release named below (hp/releases/2026-09-01):
# `taochronos bridge verify` checks them again against a local hp.obo.  HPO is © the Jackson Laboratory and the Monarch
# Initiative, used under its terms (hpo.jax.org); only identifiers and labels are kept here.
#
#   surfaces           written forms, longest matched first, on the normalised text; a form preceded by a negator is
#                      negated (see `negation`); a one-character form is read only at a clause boundary
#   surface_relations  a written form whose relation differs from the phenotype's
#   (a form listed under two phenotypes gives both: 寒热 is chills and fever, 咳唾脓血 hemoptysis and purulent sputum)
#   system             for grouping
hpo_release: hp/releases/2026-09-01

