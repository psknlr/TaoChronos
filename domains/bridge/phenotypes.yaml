# a written form read two ways: the reading whose cues are in the same sentence wins; with no cue, or a tie, the default
# is taken and the finding is marked for review (a model adjudicates it when one is configured)
ambiguous:
  - {surface: 不得卧, default: insomnia, readings: {orthopnea: [喘, 咳, 倚息, 短气, 上气, 坐, 肿, 水], insomnia: [烦, 眠, 寐, 心中, 虚]}}

# phrases in which no finding is read: a treatment, a resolution, a normal function, a theory word
blocked: [小便自利, 小便利, 小便自调, 小便清, 利小便, 通利, 清利, 利水, 下利止, 利止, 利不止, 汗出而解, 汗出则愈, 汗出愈, 得汗, 汗之,
          吐之, 下之, 可吐, 可下, 可汗, 渴止, 呕止, 热退, 热除, 身凉, 发汗, 解表, 表热, 里热, 热中, 热气, 热结, 热越, 邪热, 瘀热,
          热入, 热多, 寒多, 热之, 如淋, 热病, 病热, 实热, 虚热, 内热, 肿毒, 消肿, 利湿]

# modifiers read in the words around a finding (the clause it stands in)
modifiers:
  severity: {大: severe, 甚: severe, 剧: severe, 极: severe, 微: mild, 少: mild, 稍: mild}
  frequency: {时时: intermittent, 发作有时: periodic, 日再发: frequent, 间日: periodic, 频频: frequent}
  timing: {日晡: afternoon, 夜: night, 昼: day, 旦: morning, 暮: evening, 午后: afternoon, 食后: after_meals, 食前: before_meals}
  course: {久: chronic, 数年: chronic, 经年: chronic, 积经年岁: chronic, 暴: acute, 卒: acute, 猝: acute, 新: acute, 初起: onset, 始得之: onset, 反复: recurrent}

# the course a passage implies by its frame: an acute febrile disease counted in days, a chronic one in years
course_patterns:
  acute: ["[一二三四五六七八九十]{1,3}日", 太阳病, 阳明病, 少阳病, 太阴病, 少阴病, 厥阴病, 伤寒, 温病, 温疫, 时行, 天行, 疫]
  chronic: ["[一二三四五六七八九十数]{1,3}年", 经年, 积年, 久病, 虚劳, 痼疾]

# a negator before a finding (modifiers such as 大 甚 may stand between): 不渴, 无大热, 不能发黄, 身无汗
negation: "(?:不|无|未|非|勿|莫|弗|毋|不能|未尝|未曾)[大甚太复再得曾能]?$"

# clause openers that make a finding optional (或) or conditional (若); these count for less
optional: [或]
conditional: [若, 设, 假令, 倘, 如其]

# the population a passage speaks of
population: {男子: male, 丈夫: male, 妇人: female, 女子: female, 妊娠: female, 产后: female, 小儿: child, 婴儿: child, 老人: elderly, 年老: elderly}
