# 现代疾病表型谱 — screening profiles of modern diseases over HPO terms: the modern end of the Ancient–Modern Bridge.
#
# A profile lists the observable findings of a disease in three tiers (typical: cardinal, most patients; frequent: many;
# occasional: some), the findings that argue against it, and what a modern diagnosis needs that no ancient text can show
# (`confirm`: laboratory or imaging findings, `tests`), and the findings without one of which a resemblance stays low
# (`required`: any one of them — plague without buboes, mumps without swollen parotids).  The bridge scores an ancient description against these profiles
# and reports how far its findings are *compatible* with each disease — a qualitative level, never a probability that the
# patient of the text "had" the disease (no calibration data exist for that; see docs/bridge.md).
#
# The profiles are curated from standard clinical descriptions for research screening, not diagnosis; they need clinical
# review before any use beyond that.  HPO identifiers and labels checked against hp/releases/2026-09-01; ICD-10 codes
# from the WHO 2019 edition.  `concept` links a profile to the modern concepts of ../classics/modern_concepts.yaml (the
# candidates the curated senses of historical terms name).
release: {hpo: hp/releases/2026-09-01, icd10: WHO ICD-10 2019}
weights: {typical: 1.0, frequent: 0.6, occasional: 0.3, against: 0.8}
course_terms:
  acute: {id: "HP:0011009", label: Acute}
  chronic: {id: "HP:0011010", label: Chronic}
  episodic: {id: "HP:0025303", label: Episodic}
  recurrent: {id: "HP:0031796", label: Recurrent}
onset_terms:
  child: {id: "HP:0011463", label: Childhood onset}
  adult: {id: "HP:0003581", label: Adult onset}
  elderly: {id: "HP:0003584", label: Late onset}

diseases:
