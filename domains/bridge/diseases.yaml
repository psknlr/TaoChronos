    required: {"HP:0000103": Polyuria}
    frequent: {"HP:0000017": Nocturia, "HP:0001944": Dehydration, "HP:0012378": Fatigue}
    occasional: {"HP:0001824": Weight loss, "HP:0002315": Headache, "HP:0000805": Enuresis}
    against: {"HP:0003076": Glycosuria}
    confirm: {"HP:0003228": Hypernatremia}
