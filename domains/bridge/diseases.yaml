# ancient names that coincide with, or have been taken for, a modern disease name: a warning wherever the name appears
homonyms:
  - {term: 伤寒, diseases: [typhoid], note: 广义伤寒为外感热病总称，狭义伤寒为太阳表实证；与现代"伤寒"（伤寒沙门菌感染）同名异义}
  - {term: 中风, diseases: [ischemic_stroke, intracerebral_hemorrhage], note: 《伤寒论》之"中风"为外感表证；卒中义的"中风"见于《金匮》及后世}
  - {term: 霍乱, diseases: [cholera], note: 古籍"霍乱"泛指呕吐而利的急性吐泻病；真性霍乱一般认为1817年后传入中国}
  - {term: 痛风, diseases: [gout], note: 朱丹溪之"痛风"泛指四肢百节走痛（痹证），与现代痛风（尿酸盐沉积）同名异义}
  - {term: 脚气, diseases: [beriberi, tinea_pedis], note: 唐宋医书之"脚气"指脚弱、肿满、冲心之病；现代口语"脚气"指足癣}
  - {term: 消渴, diseases: [diabetes_mellitus, diabetes_insipidus], note: 消渴既作症状（口渴引饮）也作病名；"消渴=糖尿病"是不可接受的等同}
  - {term: 疟, diseases: [malaria], note: 古之"疟"以寒热休作为主，亦含疟疾以外的周期性发热病}
  - {term: 胸痹, diseases: [angina_pectoris], note: 胸痹以喘息咳唾、胸背痛、短气为主，范围不限于心绞痛}
  - {term: 肠痈, diseases: [appendicitis], note: 肠痈为腹内痈脓，不限于阑尾炎}
  - {term: 痫, diseases: [epilepsy], note: 古之"痫"兼含小儿惊风等}
  - {term: 瘰疬, diseases: [tuberculous_lymphadenitis], note: 瘰疬为颈腋结核累累之病，不限于淋巴结结核}
  - {term: 虚劳, diseases: [pulmonary_tuberculosis], note: 虚劳为诸虚不足之总称，远大于肺结核}
