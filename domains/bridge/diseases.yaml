    en: Diabetes mellitus
    icd10: E10-E14
    concept: modern:diabetes_mellitus
    system: metabolic
    course: chronic
    onset: [child, adult, elderly]
    typical: {"HP:0001959": Polydipsia, "HP:0000103": Polyuria, "HP:0002591": Polyphagia, "HP:0001824": Weight loss}
    required: {"HP:0000103": Polyuria, "HP:0001959": Polydipsia, "HP:0003076": Glycosuria}
    frequent: {"HP:0003076": Glycosuria, "HP:0012378": Fatigue, "HP:0000017": Nocturia, "HP:0100515": Pollakisuria, "HP:0000622": Blurred vision,
               "HP:0000989": Pruritus, "HP:0000217": Xerostomia}
    occasional: {"HP:0003401": Paresthesia, "HP:0033748": Hypoesthesia, "HP:0025615": Abscess, "HP:0100758": Gangrene, "HP:0031967": Cloudy urine,
                 "HP:0001259": Coma}
    against: {"HP:0100520": Oliguria}
    confirm: {"HP:0003074": Hyperglycemia, "HP:0001993": Ketoacidosis}
    tests: 空腹血糖、糖化血红蛋白、口服葡萄糖耐量试验
