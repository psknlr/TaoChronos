# 解经之学 — the vocabulary commentators explain the classics with, the words that mark their stance towards another
# commentator, and the forms of a gloss.  Used by `study commentaries` (集注对齐与注家比较), `study disputes` (争议)
# and `study glosses` (训诂).  Curated from the commentary literature for comparison, not expert-reviewed: extend and
# correct it here.  All forms are matched on the normalised text (simplified characters; 荣 and 营 both kept).
#
# concepts: `id` is what the comparison counts; `forms` are the written forms that mark it (single characters are
# avoided — 表 alone is in 表里, 表证, 发表 …); `group` sorts the page.

