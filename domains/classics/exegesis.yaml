# the stance of a commentator towards a named predecessor, read in the sentence after the name (or in the next one).
# After a direct quotation (曰, 云) the words that follow are the quoted physician's own — 丹溪曰：气无补法，世俗之误也
# is 丹溪 rejecting the vulgar, not a rejection of 丹溪 — so there a marker counts only after the closing quotation mark
# or in a phrase that refers back to the quoted view (`refer`: 此说非也, 其言谬矣); after an indirect report (谓, 以为,
# 之说) it counts anywhere in the two sentences, except in a hypothetical (若作阴冷看，误矣 rejects a misreading).
stance:
  refer: "(?:此|其|是|斯|彼|前|上|二|两)(?:说|言|论|语|法|注|解|议|辨|义)"
  # the author turning on others than the named one (近世之医 … 是未达): a marker after them is not about the name
  others: "世医|时医|俗医|庸医|今人|近世|后人|后世|世人|时人|俗工|俗子|今之医|近之医|或者|或人|诸家|诸注|前人|古人|昔人|旧说|古方|古法|方书|诸方|诸书"
  # markers that are someone's act (景岳驳之): a name just before them is the one who rejects, not the author
  acts: "驳之|(?:辨|正)其(?:非|误|谬|失)|非之|斥之|讥之|訾之"
  hypothetical: "(?:若|如|倘|或|苟)[^。；]{0,12}$"
  reject:
    - "非也"
    - "非是"
    - "(?:大|甚)?(?:谬|误)(?:矣|也|甚|哉)"
    - "(?:此|其|是|斯)(?:说|论|言|解|注)[^，。；]{0,4}(?:非(?:也|矣|是|理|[，。；])|谬|误|不然|未必|不足)"
    - "不然(?:也|矣)"
    - "未必(?:然|是)"
    - "恐非"
    - "殊非"
    - "殊不知"
    - "岂知"
    - "不可从"
    - "不足(?:信|据|凭|取|法)"
    - "未(?:达|当|妥|确)"
    - "牵强"
    - "附会"
    - "臆(?:说|断|度)"
    - "失之(?:远|甚|矣)"
    - "非[^，。；]{1,8}之(?:旨|意)"
    - "何其[^，。；]{0,6}(?:谬|误|陋)"
    - "驳之"
    - "(?:辨|正)其(?:非|误|谬|失)"
  endorse:
    - "(?:甚|极|诚|良|最|深)是"
    - "(?:最|深|独)得"
    - "可从(?:也|矣|[。，；])"
    - "确(?:论|解)"
    - "(?:精|至|允)当"
    - "甚(?:确|精|善|妙)"
    - "(?:至|名)论"
    - "卓(?:识|见)"
    - "知言"
    - "得(?:其|经)(?:旨|要|意)"
  # words after a name that report a view (the name + one of these is a citation of that commentator)
  report: "(?:氏)?(?:曰|云|谓|言|论(?![中内])|注|解|释|以为|所谓|所云|所言|所论|所注|之说|之论|之注|之言|之解|之法|有云|有言|亦云|亦谓|独谓|乃谓|则谓|又谓|又云)"

# the forms of a gloss (训诂): what a commentator says a word or phrase means
glosses:
  - {kind: 者也, pattern: "(?P<head>[一-鿿]{1,6})者[，,]?(?P<gloss>[^，。；]{1,24})也"}
  - {kind: 谓, pattern: "(?P<head>[一-鿿]{1,6})[，,]?(?:谓|言)(?P<gloss>[^，。；]{2,24})(?:也)?[，。；]"}
  - {kind: 犹, pattern: "(?P<head>[一-鿿]{1,4})[，,]?犹(?:言)?(?P<gloss>[^，。；]{1,16})也"}
  - {kind: 即, pattern: "(?P<head>[一-鿿]{1,4})[，,]?即(?P<gloss>[^，。；]{1,12})也"}
  - {kind: 貌, pattern: "(?P<head>[一-鿿]{1,4})[，,]?(?P<gloss>[^，。；]{1,12}貌)(?:也)?"}
  - {kind: 音, pattern: "(?P<head>[一-鿿])[，,]?音(?P<gloss>[一-鿿]{1,2})"}
  - {kind: 反切, pattern: "(?P<head>[一-鿿])[，,]?(?P<gloss>[一-鿿]{2})(?:切|反)"}
  - {kind: 读为, pattern: "(?P<head>[一-鿿]{1,2})[，,]?(?:读为|读若|读曰|读作|当读)(?P<gloss>[一-鿿]{1,3})"}
  - {kind: 通, pattern: "(?P<head>[一-鿿])(?:与|同|通)(?P<gloss>[一-鿿])(?:同|通)"}
  - {kind: 异文, pattern: "(?P<head>[一-鿿]{1,4})[，,]?(?:一作|一云|又作|或作|别本作)(?P<gloss>[一-鿿]{1,6})"}
  - {kind: 校改, pattern: "(?P<head>[一-鿿]{1,4})[，,]?(?:当作|疑作|疑是|当是|疑为)(?P<gloss>[一-鿿]{1,6})"}
