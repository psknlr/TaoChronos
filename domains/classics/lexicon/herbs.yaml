# Materia medica (药物). `synonyms` carry a kind: taboo_rename (避讳改名),
# part_name, processing_variant, abbreviation, variety, alias. Normalisation
# maps every synonym to the canonical herb but keeps the surface form and the
# synonym kind on the claim argument, so the skeptic can inspect the risk.
