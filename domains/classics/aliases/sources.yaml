# The sources of the alias layer (ADR 0023), and the years of the works a name is credited to: those the 本草纲目's 释名
# brackets credit and the classical books the NTU table's remarks cite.
#
# `ship: true` sources may reach what is published — the repository, home.zip, the container, tables.js; `aliases
# check` refuses a shipped record crediting any other.  `class`: open (a list released openly, or the project's own
# decisions), nc (a list released under a non-commercial licence, shipped credited while the site stays non-commercial:
# the NTU table, CC BY-NC 4.0, by IMPF-AI's decision of 2026-10-18 — its faithful extract under corpus/aliases/,
# pinned, read by every build), derived (facts the build reads off the store's texts or the project's data, each with
# its witness ids), local (lists without a licence that allows publishing: imported under <data>/aliases/local/ with a
# pin, read only by profiles/full-corpus-local.yaml).  `label` is how an answer credits the source.  Never read at
# runtime: the build writes the labels into the header of aliases.jsonl.
version: 1
sources:
  - id: bielu-jc
    title: 本草纲目别名录
    via: 中醫笈成, store book jc_c030 (笈成檢閱系統 v1.4.8)
    licence: CC0 1.0
    attribution: 中醫笈成整理本（CC0 1.0），使用时请注明来自中醫笈成（https://jicheng.tw/tcm/copyright.html）
    ship: true
    class: open
    store_book: jc_c030
    label: 别名录（中醫笈成）
  - {id: curated, title: 编者审定（domains/classics/aliases/curated.yaml，每条附见证段落）, licence: project, ship: true,
     class: open, label: 编者审定}
  - {id: store, title: 古籍互证（库内古籍的“一名”、注文与本草条目，附段落编号）, licence: derived, ship: true, class: derived,
     label: 古籍互证}
  - {id: shiming, title: 本草纲目释名（库内本草纲目各条“释名”所注出处）, licence: derived, ship: true, class: derived,
     label: 纲目释名}
  - {id: taboo, title: 避讳改字（domains/classics/taboo.yaml 中两侧皆为药名者）, licence: derived, ship: true, class: derived,
     label: 避讳}
  - {id: lexicon, title: 全库词表（lexicon、lexicon-supplement、lexicon-harvested）所收同名之他药，及同一药另立之词条名,
     licence: derived, ship: true, class: derived, label: 词表}
  - id: bielu-gb
    title: 本草纲目别名录（GitHub 上的 GB18030 本）
    licence: none stated
    ship: false
    class: local
    label: 别名录（GB本）
  - {id: hurb, title: hurbTable（据 zhongyoo.com 整理）, licence: none stated, ship: false, class: local, label: hurbTable}
  - id: ntu40k
    title: Large List of Chinese Drug Names 40K
    doi: 10.21979/N9/V2XBOH
    licence: CC BY-NC 4.0
    licence_uri: https://creativecommons.org/licenses/by-nc/4.0/
    attribution: >-
      Chong, William Eng Keat; Stanley-Baker, Michael, 2019, Large List of Chinese Drug Names 40K, DR-NTU (Data), V1
      (author order and version unverified), https://doi.org/10.21979/N9/V2XBOH, CC BY-NC 4.0: non-commercial use, with
      credit
    ship: true
    class: nc
    # the dataset's workbook (`taochronos aliases import ntu FILE` warns when another is read) and the committed extract
    # the build reads (it warns when the extract is not this one)
    pin:
      file: ChineseDrugEthnonymsSynonymyTable.xlsx
      rows: 50606
      sha256: 3a4cf287234f69dea286b136a293baea85d2ad8ad9cd187b83b17b9ab981342c
      extract: {file: corpus/aliases/ntu40k.tsv, rows: 50606,
                sha256: dd85440142977877991110f127a7d284c54f74a46104c4a1542b3ba027ea5641}
    label: NTU 40K（CC BY-NC 4.0）
