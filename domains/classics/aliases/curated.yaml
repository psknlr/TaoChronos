  - {s: 猪椒, head: 蔓椒, status: open, wit: [jc_c000.01238, qianjin_yaofang.036.02551], why: 名医：一名猪椒；千金猪椒根皮皆此药}
  - {s: 瓦松, head: 昨叶何草, status: open, wit: [zhenglei_bencao.011.07637, jc_i102.09232], why: 昨叶何草一名瓦松，书中皆作药}
