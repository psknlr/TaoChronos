  - {s: 灶突墨, status: open, wit: [qianjin_yaofang.003.00409], why: 灶突墨即百草霜一类，本库无他义}
  - {s: 烧针, head: 火针, status: open, wit: [jc_m100.00987, jc_a001.01705], why: 脉经同条一作加烧针、一作加火针；焠针，火针也}
