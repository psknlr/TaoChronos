# The editors' decisions for the alias layer (ADR 0023), read only by `taochronos aliases build`.  Every row names at
# least one witness passage of the store (`wit`: passage ids, never the 别名录 jc_c030 itself), and none may name a
# string of the held-out half of the alias gold (evals/gold/aliases.yaml): `taochronos aliases check` refuses both.
# Names are written as the texts write them; the build normalises them.
# Most rows are four editors' reading of `taochronos aliases review`'s sheet (240 names, 10-20 passages each, the
# runtime's own gates splitting a name's free occurrences); names the review left to the build's rules have no row.
# Rows under "NTU 40K review" are the same reading of the sheet's 400 names that the NTU table (CC BY-NC 4.0,
# shipped by the decision of 2026-10-18) brings into the layer and the store writes most; ranks 2, 6 … 398 are not
# read yet.
version: 1

# word-level conversion errors both copies of the 别名录 share (ingest/aliases.py REPAIRS holds the same; a test keeps
# the two equal)
repairs:
  - {from: 野狼, to: 狼}
  - {from: 浓朴, to: 厚朴}
  - {from: 浓皮, to: 厚皮}

# heads of 别名录 entries (store book jc_c030) the transcription lost or wrote otherwise, each checked on the web store
head_repairs:
  - {passage: jc_c030.00049, head: 青琅玕, wit: [jc_c000a.00321], why: 「青琅　」；本经：青琅玕，一名石珠}
  - {passage: jc_c030.00134, head: 赤箭, wit: [jc_c000.00196],
     why: 纲目合题「赤箭天麻」；本经赤箭条：一名离母，一名鬼督邮（天麻见 same_drug）}
  - {passage: jc_c030.00371, head: 木通, wit: [jc_d025a.00026],
     why: 纲目之「通草」即今木通（择通草者，鲜知木通之别号）；「通草」本身见下 pairs，分期}
  - {passage: jc_c030.00499, head: 水斳, wit: [jc_c000a.00212], why: 「苦　」；本经：水斳，一名水英}
  - {passage: jc_c030.00632, head: 枳椇, wit: [jc_d075a.00650], why: 「枳　」；枳椇一名鸡距，一名木蜜}
  - {passage: jc_c030.00663, head: 蘗木, wit: [jc_c000a.00183], why: 录文作「柏木」；本经：蘗木，一名檀桓}
  - {passage: jc_c030.00820, head: 䗪虫, wit: [ws_36bca7b992.00352, jc_c003.02946],
     why: 「蟲（地鱉　地蜱蟲　蚵　蟲　土鱉　簸箕蟲　過街）」头脱「䗪」；本经蟅虫一名地鳖；唐本：一名地鳖，一名土鳖}
  - {passage: jc_c030.00826, head: 蜚虻, wit: [jc_c000a.00360, jc_c003.02937],
     why: 「蜚蟲（虻蟲）」即纲目蜚虻条（本经蜚䖟）；唐本：方家所用，惟是蜚虻}
  - {passage: jc_c030.00317, head: 藜芦, wit: [jc_c000a.00250], why: 录文倒作「蘆藜」；本经：藜芦，一名葱苒}
  - {passage: jc_c030.00410, head: 荇菜, wit: [jc_c002.01956],
     why: 录文「苦菜」当作「莕菜」（纲目莕菜释名凫葵、水葵、水镜草、靥子菜、金莲子、接余）；别录凫葵即荇菜，一名接余}
  - {passage: jc_c030.00833, head: 蚯蚓, wit: [jc_d046.00360, jc_c001.00204],
     why: 录文倒作「蚓蚯」；地龙又名蚯蚓；吴普白颈蚯蚓一名附蚓、寒蚓}

# names of one drug the lexicon files apart.  The first name names the group: the 别名录's head where it has one and
# the store writes it, else the name the store writes most (罂粟, 旱莲草).  The build ties every other member to it
# (异写 where one character differs) unless a pair already does, its witnesses the row's that write the member.
same_drug:
  # minerals
  - {names: [丹砂, 朱砂, 辰砂], wit: [jc_c040.00233], why: 丹砂，一名朱砂……惟辰州者最胜，故谓之辰砂}
  - {names: [铅丹, 黄丹], wit: [jc_c000.00977, tangye_bencao.003.00874], why: 陶弘景：即今熬铅所作黄丹也；汤液本草铅丹条：黄丹也}
  - {names: [黑铅, 铅], wit: [ruizhutang.004.00081, jc_c104.00006], why: 黑锡又名黑铅，即铅（与白锡别）；单字「铅」检索不到，并入黑铅}
  - {names: [粉锡, 胡粉, 铅粉], wit: [jc_c040.00264, jc_h023.00343], why: 胡粉，一名粉锡，即化铅所作；胡粉即真铅粉也}
  - {names: [芒硝, 芒消], wit: [zhenglei_bencao.003.01842, cm_shanghan_npm.02397], why: 芒消是朴消中炼出、形似麦芒者；消、硝异写}
  - {names: [玄明粉, 元明粉], wit: [zhenglei_bencao.003.01884, mg_nuke_jiyao.00140], why: 以朴消制伏为玄明粉；元明粉即制朴硝（避讳作元）}
  - {names: [砒石, 砒霜], wit: [jc_o050.05078, jc_c029.00297], why: 砒霜为砒之升炼者（霜以形色言），一名信石；纲目合为一条}
  - {names: [礞石, 青礞石], wit: [furen_daquan.011.00577], why: 礞石元用青礞石}
  - {names: [慈石, 磁石], wit: [ws_36bca7b992.00137, jc_c000a.00217], why: 本经同条一本作慈石、一本作磁石（一名玄石）}
  # plants
  - {names: [黄柏, 黄檗, 黄蘗, 黄蘖, 蘗木],
     wit: [jc_c040.00510, bencao_baizhonglu.000.00092, yizhi_xuyu.002.00390, jc_c006.00580, jc_c000a.00183],
     why: 黄檗，俗名黄柏；黄蘗、黄蘖为同药异写；图经：柏木，黄柏也……其根名檀桓（本经蘗木条：蘗木，一名檀桓）；百种录蘗木条释作黄蘗、黄柏}
  - {names: [赤箭, 天麻], wit: [jc_c000.00199], why: 今医家见用天麻，即是此赤箭根}
  - {names: [蚤休, 重楼], wit: [jc_c000.01159], why: 蚤休……曰重楼金线}
  - {names: [酸枣, 酸枣仁], wit: [jc_c006.00586], why: 图经酸枣条：取核中仁……酸枣仁汤}
  - {names: [牡丹, 牡丹皮], wit: [tangye_bencao.003.00671], why: 汤液本草牡丹皮条：牡丹乃天地之精……牡丹皮}
  - {names: [诃黎勒, 诃子], wit: [jc_c029.00082], why: 诃子……又名诃黎勒}
  - {names: [芜菁, 蔓菁], wit: [jc_c018a.00518, jc_l008.01350], why: 蔓菁子即芜菁；唐本北人又名蔓菁子}
  - {names: [菖蒲, 昌蒲], wit: [xiaoer_weisheng_zongwei.005.00457, jc_d025a.01389], why: 石昌蒲一寸九节者良：昌蒲即菖蒲古写}
  - {names: [莨菪, 莨菪子], wit: [jc_c006.00459], why: 图经莨菪子条：一名天仙子，本经云莨菪}
  - {names: [蒺藜, 蒺藜子, 刺蒺藜], wit: [jc_d004a.02107, jc_c018a.00240, jc_c007.00163],
     why: 疗肿蒺藜散方：蒺藜子一升；蒺藜子条品类：刺蒺藜三角有刺，风家宜之（与沙苑蒺藜别）；衍义：风家惟用刺蒺藜}
  - {names: [芡实, 鸡头实], wit: [jc_d005.09595, xianxingzhai_biji.004.00731], why: 服莲芡实方：取鸡头实；鸡头实条：一云芡实}
  - {names: [萎蕤, 葳蕤, 女萎萎㽔, 萎蕤女萎],
     wit: [jc_d024.00113, zhenglei_bencao.006.03890, jc_c000.00135, zhenglei_bencao.006.03886],
     why: 同一药性论条文一作葳蕤、一作萎蕤；词表女萎萎㽔、萎蕤女萎二条所收玉竹、地节、马熏皆萎蕤之名（吴普：女萎一名葳蕤、地节、玉竹）}
  - {names: [卫矛, 鬼箭羽], wit: [jc_c029.00169, jc_c000a.00199], why: 鬼箭羽……一名卫矛；卫矛一名鬼箭}
  - {names: [枫香脂, 白胶香], wit: [bencao_jingshu.012.02118, jc_c040.00538], why: 枫香脂……一名白胶香；枫香是枫树脂，即白胶香}
  - {names: [川楝子, 金铃子, 楝实], wit: [jc_c040.00520, zhenglei_bencao.014.09601], why: 川楝子号金铃；楝实即金铃子也}
  - {names: [蓬蘽, 蓬蔂], wit: [zhenglei_bencao.023.13906, jc_c000a.00085], why: 同一本经条文（一名覆盆），一作蓬蘽，一作蓬蔂}
  - {names: [罂粟, 罂子粟, 莺粟米],
     wit: [xuanming_lunfang.009.00301, chuanxin_shiyong.002.00398, jc_o033.00146, quansheng_zhimi.003.00241],
     why: 御米即莺粟（莺粟神圣散用御米壳，御米饮子用婴粟壳）；御米条：此即罂粟子也；罂粟汤用其子}
  - {names: [地肤, 地肤子], wit: [waitai_miyao.028.05040, jc_d004.10890, jc_c000.00319],
     why: 「一云地麦，地肤、地肤子也」；地麦草一名地肤草；本经地肤子条一名地麦}
  - {names: [柳华, 柳花], wit: [zhenglei_bencao.014.09558, jc_c000a.00198], why: 同一本经条：一本作柳华，一本作柳花，并一名柳絮}
  - {names: [茺蔚子, 充蔚子], wit: [jc_c000a.00013, ws_36bca7b992.00058, jc_c000.00131], why: 同一本经条：一本题茺蔚子，一本题充蔚子，并一名益母、益明}
  - {names: [旱莲草, 鳢肠], wit: [jc_d076.00244, jc_o059.03412], why: 莲子草（别名录鳢肠之名）即旱莲草；旱莲草即墨汁草}
  - {names: [牛蒡子, 恶实, 鼠黏子], wit: [jc_c029.00121, jc_c007.00207], why: 鼠黏子一名牛蒡子，一名大力子，一名恶实；恶实今谓之牛蒡，未去萼时又谓之鼠黏子}
  - {names: [莱菔, 萝卜], wit: [jc_c040.00658, jc_c029.00346], why: 莱菔，即萝卜也；莱菔根俗云萝卜}
  - {names: [荆芥, 假苏], wit: [jc_c029.00024, yishuo.002.00204], why: 荆芥……（一名假苏）；假苏是荆芥（别名录本条不在本库）}
  - {names: [菟丝, 菟丝子], wit: [jc_c000.00123, jc_c000a.00011, jc_d045.00041],
     why: 吴普菟丝（一名玉女、赤网）即本经菟丝子条（一名菟芦）；方中「菟丝（子一两半）」即菟丝子}
  # animals
  - {names: [蜚虻, 虻虫], wit: [jc_c003.02938], why: 唐本注：蜚虻状如蜜蜂……今俗用多以此也；虻虫即蜚虻（见 head_repairs、pairs）}
  - {names: [萤火, 荧火], wit: [jc_c000.01316, jc_c000.01314], why: 萤飞虫，萤火也；吴普荧火一名景天、挟火，与萤火同名}
  - {names: [䗪虫, 蟅虫, 土鳖虫], wit: [cm_jingui_dengzhen.00423, jc_c046.01071, jc_j012.00054],
     why: 大黄䗪虫丸一作大黄蟅虫丸；䗪虫一名土鳖，伤科写作土鳖虫}
  - {names: [斑蝥, 斑猫], wit: [jc_o067.04362, jc_c000.01280], why: 同炒法一作斑蝥、一作斑猫；吴普斑猫一名斑蚝}
  - {names: [蝉蜕, 蝉壳], wit: [jc_d002.04653, jc_d001.00742], why: 别录蚱蝉条「壳名枯蝉」，食疗作「蝉壳主小儿痫」：即蚱蝉之蜕}
  - {names: [鹿角胶, 白胶], wit: [jc_c000a.00114, ws_36bca7b992.00119], why: 本经白胶一名鹿角胶（白胶香为枫香脂，自成 blocker）}
  - {names: [鸡内金, 鸡肫皮], wit: [jc_c021.01752, jc_o071.01222], why: 鸡肫皮（一名鸡内金）；鸡内金（即鸡肫皮，烧存性）；词表只收鸡肫皮}
  # NTU 40K review (2026-10-18): names of one drug the lexicon or the NTU table files apart, the first naming it
  # · minerals
  - {names: [矾石, 白矾], wit: [shengji_zonglu_zuanyao.008.01837, waitai_miyao.026.04114],
     why: 矾石汤（脚气冲心）方用白矾一两；外台矾石散方用吴白矾；词表白矾条兼收矾石}
  - {names: [朴硝, 朴消], wit: [jc_c000.00023, zhenglei_bencao.003.01863], why: 本经序录作朴硝，证类本经条作朴消（一名消石朴）：消、硝异写，与芒硝、芒消同例}
  - {names: [硝石, 消石], wit: [cm_jingui_dengzhen.00793, jc_m100.01145], why: 同一女劳疸条，金匮作消石矾石散主之，脉经作硝石矾石散主之：消、硝异写}
  - {names: [浮石, 海浮石], wit: [yilei_yuanrong.002.00201, jc_c025a.00689, jc_d016.02340],
     why: 夺命丹先列海浮石（醋淬七次），后云以浮石醋打面糊丸；海石即书所云浮石者，水沫结成}
  # · plants
  - {names: [赤芍, 赤芍药], wit: [jc_p0010a.00109, jc_p0009a.00124], why: 同一方之方歌作赤芍、方剂作赤芍药，二者同药}
  - {names: [苏叶, 紫苏叶], wit: [cm_jingui_dengzhen.01052, quansheng_zhimi.003.00231, tab_619_0a7261aa40.00238],
     why: 金匮半夏厚朴汤用干苏叶，全生指迷同方作紫苏叶，四七汤（即此方）又作苏叶；词表紫苏叶条兼收苏叶}
  - {names: [灯心, 灯心草], wit: [jc_i104.00386, jc_l103.00052], why: 方中灯心（一钱）、灯心草皆灯心草茎髓，书中无他义；词表灯心草条兼收灯心}
  - {names: [麻仁, 火麻仁], wit: [piweilun.003.00363, waitai_miyao.022.03420, jc_n009.00783],
     why: 同方先列麻子仁，后云除麻仁另研；外台麻仁丸方用麻子仁；词表火麻仁条兼收麻子仁、麻仁}
  - {names: [粟壳, 罂粟壳], wit: [jc_c029.00241, jc_n011.00090, puji_benshi.004.00253],
     why: 粟壳性涩，治泄痢嗽怯，即罂粟壳之用（久痢方用罂粟壳）；方书或写作樱粟壳}
  - {names: [莪术, 蓬莪术], wit: [jc_c025a.00883, renzhai_zhizhi.026.03025],
     why: 蓬术与三棱并列，下文释作莪术；增损四物汤蓬莪术、京三棱并用，即三棱莪术之对；词表莪术条兼收蓬莪术、蓬术}
  - {names: [旋覆花, 旋复花], wit: [cm_jingui_wuqian.00395, cm_jingui_dengzhen.00614, jc_b102.00613, cm_jingui_wuqian.00914],
     why: 同一金匮肝着条、同一旋覆花汤（三两、葱十四茎、新绛少许），一本作旋覆花、一本作旋复花：复、覆异写}
  - {names: [牵牛子, 黑牵牛], wit: [ws_f0f5addb51.00155, jc_c029.00096], why: 黑丑即黑牵牛；牵牛有黑白二种（黑者属水力速），皆牵牛子}
  - {names: [石韦, 石苇], wit: [qianjin_yaofang.059.04009, jc_d004.11172], why: 本经石韦，方书多写作石苇（石苇散方：石苇二两去毛）：韦、苇异写}
  - {names: [瓜蒂, 甜瓜蒂], wit: [jc_c000.00549, wenyilun_skqs.001.00054], why: 本经瓜蒂，陶弘景云甜瓜蒂也；瓜蒂散方作甜瓜蒂（一钱）、赤小豆：一药}
  - {names: [薏苡仁, 薏苡人], wit: [yilei_yuanrong.001.00068, cm_jingui_wuqian.00066],
     why: 同一仲景麻黄杏仁薏苡甘草汤，一书作薏苡仁，吴迁本金匮作薏苡人：人、仁古通}
  - {names: [龙胆, 龙胆草], wit: [jc_c000a.00025, jc_o068.02448, jc_p0801.03452, jc_d075a.00544],
     why: 本经龙胆以根入药，方书称龙胆草（龙胆草、防风等分为末；龙胆草七分），一药；龙胆泻肝汤组成作龙胆草，方义作龙胆}
  - {names: [砂仁, 缩砂, 缩砂仁, 缩砂蜜, 缩砂蔤],
     wit: [jc_c040.00402, hejiju_fang.005.00406, bencao_jingshu.009.01726, bencao_chengya.008.01429],
     why: 缩砂（去皮取仁用）即缩砂仁，今称砂仁；纲目题缩砂蔤，本草经疏作缩砂蜜：一药五名，词表分立五条}
  - {names: [桑白皮, 桑根白皮], wit: [jc_d004a.00797, waitai_miyao.033.06463], why: 同方先列桑根白皮一斤，后云先煮枣并桑白皮；桑白皮散方用桑根白皮（六两）}
  - {names: [榆白皮, 榆皮], wit: [qianjin_yaofang.061.04176, waitai_miyao.031.05705], why: 榆皮通滑泄热煎、榆皮汤二方皆用榆白皮}
  - {names: [蕤仁, 蕤核], wit: [jc_c104.00228, jc_c018a.00374], why: 雷公：凡使蕤核仁，以汤浸去皮尖；蕤仁条炮制：取仁，浸去皮尖——蕤核之仁即蕤仁}
  - {names: [胡桃, 胡桃肉, 胡桃仁, 核桃仁],
     wit: [jc_c025a.00203, jc_d057.01295, shouqin_yanglao.001.00374, jc_c028.00133, jc_c028.00134],
     why: 胡桃肉条即称胡桃（专入命门）；补肾丸方一作胡桃肉、一作胡桃仁（并汤浸去皮）；核桃仁条：即胡桃}
  # · animals
