  - {s: 蔓菁, status: open, wit: [jc_c018a.00518, jc_d016.02397], why: 蔓菁即芜菁，食药同物；天蔓菁见 cover_stops}
  - {s: 核桃, status: open, wit: [jc_o042.00871, jc_d036.00353], why: 核桃即胡桃（核桃肉、核桃仁），如核桃见 cover_stops}
