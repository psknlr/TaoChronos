  - {s: 闹羊花, head: 羊踯躅, status: open, wit: [jc_c019.01110, jc_j012.00014], why: 羊踯躅即闹羊花，书中皆作药}
  - {s: 皂角, status: open, wit: [jc_o013.00378, jc_k104.00041], why: 同条先写皂角后称皂荚；皂角末、猪牙皂角皆药；如皂角见 cover_stops}
  - {s: 元参, status: open, wit: [jc_c000.00651, jc_l102.00067], why: 广雅「鹿肠，元参也」；避讳改写之玄参，本库无他义}
