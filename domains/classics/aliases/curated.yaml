  - {s: 佛耳草, status: open, wit: [xuanming_lunfang.009.00300], why: 佛耳草即鼠曲草，宋元咳嗽方用之}
  - {s: 白胶香, head: 枫香脂, status: open, wit: [jc_c040.00538, qianjin_yaofang.018.01579], why: 枫树脂，方中皆作药}
