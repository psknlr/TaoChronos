# gate overrides: a name's status for one drug (head), or for all of its drugs where no head is given; the first row
# that fits wins
decisions:
  # the drug wherever the store writes the name
  # · minerals
  - {s: 朱砂, status: open, wit: [zhouhou_beiji.001.00172, jc_c040.00233], why: 本库之朱砂皆丹砂（为衣、研飞亦是药）}
  - {s: 辰砂, head: 丹砂, status: open, wit: [jc_c040.00233, puji_benshi.002.00053], why: 辰州丹砂，方中皆作药名}
  - {s: 海石, status: open, wit: [jc_c025a.00689, jc_n011.00027], why: 海石即书所云浮石；痰郁用海石}
  - {s: 黑锡, status: open, wit: [ruizhutang.004.00081, jc_d057.02294], why: 黑锡又名黑铅；方名见 cover_stops}
  - {s: 青礞石, status: open, wit: [jc_d014.00666], why: 青礞石即礞石（见 same_drug）}
  - {s: 黄丹, head: 铅丹, status: open, wit: [jc_c000.00977, waike_lili.008.02252], why: 方书之黄丹皆熬铅所作之铅丹，膏药常用}
  - {s: 铜绿, head: 铜青, status: open, wit: [jc_c040.00265, jc_i103.00440], why: 铜青、铜绿一物（以醋沃铜上即生），方中皆作药}
  - {s: 砒霜, head: 砒石, status: open, wit: [jc_c029.00297, waike_jingyi.002.00184], why: 砒之炼者，书中皆作药}
  - {s: 信石, head: 砒石, status: open, wit: [jc_c029.00297, jc_o050.05078], why: 砒霜一名信石（出信州），书中皆作药}
  - {s: 元明粉, head: 玄明粉, status: open, wit: [mg_nuke_jiyao.00140, jc_e016.00011], why: 元明粉即制朴硝，书中皆作药}
  - {s: 青盐, head: 戎盐, status: open, wit: [jc_c000.00988, jc_d025.02494], why: 词表青盐条兼收戎盐；名医谓戎盐北海者青；本库青盐皆入药之盐（千金以下）}
  - {s: 花蕊石, status: open, wit: [bencao_jingshu.005.01226, jc_c007.00095], why: 花乳石散用花蕊石；图经易花乳石之名为花蕊石}
  - {s: 定粉, status: open, wit: [jc_h004.00838, jc_c040.00264], why: 定粉（即粉锡）；胡粉一名粉锡，一名定粉}
  - {s: 胡粉, head: 粉锡, status: open, wit: [jc_c040.00264, jc_i300.00376], why: 胡粉一名粉锡，方中皆作药（见 same_drug）}
  - {s: 铅粉, head: 粉锡, status: open, wit: [jc_h023.00343, jc_o007a.01855], why: 胡粉即真铅粉；水粉即铅粉；方中皆作药}
  - {s: 水粉, head: 粉锡, status: open, wit: [jc_o007a.01855, jc_f100.00700], why: 水粉即铅粉，膏药、掺药常用，书中无他义}
  - {s: 皂矾, status: open, wit: [jc_i009.00504, jc_f100.00374], why: 绿矾条注即皂矾；煅赤、醋淬入药}
  - {s: 青矾, status: open, wit: [jc_d025.09327, furen_daquan.004.00021], why: 青矾即绿矾，与黄矾、白矾、绛矾并列入药}
  - {s: 铅白霜, status: open, wit: [jc_o050.05100, jc_c104.00007], why: 铅白霜取法与图经铅霜同（铅杂水银作片，置醋瓮中）}
  # · plants
  - {s: 诃子, status: open, wit: [jc_d013.00132, jc_c029.00082], why: 诃子即诃黎勒，本库无他义}
