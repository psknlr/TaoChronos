  - {s: 玉竹, status: open, wit: [jc_c000.00135, jc_d070.00034], why: 吴普女萎一名葳蕤、一名玉竹；葳蕤汤方歌即写玉竹；清方皆入药}
  - {s: 兰香, status: open, wit: [jc_h000a.00745, lanshi_micang.002.00262], why: 兰香叶（菜名），即罗勒；兰香子、兰香散皆此物}
  - {s: 圆眼, status: open, wit: [jc_g026.02024, jc_f013.00262], why: 圆眼肉即龙眼肉，入药；丸如圆眼大者见 cover_stops}
  - {s: 旱莲草, status: open, wit: [jc_d076.00244, jc_n022.00518], why: 莲子草即旱莲草（鳢肠一名莲子草）；本库皆入药}
  - {s: 孩儿茶, status: open, wit: [jc_c039.02335, jc_f018.00060], why: 乌爹泥条：即孩儿茶；孩子茗即孩儿茶}
  - {s: 麻勃, status: open, wit: [jc_c000a.00215, jc_d025.05640], why: 麻蕡一名麻勃，麻花上勃勃者；七月七日麻勃，皆入药}
  - {s: 靛花, status: open, wit: [ws_36bca7b992.00070, jc_c029.00249], why: 靛花，即青黛；本库皆入药}
  - {s: 汉椒, status: open, wit: [jc_i300.00087, boji_fang.002.00143], why: 汉椒（三分，出汗，去目），蜀椒之制法；本库皆入药}
  - {s: 鹅不食草, status: open, wit: [jc_l008.01365, jc_l006.00071], why: 石胡荽亦名鹅不食草；本库皆入药}
  - {s: 萝卜, head: 莱菔, status: open, wit: [jc_c040.00658, jc_f100.00384], why: 莱菔即萝卜（见 same_drug）；萝卜子另为一药，已作 blocker}
  - {s: 乌喙, head: 乌头, status: open, wit: [jc_c000a.00241, qianjin_yaofang.006.00700], why: 本经乌头一名乌喙；方书乌喙（炮）皆作乌头类用，书中无他义}
  - {s: 干枣, head: 大枣, status: open, wit: [jc_c000.00520, jc_d053.00032], why: 名医：大枣一名干枣；方中干枣（擘）即大枣}
  - {s: 白姜, head: 干姜, status: open, wit: [chanbao_zhufang.000.00094, furen_daquan.005.00188],
