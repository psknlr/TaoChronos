# The editors' decisions for the alias layer (ADR 0023), read only by `taochronos aliases build`.  Every row names at
# least one witness passage of the store (`wit`: passage ids, never the 别名录 jc_c030 itself), and none may name a
# string of the held-out half of the alias gold (evals/gold/aliases.yaml): `taochronos aliases check` refuses both.
# Names are written as the texts write them; the build normalises them.
# Most rows are four editors' reading of `taochronos aliases review`'s sheet (240 names, 10-20 passages each, the
# runtime's own gates splitting a name's free occurrences); names the review left to the build's rules have no row.
version: 1

# word-level conversion errors both copies of the 别名录 share (ingest/aliases.py REPAIRS holds the same; a test keeps
# the two equal)
repairs:
  - {from: 野狼, to: 狼}
  - {from: 浓朴, to: 厚朴}
  - {from: 浓皮, to: 厚皮}

# heads of 别名录 entries (store book jc_c030) the transcription lost or wrote otherwise, each checked on the web store
head_repairs:
  - {passage: jc_c030.00049, head: 青琅玕, wit: [jc_c000a.00321], why: 「青琅　」；本经：青琅玕，一名石珠}
  - {passage: jc_c030.00134, head: 赤箭, wit: [jc_c000.00196],
     why: 纲目合题「赤箭天麻」；本经赤箭条：一名离母，一名鬼督邮（天麻见 same_drug）}
  - {passage: jc_c030.00371, head: 木通, wit: [jc_d025a.00026],
     why: 纲目之「通草」即今木通（择通草者，鲜知木通之别号）；「通草」本身见下 pairs，分期}
  - {passage: jc_c030.00499, head: 水斳, wit: [jc_c000a.00212], why: 「苦　」；本经：水斳，一名水英}
  - {passage: jc_c030.00632, head: 枳椇, wit: [jc_d075a.00650], why: 「枳　」；枳椇一名鸡距，一名木蜜}
  - {passage: jc_c030.00663, head: 蘗木, wit: [jc_c000a.00183], why: 录文作「柏木」；本经：蘗木，一名檀桓}
  - {passage: jc_c030.00820, head: 䗪虫, wit: [ws_36bca7b992.00352, jc_c003.02946],
     why: 「蟲（地鱉　地蜱蟲　蚵　蟲　土鱉　簸箕蟲　過街）」头脱「䗪」；本经蟅虫一名地鳖；唐本：一名地鳖，一名土鳖}
  - {passage: jc_c030.00826, head: 蜚虻, wit: [jc_c000a.00360, jc_c003.02937],
     why: 「蜚蟲（虻蟲）」即纲目蜚虻条（本经蜚䖟）；唐本：方家所用，惟是蜚虻}
  - {passage: jc_c030.00317, head: 藜芦, wit: [jc_c000a.00250], why: 录文倒作「蘆藜」；本经：藜芦，一名葱苒}
  - {passage: jc_c030.00410, head: 荇菜, wit: [jc_c002.01956],
     why: 录文「苦菜」当作「莕菜」（纲目莕菜释名凫葵、水葵、水镜草、靥子菜、金莲子、接余）；别录凫葵即荇菜，一名接余}
  - {passage: jc_c030.00833, head: 蚯蚓, wit: [jc_d046.00360, jc_c001.00204],
     why: 录文倒作「蚓蚯」；地龙又名蚯蚓；吴普白颈蚯蚓一名附蚓、寒蚓}

# names of one drug the lexicon files apart.  The first name names the group: the 别名录's head where it has one and
# the store writes it, else the name the store writes most (罂粟, 旱莲草).  The build ties every other member to it
# (异写 where one character differs) unless a pair already does, its witnesses the row's that write the member.
same_drug:
  # minerals
  - {names: [丹砂, 朱砂, 辰砂], wit: [jc_c040.00233], why: 丹砂，一名朱砂……惟辰州者最胜，故谓之辰砂}
  - {names: [铅丹, 黄丹], wit: [jc_c000.00977, tangye_bencao.003.00874], why: 陶弘景：即今熬铅所作黄丹也；汤液本草铅丹条：黄丹也}
  - {names: [黑铅, 铅], wit: [ruizhutang.004.00081, jc_c104.00006], why: 黑锡又名黑铅，即铅（与白锡别）；单字「铅」检索不到，并入黑铅}
  - {names: [粉锡, 胡粉, 铅粉], wit: [jc_c040.00264, jc_h023.00343], why: 胡粉，一名粉锡，即化铅所作；胡粉即真铅粉也}
  - {names: [芒硝, 芒消], wit: [zhenglei_bencao.003.01842, cm_shanghan_npm.02397], why: 芒消是朴消中炼出、形似麦芒者；消、硝异写}
  - {names: [玄明粉, 元明粉], wit: [zhenglei_bencao.003.01884, mg_nuke_jiyao.00140], why: 以朴消制伏为玄明粉；元明粉即制朴硝（避讳作元）}
  - {names: [砒石, 砒霜], wit: [jc_o050.05078, jc_c029.00297], why: 砒霜为砒之升炼者（霜以形色言），一名信石；纲目合为一条}
  - {names: [礞石, 青礞石], wit: [furen_daquan.011.00577], why: 礞石元用青礞石}
  - {names: [慈石, 磁石], wit: [ws_36bca7b992.00137, jc_c000a.00217], why: 本经同条一本作慈石、一本作磁石（一名玄石）}
  # plants
  - {names: [黄柏, 黄檗, 黄蘗, 黄蘖, 蘗木],
     wit: [jc_c040.00510, bencao_baizhonglu.000.00092, yizhi_xuyu.002.00390, jc_c006.00580, jc_c000a.00183],
     why: 黄檗，俗名黄柏；黄蘗、黄蘖为同药异写；图经：柏木，黄柏也……其根名檀桓（本经蘗木条：蘗木，一名檀桓）；百种录蘗木条释作黄蘗、黄柏}
  - {names: [赤箭, 天麻], wit: [jc_c000.00199], why: 今医家见用天麻，即是此赤箭根}
  - {names: [蚤休, 重楼], wit: [jc_c000.01159], why: 蚤休……曰重楼金线}
  - {names: [酸枣, 酸枣仁], wit: [jc_c006.00586], why: 图经酸枣条：取核中仁……酸枣仁汤}
  - {names: [牡丹, 牡丹皮], wit: [tangye_bencao.003.00671], why: 汤液本草牡丹皮条：牡丹乃天地之精……牡丹皮}
  - {names: [诃黎勒, 诃子], wit: [jc_c029.00082], why: 诃子……又名诃黎勒}
  - {names: [芜菁, 蔓菁], wit: [jc_c018a.00518, jc_l008.01350], why: 蔓菁子即芜菁；唐本北人又名蔓菁子}
  - {names: [菖蒲, 昌蒲], wit: [xiaoer_weisheng_zongwei.005.00457, jc_d025a.01389], why: 石昌蒲一寸九节者良：昌蒲即菖蒲古写}
  - {names: [莨菪, 莨菪子], wit: [jc_c006.00459], why: 图经莨菪子条：一名天仙子，本经云莨菪}
  - {names: [蒺藜, 蒺藜子], wit: [jc_d004a.02107], why: 疗肿蒺藜散方：蒺藜子一升}
  - {names: [芡实, 鸡头实], wit: [jc_d005.09595, xianxingzhai_biji.004.00731], why: 服莲芡实方：取鸡头实；鸡头实条：一云芡实}
  - {names: [萎蕤, 葳蕤, 女萎萎㽔, 萎蕤女萎],
     wit: [jc_d024.00113, zhenglei_bencao.006.03890, jc_c000.00135, zhenglei_bencao.006.03886],
     why: 同一药性论条文一作葳蕤、一作萎蕤；词表女萎萎㽔、萎蕤女萎二条所收玉竹、地节、马熏皆萎蕤之名（吴普：女萎一名葳蕤、地节、玉竹）}
  - {names: [卫矛, 鬼箭羽], wit: [jc_c029.00169, jc_c000a.00199], why: 鬼箭羽……一名卫矛；卫矛一名鬼箭}
  - {names: [枫香脂, 白胶香], wit: [bencao_jingshu.012.02118, jc_c040.00538], why: 枫香脂……一名白胶香；枫香是枫树脂，即白胶香}
  - {names: [川楝子, 金铃子, 楝实], wit: [jc_c040.00520, zhenglei_bencao.014.09601], why: 川楝子号金铃；楝实即金铃子也}
  - {names: [蓬蘽, 蓬蔂], wit: [zhenglei_bencao.023.13906, jc_c000a.00085], why: 同一本经条文（一名覆盆），一作蓬蘽，一作蓬蔂}
  - {names: [罂粟, 罂子粟, 莺粟米],
     wit: [xuanming_lunfang.009.00301, chuanxin_shiyong.002.00398, jc_o033.00146, quansheng_zhimi.003.00241],
     why: 御米即莺粟（莺粟神圣散用御米壳，御米饮子用婴粟壳）；御米条：此即罂粟子也；罂粟汤用其子}
  - {names: [地肤, 地肤子], wit: [waitai_miyao.028.05040, jc_d004.10890, jc_c000.00319],
     why: 「一云地麦，地肤、地肤子也」；地麦草一名地肤草；本经地肤子条一名地麦}
  - {names: [柳华, 柳花], wit: [zhenglei_bencao.014.09558, jc_c000a.00198], why: 同一本经条：一本作柳华，一本作柳花，并一名柳絮}
  - {names: [茺蔚子, 充蔚子], wit: [jc_c000a.00013, ws_36bca7b992.00058, jc_c000.00131], why: 同一本经条：一本题茺蔚子，一本题充蔚子，并一名益母、益明}
  - {names: [旱莲草, 鳢肠], wit: [jc_d076.00244, jc_o059.03412], why: 莲子草（别名录鳢肠之名）即旱莲草；旱莲草即墨汁草}
  - {names: [牛蒡子, 恶实, 鼠黏子], wit: [jc_c029.00121, jc_c007.00207], why: 鼠黏子一名牛蒡子，一名大力子，一名恶实；恶实今谓之牛蒡，未去萼时又谓之鼠黏子}
  - {names: [莱菔, 萝卜], wit: [jc_c040.00658, jc_c029.00346], why: 莱菔，即萝卜也；莱菔根俗云萝卜}
  - {names: [菟丝, 菟丝子], wit: [jc_c000.00123, jc_c000a.00011, jc_d045.00041],
     why: 吴普菟丝（一名玉女、赤网）即本经菟丝子条（一名菟芦）；方中「菟丝（子一两半）」即菟丝子}
  # animals
  - {names: [蜚虻, 虻虫], wit: [jc_c003.02938], why: 唐本注：蜚虻状如蜜蜂……今俗用多以此也；虻虫即蜚虻（见 head_repairs、pairs）}
  - {names: [萤火, 荧火], wit: [jc_c000.01316, jc_c000.01314], why: 萤飞虫，萤火也；吴普荧火一名景天、挟火，与萤火同名}
  - {names: [䗪虫, 蟅虫, 土鳖虫], wit: [cm_jingui_dengzhen.00423, jc_c046.01071, jc_j012.00054],
     why: 大黄䗪虫丸一作大黄蟅虫丸；䗪虫一名土鳖，伤科写作土鳖虫}
  - {names: [斑蝥, 斑猫], wit: [jc_o067.04362, jc_c000.01280], why: 同炒法一作斑蝥、一作斑猫；吴普斑猫一名斑蚝}
  - {names: [蝉蜕, 蝉壳], wit: [jc_d002.04653, jc_d001.00742], why: 别录蚱蝉条「壳名枯蝉」，食疗作「蝉壳主小儿痫」：即蚱蝉之蜕}

# pairs the lists lack or file wrongly, with their status and cues, and the years a name meant a drug where that
# changed.  `note` is shown with the referent; `why` is for the editors only.
pairs:
  # other names and spellings that are the drug wherever the store writes them
  - {s: 国老, head: 甘草, kind: alias, status: open, wit: [shanghan_zhige.002.00297]}
  - {s: 黄檗, head: 黄柏, kind: spelling, status: open, wit: [jc_c040.00510]}
  - {s: 黄蘗, head: 黄柏, kind: spelling, status: open, wit: [bencao_baizhonglu.000.00092]}
  - {s: 黄蘖, head: 黄柏, kind: spelling, status: open, wit: [yizhi_xuyu.002.00390]}
  - {s: 辰砂, head: 丹砂, kind: variety, wit: [jc_c040.00233]}
  - {s: 天麻, head: 赤箭, kind: part_name, status: open, wit: [jc_c000.00199]}
  - {s: 小茴香, head: 茴香, kind: variety, status: open, wit: [jc_c037.00429, sanyin_fang.007.00585],
     why: 茴香修治：小如粟米者谓之小茴香；小茴香丸用茴香（别名录归莳萝，见 decisions）}
  - {s: 熏黄, head: 雄黄, kind: variety, status: open, wit: [waitai_miyao.013.01867, waitai_miyao.026.04306],
     why: 熏黄为雄黄之次者，千金、外台熏疮方入药；色名之「身如熏黄」见 cover_stops}
  - {s: 鸡舌香, head: 丁香, kind: part_name, status: open, wit: [jc_c021.00807, jc_h000a.00907],
     why: 雌者颗大为母丁香，即鸡舌香（果实）；唐方或二者并用，古今有异说（jc_h000a.00909）}
  - {s: 虻虫, head: 蜚虻, kind: alias, status: open, wit: [tangye_bencao.003.00936, tangye_bencao.003.00938],
     why: 唐本注（jc_c003.02938）：蜚虻今俗用多以此、三种同体；汤液本草虻虫条引本经蜚虻之文，仲景抵当汤用虻虫水蛭}
  - {s: 葳蕤, head: 萎蕤, kind: spelling, status: open, wit: [jc_d024.00113, jc_c000.00138], why: 疑女萎即葳蕤也}
  - {s: 芒消, head: 芒硝, kind: spelling, status: open, wit: [zhenglei_bencao.003.01842, cm_shanghan_npm.02397]}
  - {s: 金铃子, head: 川楝子, kind: alias, status: open, wit: [jc_c029.00267, zhenglei_bencao.014.09601],
     why: 楝子（即金铃子）；楝实即金铃子也；川楝子号金铃（jc_c040.00520）}
  - {s: 鬼箭羽, head: 卫矛, kind: alias, status: open, wit: [jc_c029.00169]}
  - {s: 侧柏, head: 侧柏叶, kind: abbreviation, status: open, wit: [jc_c024.00219, jc_j012.00126]}
  - {s: 石盐, head: 光明盐, kind: alias, status: open, wit: [waitai_miyao.025.03868],
     why: 外台疗目赤方著石盐末；同方一作光明盐（waitai_miyao.042.09575）}
  - {s: 土鳖, head: 䗪虫, kind: alias, status: open, wit: [jc_c003.02946, jc_n017.00091]}
  - {s: 斑猫, head: 斑蝥, kind: spelling, status: open, wit: [jc_o067.04362, waitai_miyao.027.04750],
     why: 同药异写；方中斑猫（去翅足熬）皆此虫}
  - {s: 蝉壳, head: 蝉蜕, kind: alias, status: open, wit: [jc_d002.04653, boji_fang.003.00225], why: 蚱蝉之壳；方中蝉壳（去足、微炒）皆作药}
  - {s: 鼠黏, head: 牛蒡子, kind: alias, status: open, wit: [jc_c040.00385, jc_l102.00057],
     why: 牛蒡一名恶实，又名鼠黏；痘疹方单写鼠黏（三钱）即牛蒡子；别名录归鼠妇，见 decisions}
  # names that are also other things: read as the drug only beside its cues
  - {s: 将军, head: 大黄, kind: alias, status: cue, cues: [大黄, 锦纹, 川军, 荡涤, 承气], wit: [jc_d031.00396]}
  - {s: 将军, head: 石硫黄, kind: alias, status: cue, cues: [硫黄, 阳精, 破邪归正], wit: [tangye_bencao.003.00861, jc_c103.00085]}
  - {s: 羚羊, head: 羚羊角, kind: abbreviation, status: cue, wit: [jc_d070.00023, yizong_jinjian.077.37738],
     why: 清方单写「羚羊」即羚羊角（羚羊（角）；羚羊饮用羚羊角）；胆、鼻、皮见 cover_stops}
  - {s: 乌犀, head: 犀角, kind: variety, status: cue, wit: [hejiju_fang.003.00171, jc_f022.01518],
     why: 苏合香丸一作乌犀屑、一作乌犀角；本库之乌犀皆犀角，无一处作皂荚}
  - {s: 血余, head: 乱发, kind: alias, status: cue, cues: [发灰, 头发, 人发, 胎发, 灰, 炭, 熬枯], wit: [jc_d065.00651, jc_c026.00166]}
  - {s: 红豆, head: 红豆蔻, kind: abbreviation, status: cue, cues: [高良姜, 良姜],
     wit: [tangye_bencao.002.00411, hejiju_fang.005.00427]}
  - {s: 夜合, head: 合欢, kind: alias, status: cue, cues: [合昏, 花, 树皮, 白皮], wit: [jc_c011.01940, jc_d030.01063]}
  - {s: 人言, head: 砒石, kind: alias, status: cue, cues: [砒, 信石, 白砒], wit: [jc_p0012.02329, jc_i003.00447],
     why: 白砒（即人言）；明清方「人言（一钱）」入药，余皆「古人言」「与人言」之类，见 cover_stops}
  - {s: 紫河车, head: 人胞, kind: alias, status: cue, cues: [人胞, 一具, 头胎, 男胎, 混沌皮], anti: [蚤休, 重楼],
     wit: [jc_o075a.10442, ws_05e1ac6c6d.00002], why: 人胞即紫河车；补虚方「紫河车一具」皆胞衣，宋以后与蚤休同名并行}
  - {s: 紫河车, head: 蚤休, kind: alias, status: cue, cues: [蚤休, 重楼, 七叶一枝花, 草河车], anti: [一具, 头胎, 男胎],
     wit: [jc_c010.00731, jc_c019.01081, jiangxueyuan_fangxuan.012.00695], why: 重楼一名紫河车；即草紫河车、金线重楼；紫河车（即蚤休草切片）——疮毒方多此义}
  - {s: 芙蓉, head: 木芙蓉, kind: abbreviation, status: cue, cues: [木芙蓉, 拒霜], wit: [tab_619_0a7261aa40.00598, jc_d048.01345],
     why: 芙蓉散用木芙蓉花叶；外科围药之芙蓉叶皆木芙蓉，与荷花之芙蓉别}
  - {s: 冷石, head: 滑石, kind: alias, status: cue, cues: [熨], wit: [jc_d025.02456, jc_c002.00533],
     why: 滑石一本作冷石；陶弘景：又有冷石，性并冷利；寒食散以冷石熨之}
  # names whose drug changed with the period (hard windows [from, to))
  - {s: 通草, head: 木通, kind: old_name, status: cue, valid: [null, 960], wit: [jc_d025a.00026]}
  - {s: 通草, head: 通脱木, kind: alias, status: cue, valid: [960, null], wit: [jc_d025a.00026]}
  - {s: 青木香, head: 木香, kind: old_name, status: cue, valid: [null, 1100], wit: [jc_d025a.00026]}
  - {s: 青木香, head: 马兜铃, kind: part_name, status: cue, valid: [1100, null], wit: [jc_c103.00336]}
  - {s: 文蛤, head: 五倍子, kind: alias, status: candidate, valid: [973, null], wit: [sanyin_fang.010.00993, jc_l106.00062],
     why: 开宝以后文蛤亦指五倍子（文蛤即五倍子）；仲景文蛤散／汤之蛤壳贯穿后世注本（yizong_jinjian.021.10323），973 后两义约各半}
  - {s: 寒水石, head: 石膏, kind: alias, status: candidate, valid: [1578, null], wit: [zhengzhi_zhunsheng.067.11012],
     why: 明人或以软石膏为寒水石（王肯堂）；唐宋方寒水石与石膏并用（waitai_miyao.018.02803），仍以凝水石为正}
  - {s: 芒消, head: 硝石, kind: old_name, status: candidate, valid: [null, 500], wit: [jc_c000a.00098],
     note: 本经消石一名芒消；陶弘景以后芒消自为一条，生于朴消}
  - {s: 覆盆, head: 蓬蘽, kind: old_name, status: cue, valid: [null, 1062], cues: [蓬蔂, 陵蘽, 阴蘽],
     wit: [jc_c000a.00085, zhenglei_bencao.023.13922], note: 本经蓬蘽一名覆盆；唐本注：蓬蘽、覆盆一物异名}
  - {s: 覆盆, head: 覆盆子, kind: abbreviation, status: cue, valid: [1062, null],
     wit: [zhenglei_bencao.023.13920, jc_f011.00115], note: 图经：蓬蘽非覆盆也；明清方中覆盆即覆盆子}
  # pairs the lists lack, kept as candidates
  - {s: 鬼目, head: 石南, kind: alias, status: candidate, wit: [jc_c000a.00203], why: 本经石南一名鬼目，别名录未收}

# the year a name came into use: an earlier passage writing it is flagged (a later edition's word), never dropped
first_use:
  - {s: 信石, year: 758, wit: [jc_c038.01152, boji_fang.005.00629]}
  - {s: 枳壳, year: 960, wit: [jc_c000.00799]}
  - {s: 苍术, year: 960, wit: [jc_c042.00200]}
  - {s: 川椒, year: 960, wit: [jc_p0301.00083], why: 唐以前方皆作蜀椒（千金、外台数百见）；太平圣惠方始多作川椒，金匮、千金一本之川椒为后世改写}
  - {s: 紫河车, year: 960, wit: [jc_c007.00077], why: 宋以前无紫河车之名（本库可定年者本草衍义最早）；本经、南北朝书中所见为后人注语}
  - {s: 官桂, year: 1047, wit: [boji_fang.001.00026]}
  - {s: 天仙子, year: 1061, wit: [jc_c006.00459], why: 图经莨菪子条始见「一名天仙子」，本库无更早者}
  - {s: 党参, year: 1700, wit: [jc_c021.00076]}
  - {s: 浙贝, year: 1740, wit: [jc_i009.00199]}

# false friends, never expanded and never listed: what the store writes under these names is another thing.  Where a
# 本经 or 吴普 一名 line names the drug, that line also writes the drug's own name.
stop:
  # words for the body, its functions and illnesses
  - {s: 小便, wit: [cm_lingshu_sibucongkan.00115, shanghan_weizhi.002.00137], why: 「不得小便」「小便不利」：排尿与溺，非入药之人尿}
  - {s: 胞衣, wit: [jc_k000a.00408, zhengzhi_zhunsheng.067.11009], why: 「胞衣不出／不下」：产后胎衣滞留之证名}
  - {s: 胎衣, wit: [jc_o032.00548, jc_i016.00340], why: 产科常语（胎衣不下），非入药之人胞}
  - {s: 月经, wit: [qianjin_yaofang.006.00696, jc_g019.00137], why: 经候常语（月经不通、月经不行、月经不调），非入药之月水}
  - {s: 天癸, wit: [cm_suwen_gucongde.00154, jisheng_fang.004.00141], why: 「二七而天癸至」「天癸当至」，生殖之精气，非药}
  - {s: 阴茎, wit: [rumen_shiqin.002.00102, jc_e019.00109], why: 人身部位（阴茎肿胀、痿缩）；狗、狐阴茎等入药者自有其名，已作 blockers}
  - {s: 厚皮, wit: [cm_lingshu_sibucongkan.00243, zhenjiu_jiayi.001.00049], why: 灵枢「肉薄厚皮」「密理厚皮」言皮肤之厚，未见作厚朴}
  - {s: 百节, wit: [jc_d025a.04593, hejiju_fang.001.00034], why: 周身关节（百节疼痛、百节酸疼），非马陆}
  - {s: 水泻, wit: [zhengzhi_zhunsheng.090.14925, jc_e004a.00808], why: 泄泻病名（水泻、冷泻热泻）与「滋水泻火」跨词；指泽泻者只在本经一名句}
  - {s: 及泻, wit: [boji_fang.004.00498, zhenglei_bencao.009.05709], why: 「虫疳及泻无定」「吐血及泻鲜血」跨词；指泽泻者只在别录一名句}
  - {s: 瘵疾, wit: [puji_benshi.007.00459, jisheng_fang.004.00125], why: 病名（劳瘵）；录文以人肉条之主治为别名}
  - {s: 石发, wit: [jc_d002.05330, waitai_miyao.042.09455], why: 服石发动（石发烦热、乳石发）；苔名石发只见训诂}
  - {s: 虚中, wit: [jc_o068.05423, jc_g004.00007], why: 「虚中有热」「太虚中」之类；钟乳一名虚中只见吴普}
  - {s: 肤如, wit: [zhubing_yuanhou.041.02426, jc_d039.00371], why: 「皮肤如常」「肌肤如旧」；大黄一名肤如只见吴普引文}
  - {s: 苦心, wit: [jc_a300.00048, jc_m100a.00028], why: 「病苦心痛」「苦心下坚」「良医之苦心」；指沙参、知母者只在一名句}
  - {s: 蚍蜉, wit: [waitai_miyao.027.04725, qianjin_yaofang.069.04822], why: 只见九漏之「蚍蜉漏／瘘」（食中蚍蜉毒），未见入药}
  # points, needling, the cycles of qi
  - {s: 巨骨, wit: [zhenjiu_zisheng.001.00086, cm_suwen_gucongde.04220], why: 穴名、骨名（肩端巨骨穴、巨骨下），本库无一处作溲疏}
  - {s: 犊鼻, wit: [cm_lingshu_sibucongkan.00101, mingtang_jiujing.008.00640], why: 足阳明穴名（刺犊鼻者屈不能伸、犊鼻下二寸），非裈裆}
  - {s: 鸡足, wit: [cm_lingshu_sibucongkan.00131, waitai_miyao.012.01739],
     why: 合谷刺「左右鸡足」、「耳本后鸡足青络」与鸡之足（烧鸡足末）；山茱萸之名只在吴普一名句}
  - {s: 至掌, wit: [qianjin_yaofang.084.05927, jc_o052.02443], why: 「从肘腕中横文至掌」「中指内廉至掌心」；指水蛭者只在一名句与说文}
  - {s: 针石, wit: [zhubing_yuanhou.012.00837, suwen_wangbing.004.00189], why: 「汤熨针石」「针石道也」，针砭之术，非入药之砭石}
  - {s: 玉液, wit: [jc_l106.00217, qianjin_yaofang.081.05813], why: 金津玉液（舌下穴、津液）、玉液丸／膏、道家玉液金丹}
  - {s: 毛虫, wit: [cm_suwen_gucongde.07863], why: 运气篇五虫之「毛虫」（雨生毛虫），非雀瓮}
  - {s: 地主, wit: [suwen_yunqi_lunao.004.00621], why: 运气术语（太阳降地主窒），非城东腐木}
  - {s: 木王, wit: [cm_lingshu_sibucongkan.00251, zhengzhi_zhunsheng.052.08227], why: 五行「木王于春」「木王之时」，非梓}
  - {s: 重泽, wit: [suwen_wangbing.021.00797, leijing.026.01671], why: 运气「其化柔润重泽」；甘遂一名重泽只在吴普、别录句}
  # ordinary words and straddles
  - {s: 不过, wit: [waitai_miyao.009.00957, wenyilun_skqs.002.00194], why: 常语（不过三灸、不过风寒），尔雅之「不过」不见于用药}
  - {s: 止行, wit: [ws_36bca7b992.00176, baoming_ji.002.00203], why: 「起止行步」「血止行血」等跨词；药名只在本经一名句}
  - {s: 挟火, wit: [piweilun.001.00013, jc_b035.00956], why: 「挟火挟痰」「肝木旺则挟火」病机语；药名只在一名句}
  - {s: 解离, wit: [qianjin_yaofang.033.02356, qianjin_yaofang.011.00897], why: 「百节解离」「水谷解离」；药名只在本经一名句}
  - {s: 日及, wit: [furen_daquan.021.01385, waitai_miyao.035.07259], why: 「三月三日及」「十日及半月」，非扶桑、木槿}
  - {s: 野人, wit: [jiyan_beiju.001.00015, jc_g014.00139], why: 「田夫野人」「齐东野人」，非狒狒}
  - {s: 致神, wit: [jc_d002.00256, jc_e013.00341], why: 「轻身致神仙」「以致神昏」，非桑螵蛸}
  - {s: 益明, wit: [cm_suwen_gucongde.08251, jc_o041.00003], why: 「辰星益明」「得罗氏而益明」；指茺蔚子、地肤者只在本经一名句}
  - {s: 地参, wit: [gezhi_yulun.001.00009, jc_k000.01014], why: 「人与天地参」与生／熟地加参之省；指知母者只在本经一名句}
  - {s: 旁通, wit: [jc_n046.00184, qianjin_yaofang.000.00010], why: 「触类旁通」「经脉旁通」；蒺藜一名旁通只在本经句}
  - {s: 火消, wit: [cm_jingui_dengzhen.00412, jc_i013.00717], why: 「更上微火消解」「胃火消烁」之跨词，未见作硝石}
  - {s: 救火, wit: [maijing.006.00656, jc_h000a.00148], why: 「梦救火」「抱薪救火」；萤火、景天一名救火只在吴普句}
  - {s: 土石, wit: [cm_suwen_gucongde.03429, furen_daquan.010.00456], why: 「金玉土石」「去土石」，泥土砂石之常语；长石一名土石只在本经句}
  - {s: 大苦, wit: [bencao_gangmu_skqs.039.01741, jc_n054.00182], why: 气味语（大苦大寒），非黄药子}
  - {s: 中药, wit: [jc_a001.02728, shanghan_weizhi.002.00120], why: 上中下三品之中药、温中药、毒气入咽中药；无一处作山豆根}
  - {s: 竹木, wit: [jc_d053.01110, waitai_miyao.012.01747], why: 「竹木刺入肉」异物伤之语，非萆薢}
  # formula names, Daoist and other words
  - {s: 地芝, wit: [baoming_ji.003.00343, jc_d070.00013], why: 只见东垣地芝丸（方名），不指冬瓜}
  - {s: 排风, wit: [waitai_miyao.018.02701, jc_o096.00977], why: 排风汤、排风散之方名与「顺气排风」，非白英}
  - {s: 岩蜜, wit: [qianjin_yaofang.026.02046, furen_daquan.024.01637], why: 只见大／小岩蜜汤方名（方中无蜜），不指蜂蜜}
  - {s: 青金, wit: [puji_benshi.004.00231, jc_c000.00977], why: 青金丹／散／膏／丸方名；指铅者只说文一训，同条即写铅}
  - {s: 白虎, wit: [cm_jingui_dengzhen.00263, jc_g003a.00028], why: 白虎汤／白虎加人参汤、白虎历节、四象之白虎；无一处作锻石}
  - {s: 内消, wit: [waike_jingyi.001.00057, waitai_miyao.039.08699], why: 「令内消」「即得内消」治法语与内消散／丸方名；非紫荆}
  - {s: 玉女, wit: [jc_d025.04528, jc_e004a.00226], why: 神仙玉女、玉女煎、玉女散；作菟丝者只在本经一名句中}
  - {s: 地仙, wit: [jc_d013.00029, jufang_fahui.001.00017], why: 仙家「成地仙」与地仙散、地仙丹之方名；作草名只雷公「地仙苗」一处}
  - {s: 白金, wit: [jc_n047.00066, jc_n024.00282], why: 银钱（诏赐白金）、白金丸之方名、太白金星，不作银之药名}
  - {s: 土精, wit: [qianjin_yaofang.002.00217, waitai_miyao.017.02597], why: 「妊娠八月始受土精」；方家以土精称牛黄；人参一名只在吴普、异苑句}
  # another thing, often a drug of its own
  - {s: 猪屎, wit: [qianjin_yaofang.018.01604, jc_d025a.10719], why: 猪粪本身入药（猪屎散、烧猪屎灰）；猪苓之名是猳猪屎}
  - {s: 醋浆, wit: [jc_d053.01203, waitai_miyao.042.09647], why: 醋浆（浆水）是煮药、和丸、送服之汤液；指酸浆者只在本经一名句}
  - {s: 竹根, wit: [waitai_miyao.031.05981, jc_d025a.01285], why: 甘竹根、䈽竹根自为一药（竹根饮子），非连翘}
  - {s: 鼠矢, wit: [zhouhou_beiji.002.00675, tangye_bencao.003.00653], why: 本库鼠矢皆鼠粪（两头尖、栀子鼠矢汤）；山茱萸之名只在吴普一名句}
  - {s: 石英, wit: [waitai_miyao.041.09253, jc_n024.00281], why: 单写石英者皆紫石英、白石英之省（炼服石英、石英五钱），无一处指水精}
  - {s: 合子, wit: [jc_c006.00099, jc_d004.07330], why: 盛药之盒（瓷合子中盛贮）与「槟榔合子碎」（连子）；无一处作榼藤子}
  - {s: 连珠, wit: [cm_suwen_gucongde.02677, jc_d065.00223], why: 脉象之喻（累累如连珠）、连珠甘遂、连珠发、形如连珠，未见作山丹}
  - {s: 白泽, wit: [jc_c040.00261, hejiju_fang.005.00396], why: 「细理白泽」（石膏、云母之质）、钟乳白泽丸、白泽图；甘遂一名只在吴普句}

