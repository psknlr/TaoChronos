  - {s: 鹿骊, head: 藜芦, status: candidate, wit: [jc_c000.00275], why: 陶弘景：漏芦俗中取根名鹿骊；纲目木藜芦亦名鹿骊，皆非藜芦}
  - {s: 其子房, status: candidate, wit: [jc_c004.00190],
     why: 别名录螳螂桑螵蛸条「其子房名螵蛸」之「其子房」是「它的子房」，非药名；食疗：其子房及叶皆破血}
