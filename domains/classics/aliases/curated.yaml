  - {s: 脂麻, head: 胡麻, status: open, wit: [jc_d038.00058, shouqin_yanglao.004.00906], why: 胡麻，黑脂麻是也；巨胜子即黑脂麻}
  - {s: 山芋, status: open, wit: [jc_c029.00261, puji_benshi.002.00102], why: 一名山药，一名山芋；宋方山芋即薯蓣}
  - {s: 千金子, status: open, wit: [jc_g043.00097], why: 千金子一名续随子}
