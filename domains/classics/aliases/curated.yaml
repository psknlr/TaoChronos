  - {s: 凌霄, head: 紫葳, status: open, wit: [jc_c040.00511, jc_p0801.18381], why: 紫葳花一名凌霄花；书中凌霄皆此药}
  - {s: 黑丑, head: 牵牛子, status: open, wit: [ws_f0f5addb51.00155, jc_o007a.01861], why: 黑丑即黑牵牛，与白丑并用，书中无他义}
  - {s: 没石子, head: 无食子, status: open, wit: [jc_c040.00519], why: 没石子，即无食子，书中皆作药}
  - {s: 香橼, head: 枸橼, status: open, wit: [jc_c010.00432, jc_n009.01373], why: 香橼本名枸橼；陈香橼入药，书中无他义}
  # · animals
  - {s: 红娘子, status: open, wit: [jc_c011.02690], why: 在樗木上者人呼为红娘子}
