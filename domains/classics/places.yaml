# 地名 — the historical place names of the medical literature (native places of physicians, places signed in prefaces,
# places of printing, regions named in doctrine: 江南, 岭南, 西北), for `study entities` (T7, type Place) and
# `study places` (T27, time × person × place).
#
#   names     written forms, matched on the normalised text (simplified characters); a name that is also a common word
#             or an era name (安定, 新建, 永嘉, 建安) is listed in `ambiguous` or left out
#   level     region (a cultural or administrative region) · province · prefecture (州 府 郡) · county (县)
#   province  the modern province (or municipality) the place lies in
#   region    the macro-region used for statistics: 江南 (southern Jiangsu, Shanghai, Zhejiang, southern Anhui) · 江淮 ·
#             中原 · 华北 · 齐鲁 · 西北 · 巴蜀 · 荆楚 · 江西 · 闽 · 岭南 · 西南 · 东北
#   lat, lon  the modern seat, approximate — for maps, never for reasoning
#   ambiguous a name that often means something else (长沙 is also 张仲景; 新建 is also "newly built"): kept as a candidate
#             for review, not asserted
#
# Curated from standard gazetteers for this project; review and extend it here.  Historical boundaries changed: a name is
# placed where its seat was, and the region is a convenience for statistics, not a claim about historical geography.

