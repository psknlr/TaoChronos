# 常用药补遗 — common drugs that neither the curated lexicon nor the core of the harvest names (the harvester leaves out a
# name holding 味 — 五味子 — and ranks drugs by their 本草 entries, so drugs written mostly in formulas rank low), chosen by
# how often the 要籍语料 writes them (2026-10: 五味子 1 216 times, 芒硝 882, 青皮 710, 南星 601, 前胡 545 …).  Loaded with the
# harvested lexicons (profiles full-corpus and web-canon), before them, so that these forms win; never over a curated term.
# Aliases that are also ordinary words are left out (五味 is also "the five flavours", 茱萸 names two drugs).
