# Case records (医案): how a record is cut into cases and visits, and what is read from each visit.
#
# Rules over the normalised text (simplified forms).  The lexicon supplies symptoms, diseases, patterns, formulas and
# drugs; the patterns below supply what the lexicon does not list — the patient, the visit, pulse and tongue
# descriptions, the principle of treatment, changes to the prescription, the number of doses and the response.
# Review and extend them here; CaseEval (evals/gold/cases.yaml) measures what they find.

# a new case: a patient named at the head of a passage or a sentence
case_openers:
  - "^(?:某|[一-鿿]{1,2}(?:姓|氏)?)[　 ]+(?:[男女]|[年]?[一二三四五六七八九十廿卅]+[岁])"   # 王　十岁 · 某氏　女
  - "^某(?:氏|女|男|童|妪|翁|姬|室|妇)?(?=[　 ，,（(]|$)"                                  # 某 · 某氏
  - "^[一-鿿]{1,2}(?:氏|姓)?[（(](?:[男女]|[一二三四五六七八九十廿卅]+岁?)[）)]"              # 钱（三十）
  - "^[一-鿿]{1,3}(?:[　 ]|，)?(?:左|右)?[一二三四五六七八九十廿卅]+岁"                         # 张 廿五岁
  - "^[一-鿿]{1,2}(?:氏)?[，,](?:[男女][，,])?[一二三四五六七八九十廿卅]+岁"                      # 李，四十岁 · 史，二十岁
  - "^一(?:男子|妇人|女子|妇|女|人|童|儿|老人|老妪|老翁|少年|室女|孕妇|僧|道士|士人|富翁)"          # 类案: 一妇人年四十
  - "^[一-鿿]{2,5}治[一-鿿]{1,8}(?:[，,]|之|者|病|患)"                                         # 喻嘉言治石开晓，
  - "^(?:左|右)(?=[　 ，,])"                                                                    # 张聿青医案: 左 = a man, 右 = a woman
  - "^(?:[一-鿿]{1,4})?(?:夫人|太夫人|令眷|室人|令郎|令爱|之眷|之女|之子|之妻|孝廉|文学|秀才|司空|别驾|太守|中丞|方伯)[一-鿿]{0,3}[，,]"

# headings that file no cases (a biography, a preface, rules of the edition)
non_case_sections: "传$|传[（(]|序$|序[一二三]?$|跋$|凡例|目录|题词|小引|提要|附录|自叙|自序"

# a new visit (诊次) inside a case: at the head of a passage or a sentence
visit_markers:
  - "^(?:初|一|二|三|四|五|六|七|八|九|十|复|再|又|末)诊"
  - "^(?:又|复|再)(?:方|按|案|拟|议|视|至)?(?=[　 ，,：:]|$)"
  - "^(?:初|十|二十|廿|三十|卅)?[一二三四五六七八九十]日(?=[　 ，,：:]|$)"
  - "^(?:[一二三四五六七八九十]+月)?(?:初|十|二十|廿)[一二三四五六七八九十]日"
  - "^(?:次日|翌日|后日|次早|越[一二三四五六七八九十]+日|过[一二三四五六七八九十]+日|[一二三四五六七八九十]+日后)"
# a new prescription built on the last opens a visit only at the head of a passage (初三日…即于前方内去薄荷 is one visit)
passage_visit_markers:
  - "^(?:前方|原方|照前方|即于前方|仍用前方|守前方|照原方)"
# (服后, 服之, 连进三帖, 再服一剂 continue the visit: what follows them is the response to its prescription;
#  明日再服, 明早一帖 are instructions for taking it)
# day markers also open a visit at the head of a clause (…服之，次日热退)
day_markers: "^(?:次日|翌日|次早|越[一二三四五六七八九十]+日|过[一二三四五六七八九十]+日|[一二三四五六七八九十]+日后|(?:初|十|二十|廿)[一二三四五六七八九十]日)"
# drug-processing notes that 去 introduces (去皮, 去节): not changes to a prescription
processing: [皮, 节, 心, 核, 尖, 芦, 毛, 滓, 渣, 须, 皮尖, 头, 足, 翅, 瓤, 油, 苗, 土, 壳, 子, 白, 筋, 骨, 汁, 上沫, 沫]

# the parts of a visit
pulse: "脉(?:象)?(?:[左右两六寸关尺]{0,3})(?:[浮沉迟数滑涩弦紧洪细微弱虚实濡缓芤革牢伏动促结代散长短大小软硬疾空劲静和]|而|且|兼|俱|皆|按之|重按|不|甚|极|稍|略|颇|带|见){1,12}"
pulse_qualities: "浮沉迟数滑涩弦紧洪细微弱虚实濡缓芤革牢伏动促结代散长短大小软硬疾空劲静和"
tongue: "(?:舌(?:苔|质|色|心|边|尖|根)?|苔)(?:[白黄灰黑红绛紫淡胖瘦腻滑燥干剥光厚薄润糙裂焦]|而|且|微|色|如){1,8}"
# formulas named by the record (the lexicon need not know them): …汤/散/丸 after 用/与/予以/投, or before 主之/加
formula: "(?:予以|处以|改用|仍用|主以|用|与|予|投|进|服|宜|拟|合)([一-鿿]{2,7}?(?:汤|散|丸|饮子|饮|丹|膏|煎))|([一-鿿]{2,7}?(?:汤|散|丸|饮子|饮|丹|膏|煎))(?=主之|加|去|合|治之|与之)"
# the principle of treatment where the record names it: 治宜…, 法当…, 用…法 (and the lexicon's principles)
principle:
  - "(?:治(?:宜|当|以)|法(?:当|宜)|当以|宜以|拟以|拟用|议用|议以|主以|急以|急宜|宜用)([一-鿿]{2,10}?)(?:法|为主|之剂|之法|[，,。；　]|$)"
  - "(?:用|议|拟|仿|宗|遵|取|投|与以)([一-鿿]{2,10}?)法"
modification:
  add: "(?:前方|原方|照前方|即于前方|于前方|原方内|前方内)?(?:内)?加(?:入)?[：:]?([一-鿿（）()、　 ]{2,40})"
  remove: "(?:^|[，,。；　 ]|前方|原方|方内|方中)去([一-鿿、]{1,16}?)(?=加|[，,。；　 ]|$)"
doses: "(?:服|进|连进|连服|再进|再服|用)([一二三四五六七八九十两数]+)[剂帖服]"
# the patient's response to treatment — in context: 愈 alone is too common a character, and 死 in 不然…而死矣 is a warning
response:
  died:
    - "(?<![恐必将则否然])(?:而死|遂死|竟死|果死|即死|死矣|而逝|遂逝|果逝|而卒|遂卒|不起|遂殁|而殁|遂毙|不治而|遂亡|果败|竟亡|告殂)"
  worse:
    - "(?:加剧|更甚|转剧|益甚|愈甚|增剧|反甚|危笃|垂危|濒危|病势危|昏愦|昏不知人|日重|日甚|转甚|更剧)"
  unchanged:
    - "(?:不减|如故|依然|未减|不应|无效|罔效|不效|未效|如前|未见效|仍然|无进退|不见效)"
  improved:
    - "(?:而|遂|乃|即|竟|全|痊|病|获|顿|渐|果|悉)(?:愈|瘥|痊)"
    - "(?:霍然|如失|康复|向安|渐安|获安|全安|遂安|乃安|得安|安然|而安|即安|复元|全瘳|而瘳)"
    - "(?:减|轻)(?:半|大半|其半|十之[一二三四五六七八九])"
    - "(?:稍|渐|顿|大|即|遂|乃|俱|皆|亦|悉|全|顿觉)(?:减|轻|退|止|除|平|宁|解|松|爽)"
    - "(?:热|汗|痛|泻|利|渴|咳|嗽|呕|吐|血|肿|胀|喘|烦|厥|寒|疹|痞|满)(?:已|亦|俱|皆|渐|即|稍|大)?(?:退|止|除|减|平|解|消|定|和)"
    - "(?:知饥|思食|能食|进食|纳谷|得寐|安寐|神清|神爽|身凉|脉和|脉静|胃开|便通|溺长)"
