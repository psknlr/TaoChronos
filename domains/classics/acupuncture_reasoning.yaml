# 针灸推理的协调与审核 —— study.acupuncture_reason 与 study.acupuncture_audit 的规则包（ADR 0027）
#
# 依《TaoChronos 针灸选穴工具设计包 1.0》（2026-10-29）实现：类比、脏腑官窍与经脉、气机升降出入、阴阳虚实、五行生克、五输
# 母子、表里·原络·脏腑别通七种推理，各有其可接受的输入、可给出的输出与必须停下之处。事实是四态的观察（present / absent /
# unknown / conflicting），保留其主体、时间、侧别与原文位置；规则只用有限的条件算子（all、any、eq、in、present），不执行任何
# 自由文本或脚本；一个理论关系不能自己变成病人的事实，一个候选穴也不能变成已获批准的处方或已完成的治疗。
#
# 契约（参数与返回）在 acupuncture_contracts.schema.json；本文件是其“规则包”：来源、概念、分流规则、推断护栏、类型化的关系、
# 类比、个人假说（默认停用）、耳鸣的证候比较与追问。分流规则只是例子：不穷尽临床急症、禁忌与评估路径，须由临床人员复核。
version: 1.0.0
contracts: acupuncture_contracts.schema.json
notice: "以下是传统针灸理论中的推理结构与其文献出处，以及对所给信息的整理——不是诊断，不是处方，也不是疗效结论。候选穴只供有相应资格的人员复核；是否针灸、取何穴、如何施术，须在诊察之后决定。遇所列须及时评估的情况，先就医评估。"

