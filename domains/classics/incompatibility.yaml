# 配伍禁忌（相反、相畏）：十八反与十九畏 —— 古籍所载、后世传诵的配伍禁忌，供文本史研究（taochronos study incompat）。
#
# 何书何时说某药“反”或“畏”某药，歌诀何时出现、为谁所引，历代方书又有哪些方剂仍将两药同用：这是文献问题，由语料作答，
# 每条结论附原文。下列各组只是检索与核对的对象；`attribution` 记的是通行说法，不作为本项目的考证结论——工具在语料中
# 实际找到的最早见证另行列出。药名按组列出常见异名、品种与炮制名，用以在组成与原文中识别同一药物。
#
# 后世本草所谓“畏”（十九畏）与《神农本草经》“七情”中的“相畏”（一药之毒为他药所制）含义不同，二者不可混同。
notice: >-
  以下为古籍所载配伍禁忌（相反、相畏）的文本史研究：何书何时如此说、何方仍将两药同用。既不是用药指导，也不判断安全与否；
  “某方同用”只说明文献中有此组成，不说明其合理或无害。涉及有毒药物的现代风险提示见现代安全提示，用药请遵医嘱。
rules:
  - id: shibafan
    name: 十八反
    relation: 反
    verse: 本草明言十八反，半蒌贝蔹芨攻乌，藻戟遂芫俱战草，诸参辛芍叛藜芦。
    verse_probe: [本草明言十八反, 半蒌贝蔹芨攻乌, 藻戟遂芫俱战草, 诸参辛芍叛藜芦]
    attribution: >-
      通行说法：歌诀一般认为始见于金·张从正《儒门事亲》；“相反者十八种”之数出五代·韩保昇《蜀本草》（《证类本草》序例所引）。
      语料中的实际见证以工具所检为准。
    groups:
      - drug: 乌头
        names: [乌头, 川乌, 川乌头, 草乌, 草乌头, 附子, 天雄, 乌喙]
        note: 附子、天雄、乌喙与乌头同出一物（不同部位或形态），后世一并归入此组
        against:
          - {drug: 半夏, names: [半夏, 半夏曲]}
          - {drug: 瓜蒌, names: [瓜蒌, 栝楼, 栝蒌, 瓜蒌仁, 栝楼仁, 栝蒌仁, 瓜蒌皮, 栝楼实, 栝蒌实, 天花粉, 栝楼根, 栝蒌根, 瓜蒌根]}
          - {drug: 贝母, names: [贝母, 川贝母, 浙贝母, 象贝母, 川贝, 浙贝]}
          - {drug: 白蔹, names: [白蔹]}
          - {drug: 白及, names: [白及, 白芨]}
      - drug: 甘草
        names: [甘草, 炙甘草, 生甘草, 国老]
        against:
          - {drug: 海藻, names: [海藻]}
          - {drug: 大戟, names: [大戟, 京大戟, 红大戟]}
          - {drug: 甘遂, names: [甘遂]}
          - {drug: 芫花, names: [芫花]}
      - drug: 藜芦
        names: [藜芦]
        against:
          - {drug: 人参, names: [人参]}
          - {drug: 沙参, names: [沙参, 南沙参, 北沙参]}
          - {drug: 丹参, names: [丹参]}
          - {drug: 玄参, names: [玄参, 元参]}
          - {drug: 苦参, names: [苦参]}
          - {drug: 细辛, names: [细辛]}
          - {drug: 芍药, names: [芍药, 白芍, 赤芍, 白芍药, 赤芍药]}
  - id: shijiuwei
    name: 十九畏
    relation: 畏
    verse: >-
      硫黄原是火中精，朴硝一见便相争。水银莫与砒霜见，狼毒最怕密陀僧。巴豆性烈最为上，偏与牵牛不顺情。丁香莫与郁金见，
      牙硝难合京三棱。川乌草乌不顺犀，人参最怕五灵脂。官桂善能调冷气，若逢石脂便相欺。
    verse_probe: [硫黄原是火中精, 朴硝一见便相争, 狼毒最怕密陀僧, 人参最怕五灵脂]
    attribution: 通行说法：歌诀一般认为始见于明·刘纯《医经小学》。语料中的实际见证以工具所检为准。
    pairs:
      - [{drug: 硫黄, names: [硫黄, 石硫黄, 倭硫黄]}, {drug: 朴硝, names: [朴硝, 芒硝, 皮硝]}]
      - [{drug: 水银, names: [水银]}, {drug: 砒霜, names: [砒霜, 砒石, 信石]}]
      - [{drug: 狼毒, names: [狼毒]}, {drug: 密陀僧, names: [密陀僧]}]
      - [{drug: 巴豆, names: [巴豆, 巴豆霜]}, {drug: 牵牛, names: [牵牛, 牵牛子, 黑牵牛, 白牵牛, 黑丑, 白丑]}]
      - [{drug: 丁香, names: [丁香, 公丁香, 母丁香]}, {drug: 郁金, names: [郁金, 广郁金, 川郁金]}]
      - [{drug: 牙硝, names: [牙硝, 马牙硝, 芒硝]}, {drug: 三棱, names: [三棱, 京三棱, 荆三棱]}]
      - [{drug: 川乌·草乌, names: [川乌, 川乌头, 草乌, 草乌头, 乌头]}, {drug: 犀角, names: [犀角, 犀牛角, 乌犀角]}]
