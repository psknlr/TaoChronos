# ------------------------------------------------------------------ 五行（Five Phases, Wu Xing）与五输穴（Five-Shu points, Wu Shu Xue）
# 五行关系转为选穴，要经过两个中间决定：先辨明证候，再指明取穴之法。“木实”本身不分肝火上炎、肝阳上亢、肝气郁结与
# 肝郁脾虚。经脉的五行、穴的五行、补泻的意图是三种属性，分开记；生克之外有母子相及、相乘、相侮；《难经·五十难》的五邪
# 分的是邪之所从来，不是虚证、实证。经典之规（classical）、流派之法（school：舍岩针法）、教学推演与近人推论（deduction）
# 分层标明；所举配穴说明选穴的推理，不是个体化的处方，也不是操作规程。生克的次序（木火土金水；木土水火金）写在代码里。
five_phases:
  terms:
    - {zh: 五行, en: Five Phases (Wu Xing), note: 亦译 Five Elements；本工具用 Five Phases}
    - {zh: 五输穴, en: Five-Shu points (Wu Shu Xue), note: 井 Jing-Well、荥 Ying-Spring、输 Shu-Stream、经 Jing-River、合 He-Sea}
    - {zh: 井 / 经, en: Jing-Well / Jing-River, note: 两个字、两类穴：井为所出，经为所行}
    - {zh: 输 / 背俞, en: Shu-Stream / Back-Shu, note: 英文拼写相近而归类不同：输是五输之一，背俞是脏腑之气输注于背部之穴}
    - {zh: 阴经、阳经, en: Yin and Yang channels, note: 阴经、阳经都有井荥输经合五类，不分“阴三类、阳二类”；五类在阴经配木火土金水，在阳经配金水木火土}
  phases:
    木: {en: Wood, zang: 肝, fu: 胆, direction: 东方}
    火: {en: Fire, zang: 心, fu: 小肠, direction: 南方, also: [心包, 三焦]}
    土: {en: Earth, zang: 脾, fu: 胃, direction: 中央}
    金: {en: Metal, zang: 肺, fu: 大肠, direction: 西方}
    水: {en: Water, zang: 肾, fu: 膀胱, direction: 北方}
  # 一穴的五行对其所在之经的五行：五种关系
  relations:
    same: {name: 同气, en: same phase, text: 与本经同一五行——本经的同气之穴（本穴）}
    child: {name: 子, en: child, text: 本经五行之所生（我生者）}
    controlled: {name: 所胜, en: controlled, text: 本经五行之所克（我克者）}
    controller: {name: 所不胜, en: controller, text: 克本经五行者（克我者）}
    mother: {name: 母, en: mother, text: 生本经五行者（生我者）}
  states:
    excess: {name: 实, en: excess, names: [实, 盛, 旺, 亢, 有余, 太过, 亢盛, 偏亢, 实证, excess, excessive, hyperactive]}
    deficiency: {name: 虚, en: deficiency, names: [虚, 不足, 不及, 亏, 衰, 弱, 虚弱, 虚证, 亏虚, deficiency, deficient, insufficient, weak]}
  # 生克之外的病理传变（中医基础理论；《素问·五运行大论》“气有余，则制己所胜而侮所不胜；其不及，则己所不胜侮而乘之，
  # 己所胜轻而侮之”）。pathogen：受病之脏所受之邪，按《难经·五十难》
  pathology:
    mother_to_child: {name: 母病及子, en: mother affecting child, meaning: 母行之病累及子行, example: 肾阴虚不能滋养肝阴（水不涵木）, implication: 母、子二脏同参, pathogen: deficiency}
    child_to_mother: {name: 子病犯母, en: child affecting mother, meaning: 子行之病累及母行（子盗母气）, example: 心血虚累及肝血, implication: 相关之脏同参，不只看最显之候, pathogen: excess}
    overacting_excess: {name: 相乘（太过）, en: overacting due to excess, meaning: 克者太过，乘其所胜, example: 肝木太过乘脾土, implication: 以调肝为主，按需扶助运化, pathogen: thieving}
    overacting_deficiency: {name: 相乘（不及）, en: overacting due to deficiency, meaning: 被克者不足，克者乘其虚, example: 脾土虚而肝木乘之, implication: 以扶脾为主；过泻肝木未必相宜, pathogen: thieving}
    counteracting_excess: {name: 相侮（太过）, en: counteracting due to excess, meaning: 被克者太过，反侮克者, example: 肝火犯肺（木火刑金）, implication: 肝、肺同参, pathogen: slight}
    counteracting_deficiency: {name: 相侮（不及）, en: counteracting due to deficiency, meaning: 克者不足，不能制其所胜而反受其侮, example: 肺虚而肝木反侮, implication: 重新权衡补肺与平肝, pathogen: slight}
  # 《难经·五十难》五邪：以受病之脏为本，言邪之所从来（不是证的虚实）
  pathogens:
    deficiency: {name: 虚邪, en: deficiency pathogen (xu xie), from: mother, statement: 从后来者为虚邪}
    excess: {name: 实邪, en: excess pathogen (shi xie), from: child, statement: 从前来者为实邪}
    thieving: {name: 贼邪, en: thieving pathogen (zei xie), from: controller, statement: 从所不胜来者为贼邪}
    slight: {name: 微邪, en: slight pathogen (wei xie), from: controlled, statement: 从所胜来者为微邪}
    direct: {name: 正邪, en: direct pathogen (zheng xie), from: same, statement: 自病者为正邪}
  # 一个“五行状态”不能区分的证候（教材所列常见证型，不全）：须由诊察辨明，才知取哪一法
  patterns:
    木: {excess: [肝火上炎, 肝阳上亢, 肝气郁结, 肝胆湿热, 肝郁脾虚（虚实夹杂）], deficiency: [肝血虚, 肝阴虚, 肝肾阴虚]}
    火: {excess: [心火亢盛, 痰火扰心, 心肾不交（心火旺而肾阴虚）], deficiency: [心气虚, 心阳虚, 心血虚, 心阴虚], note: 益火补土之“火”多指肾阳（命门之火），不即心经或五输的火穴}
    土: {excess: [湿热蕴脾, 胃热, 食滞胃脘], deficiency: [脾气虚, 脾阳虚, 脾虚湿盛, 脾不统血]}
    金: {excess: [痰热壅肺, 风寒束肺, 痰湿阻肺], deficiency: [肺气虚, 肺阴虚]}
    水: {excess: [水湿泛滥（多兼脾肾阳虚）], deficiency: [肾阴虚, 肾阳虚, 肾精不足, 肾气不固], note: 教材多言肾无实证；所谓“水实”多指水液停聚}
  # 已经辨明的证候：直接给出所涉之行与虚实（any：所涉而虚实未定）
  named:
    肝火上炎: {木: excess}
    肝火: {木: excess}
    肝阳上亢: {木: excess, note: 本虚标实，多兼肝肾阴虚}
    肝气郁结: {木: excess}
    肝郁气滞: {木: excess}
    肝郁: {木: excess}
    肝气犯胃: {木: excess, 土: any}
    阴虚火旺: {note: 虚火：阴虚而火旺，不是“火”行之实——须先辨明何脏之阴虚（肾、肝、肺、心）}
    虚火: {note: 虚火不是“火”行之实——须先辨明何脏之阴虚}
    肝胆湿热: {木: excess}
    肝郁脾虚: {木: excess, 土: deficiency}
    肝脾不和: {木: excess, 土: deficiency}
    肝胃不和: {木: excess, 土: any}
    肝血虚: {木: deficiency}
    肝阴虚: {木: deficiency}
    肝肾阴虚: {木: deficiency, 水: deficiency}
    水不涵木: {水: deficiency, 木: excess}
    肝火犯肺: {木: excess, 金: any}
    木火刑金: {木: excess, 金: any}
    心火亢盛: {火: excess}
    心火: {火: excess}
    痰火扰心: {火: excess}
    心肾不交: {火: excess, 水: deficiency}
    心脾两虚: {火: deficiency, 土: deficiency}
    心气虚: {火: deficiency}
    心阳虚: {火: deficiency}
    心血虚: {火: deficiency}
    心阴虚: {火: deficiency}
    脾气虚: {土: deficiency}
    脾阳虚: {土: deficiency}
    脾虚湿盛: {土: deficiency}
    脾不统血: {土: deficiency}
    湿热蕴脾: {土: excess}
    脾肺气虚: {土: deficiency, 金: deficiency}
    肺脾气虚: {土: deficiency, 金: deficiency}
    脾肾阳虚: {土: deficiency, 水: deficiency, note: 肾阳即命门之火}
    肺气虚: {金: deficiency}
    肺阴虚: {金: deficiency}
    痰热壅肺: {金: excess}
    肺肾阴虚: {金: deficiency, 水: deficiency}
    肾阴虚: {水: deficiency}
    肾阳虚: {水: deficiency}
    肾精不足: {水: deficiency}
    肾气不固: {水: deficiency}
  # 以五行立名的治法（教材）：premise 是其证候前提，须先确认；when：所涉之行的虚实（任一组合相合即可；any 不论虚实）；
  # derive：据五输之理推出的取穴（take mother：补母；take child：泻子；本经与他经各一），与文献所举之例（examples，出处据所引）分开记
  strategies:
    zishui_hanmu: {name: 滋水涵木, en: nourish Water to support Wood, rule: zishui_hanmu, when: [{水: deficiency, 木: any}], premise: 肝肾阴虚（水不涵木）, organs: [肾, 肝], implication: 滋养肝肾之阴；兼肝阳上亢者并平肝潜阳,
                   derive: [{organ: 肝, take: mother}],
                   examples: [{points: [LR3, SP6], context: 相应证型的头痛, source: 北京中医药大学继续教育学院《针灸学》课件, url: "https://jxjyxb.bucm.edu.cn/BZYAttachs/courseware/zhenjiuxue/c2/c2_16b_2.htm",
