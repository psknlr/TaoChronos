# 针灸选穴配穴 —— 经络腧穴的特定穴体系、选穴原则与配穴方法，供 taochronos study acupoints（选穴配穴）与 study point（腧穴考）。
#
# 这份数据把选穴的推理写成可审阅的规则：先定病位与病性、立治则，再按经络关系与特定穴属性取穴，组合成方，并说明每一穴的
# 用意。每条规则都标明它属于哪一层知识 —— 经典与教材的理论（为什么这样取）、术语与定位标准（怎样统一地描述与施行）、
# 临床研究（对特定人群是否有益）—— 三层分开记，不相混同。经典出处附 `probes`（原文语句，按原样检索）：工具在语料中实际
# 找到的见证另行列出，最早见证以检得者为准，`source` 只是通行说法。
#
# 特定穴的归属（五输、原、络、郄、背俞、募、下合、八会、八脉交会、交会）据《灵枢》《难经》《针灸甲乙经》与现行教材；
# 腧穴名称、代码与定位据 GB/T 12346—2021《经穴名称与定位》（经外奇穴用 WHO 2008 代码）。定位文字为标准定位的概述，
# 施术时以标准原文与体表标志为准。“经穴的经脉归属”与“特定穴的功能归属”分开记：章门是脾之募穴，却在足厥阴经上。
#
# 这里没有任何治疗建议：所述主治是传统理论中的“主治”，配穴是推理的结构，不是处方；是否针刺、如何施术，须由合格的
# 执业人员在诊察之后决定。
version: 1
notice: >-
  以下是针灸学传统理论中的选穴与配穴推理（经典与教材所述的“为什么取此穴”），及其文献出处与现代证据的分层说明——
  不是诊断，不是处方，也不是疗效结论。是否针灸、取何穴、如何施术，须由合格的执业人员诊察后决定；胸背、颈项、眼区等处
  针刺不当可致气胸、脏器或神经损伤，孕妇、出血倾向者与安装起搏器者（电针）尤须谨慎。

