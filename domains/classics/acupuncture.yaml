    jinshui_xiangsheng: {name: 金水相生, en: mutually nourish Metal and Water, rule: jinshui_xiangsheng, when: [{金: deficiency, 水: deficiency}], premise: 肺肾阴虚, organs: [肺, 肾], implication: 肺、肾之阴同调,
