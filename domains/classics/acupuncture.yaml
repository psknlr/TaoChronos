                examples: [{points: [LR3, SP6, ST25, ST36, ST37, CV12], context: 腹泻型肠易激综合征（肝郁脾虚证）的临床研究, source: 《重庆医科大学学报》, url: "https://cjournal.hep.com.cn/0253-3626/CN/10.13406/j.cnki.cyxb.004096", doi: 10.13406/j.cnki.cyxb.004096,
                            note: 以证立方，兼用数类特定穴，不是单一的五行取穴}]}
    peitu_zhishui: {name: 培土制水, en: cultivate Earth to control Water, rule: peitu_zhishui, when: [{土: deficiency, 水: excess}], premise: 脾虚而水湿停聚, organs: [脾, 肾], implication: 扶脾与调理水液相合,
                    derive: [{organ: 脾, take: mother}]}
