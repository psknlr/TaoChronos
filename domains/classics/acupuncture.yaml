                   derive: [{organ: 心, take: child}, {organ: 肾, take: mother}]}
    nanjing75: {name: 泻南方补北方（难经·七十五难）, en: "drain the South, nourish the North (Nanjing 75)", rule: nanjing75, when: [{木: excess, 金: deficiency}], premise: 东方实、西方虚——肝实而肺虚, organs: [肝, 肺],
                implication: 泻火（木之子）、补水（木之母，水胜火），欲令金不得平木——原文言方位与五行，不言何经何穴,
                note: 取何经何穴是后人的读法，注家所说不一；这里按五输之理列出的火穴、水穴只是一种推演,
                derive: [{organ: 肝, take: child}, {organ: 肝, take: mother}]}
  # 取穴之法（病经属某行、其证或虚或实）：本工具按五输之理逐一推出，分层标明
  methods:
    nanjing69: {name: 本经补母泻子, en: mother–child points on the affected channel, level: classical, rule: mother_child}
    nanjing69_cross: {name: 他经补母泻子, en: same-phase point of the mother or child channel, level: teaching, rule: mother_child_cross,
                      note: 与本经之法可合用，也可只用其一；文献另有他种取法（如取母经之母穴），须分别标明}
    own_channel: {name: 不实不虚，以经取之, en: neither excess nor deficiency — take the channel itself, level: classical, rule: own_phase}
    nanjing79: {name: 心病取手心主, en: Heart disorders through the Pericardium channel (Nanjing 79), level: classical, rule: nanjing79}
    saam: {name: 舍岩针法, en: Saam four-needle acupuncture, level: school, rule: saam,
           templates: {deficiency: {name: 正格, en: deficiency template, tonify: mother, sedate: controller}, excess: {name: 胜格, en: excess template, tonify: controller, sedate: child}}}
    interior_exterior: {name: 表里经补母泻子, en: mother–child points on the interior–exterior partner, level: deduction, rule: pair_mother_child}
    same_name: {name: 同名经补母泻子, en: mother–child points on the same-name channel, level: deduction, rule: pair_mother_child}
  # 不能由五行之式推出的结论：when 是适用之时（always；phase；state；method；text）；claims：原文中一望而知的这类推论
  guards:
    two_decisions: {when: always, level: teaching, statement: 五行关系转为选穴，须经两个中间决定：辨明证候，指明取穴之法；“木实”本身不分肝火上炎、肝阳上亢、肝气郁结与肝郁脾虚。}
    three_attributes: {when: always, level: classical, statement: 经脉的五行、穴的五行、补泻的意图是三种属性：选火穴不等于补火——行间是火穴，可按“实者泻其子”用于泻；土穴不等于补脾——太冲仍是肝经之穴，其解读兼及所在之经、原穴之位、传统主治与刺激方式。}
    same_phase_not_yuan: {when: always, level: classical, statement: 本经的同气之穴不必是原穴：肝经的同气之穴是大敦（井，木），原穴是太冲（输，土）。《难经》六十四难言五输的五行，六十六难言原穴，六十九难言补母泻子——相关而各为一类。}
    pathogen_terms: {when: always, level: classical, statement: 《难经·五十难》的“虚邪”“实邪”说的是邪之所从来（母、子），不是虚证、实证；病人的虚实寒热须另行判断。}
    no_conservation: {when: always, level: deduction, statement: 相生之序（木生火，火生土）不说明刺激一穴的大小、时机与净效应，不能当作守恒方程，推出补火必同时泻木、益土。}
    reinforce_child: {when: {state: excess}, level: classical, statement: 补子与泻子是两种干预：“补火以泄木”不能改称《难经·六十九难》的“实者泻其子”；若“火虚”确是证候的一部分，须指明是心气虚、心阳虚，还是命门火衰——三者不可互换。}
    no_fixed_arrangement: {when: {states: 2}, level: teaching, statement: 木实不意味着水实；“二实三虚”之类的固定格局不是普遍的诊断规则——所提出的每一种关系都须有证候的依据。}
    mixed: {when: {mixed: true}, level: deduction, statement: 实与虚并见于不同之脏：先定主次，补泻相合；单一的“泻木”之式不能代表整个证候。}
    spleen_first: {when: {phase: 木}, level: classical, statement: 《金匮要略》“见肝之病，知肝传脾，当先实脾；四季脾王不受邪，即勿补之”：防传有其条件——脾已足者不须再补；不据此在每一个肝病处方里都加补脾之穴（太白、足三里、脾俞……），是否取之看所辨之证。}
    taixi_earth: {when: {phase: 水}, level: classical, statement: 太溪是肾经的输穴，五行属土——不因其在肾经而改称水穴；以太溪补肾，据的是其原穴之位与传统主治，是另一理。}
    lung_points: {when: {phase: 金}, level: classical, statement: 中府（肺之募）、肺俞（肺之背俞）并不因与肺相关而成为五输的金穴；太渊是输穴（土）、肺经的母穴与原穴。}
    saam_school: {when: {method: saam}, level: school, statement: 舍岩针法是朝鲜半岛形成的一家之法：其正格、胜格是流派的模板，不是“肝虚即泻肺、肝实即补肺”的普遍之规；兼有肺虚、肾虚或虚实夹杂者须另作解读。}
    pair_steps: {when: {method: same_name}, level: deduction, statement: 心包经不是肝经的母经：取曲泽是先因手足厥阴同名而及心包经，再按水为木之母取其水穴——两步都须写明；表里经之法同此。}
    mu_shu: {when: always, level: classical, statement: “募在阴，俞在阳”（《难经·六十七难》）不立“募穴只针、背俞只灸”之规；“阴穴（井、输、合）宜针、阳穴（荥、经、背俞）宜灸”也不是五输的通则——穴的归类、证候的判断与用针或用灸是三个决定。}
    separate_systems: {when: {text: "卦|周易|易经|易学|八卦|干支|天干|地支|子午流注|灵龟|飞腾|纳甲|纳子|trigram|hexagram|i ching|yi jing|stems|branches"}, level: teaching,
                       statement: 经脉的五行、五输穴的五行、易学（卦象）或按时取穴体系中的配属，可以并存而不互换：卦象不改变一穴的五输归类；年、日的天干地支本身不能判断一人的虚实，也不能决定补、泻或灸。用某一家的卦象或按时取穴之法，须按其本身的文献与规则另行研究。}
    evidence_apart: {when: always, level: teaching, statement: 理论推理与临床证据分开评价：文献支持把这些方法当作可追溯的传统选穴体系来研究，其临床效果仍须就具体病证与处方评价。}
  claims:
    - {guard: reinforce_child, pattern: "补火.{0,4}[泄泻抑]木|补子.{0,4}[泄泻]母|reinforc\\w* (?:the )?fire to (?:drain|draw|reduce|sedate) (?:the )?wood"}
    - {guard: no_fixed_arrangement, pattern: "木实.{0,8}水实|木旺.{0,8}水旺|木盛.{0,8}水盛|二实三虚|两实三虚|wood excess.{0,40}water excess|two excess.{0,30}three defici"}
    - {guard: mu_shu, pattern: "阴穴.{0,12}针.{0,16}阳穴.{0,12}灸|募.{0,8}针.{0,12}俞.{0,8}灸|needle (?:the )?yin points|moxibustion (?:to|on) (?:the )?yang points"}
    - {guard: taixi_earth, pattern: "太溪.{0,8}水穴|taixi.{0,24}water point"}
    - {guard: lung_points, pattern: "(?:中府|肺俞).{0,8}金穴|(?:zhongfu|feishu).{0,24}metal point"}
    - {guard: spleen_first, pattern: "(?:肝病|肝实|肝虚|肝郁).{0,12}(?:必|都|皆|一律).{0,4}(?:加|补)脾"}

