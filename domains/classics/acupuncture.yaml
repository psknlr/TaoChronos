# ------------------------------------------------------------------ 症状（对症选穴）
# points：首选在前；classical：古籍中写此症的常见字面（用于在原文的主治语句中检索）；five_shu：《难经·六十八难》以此类症归之的
# 五输类别（只在病经已知时提示其该类穴，不意味着凡有此症皆取该类穴）；region：此症通常所在之部（未给病位时用）；
