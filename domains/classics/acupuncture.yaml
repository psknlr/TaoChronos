    xienan_bubei: {name: 泻南补北, en: drain the South and nourish the North, rule: xienan_bubei, when: [{火: excess, 水: deficiency}], premise: 心肾不交（心火亢而肾阴虚）, organs: [心, 肾], implication: 清心火与滋肾阴相合,
