# ------------------------------------------------------------------ 规则：每一条选穴、配穴、施术的依据
# level：classical（经典）· teaching（现代教材）· school（流派之法，如舍岩针法）· deduction（教学推演与近人推论）·
# empirical（经验配穴）· standard（标准与规范）；probes：原文语句（按原样检索，
# 不含标点），reading：同一术语的不同读法；modern：现代证据（见 modern）
rules:
  # 选穴原则
  local: {name: 近部选穴, en: local point selection, kind: principle, level: classical, statement: 在病痛所在或其邻近取穴；“近部”以病位而言，兼顾所及组织、与运动有关的症状、压痛与检查所见。, source: 《灵枢·经筋》“以痛为输”, probes: [以痛为输]}
  ashi: {name: 阿是穴, en: Ashi points, kind: principle, level: classical, statement: 以压痛或局部反应定其处，无固定的名称与定位，依个体检查而取。, source: 《备急千金要方·灸例》“阿是之法”, probes: [阿是]}
  distal: {name: 远部选穴, en: distal point selection, kind: principle, level: classical, statement: 取远离病位、而经络上与之相连之穴，多在肘膝前后。, source: 《灵枢·终始》“病在上者下取之，病在下者高取之，病在头者取之足，病在腰者取之腘”；《灵枢·官针》“远道刺”, probes: [病在上者下取之, 病在头者取之足, 远道刺者]}
  channel_course: {name: 循经取穴, en: selection by channel course, kind: principle, level: classical, statement: 病位所过之经即选经的线索：经脉、经筋的分布与走向，运动与压痛所见，伴随的脏腑、官窍与全身之候，三者合参。, source: 《灵枢·经脉》《灵枢·经筋》, probes: [经脉者所以能决死生]}
  headache_channels: {name: 头痛分经, en: headache differentiated by channel, kind: principle, level: teaching, statement: 前额属阳明，侧头属少阳，后头属太阳，巅顶属厥阴——是选穴的线索；诊断仍须病史、检查与伴随之候。, source: 现代针灸学教材（承六经头痛之说）}
  four_command: {name: 四总穴, en: Four Command Points, kind: principle, level: classical, statement: 肚腹三里留，腰背委中求，头项寻列缺，面口合谷收。, source: 《四总穴歌》（通行说法出明代针灸书，如《针灸聚英》；语料中的最早见证以所检为准）, probes: [肚腹三里留, 腰背委中求, 头项寻列缺, 面口合谷收]}
  pattern: {name: 辨证选穴, en: pattern-based selection, kind: principle, level: classical, statement: 病位定经与部，病性与病机定治则与加减：补虚泻实，清热温寒，标本缓急，因人制宜。, source: 《灵枢·经脉》“盛则泻之，虚则补之，热则疾之，寒则留之，陷下则灸之”, probes: [盛则泻之, 陷下则灸之]}
  symptom: {name: 对症选穴, en: symptom-oriented selection, kind: principle, level: teaching, statement: 针对突出的症状取穴，与辨证并用，不替代辨证。, source: 现代针灸学教材}
  classical_indication: {name: 古籍主治, en: classical indications, kind: principle, level: classical, statement: 古籍言某穴“主之”某症者，是该穴的文献主治；本工具据语料中“……某穴主之”“某穴主……”“取某穴”等语句检得，每条附原文。, source: 《针灸甲乙经》卷七至卷十二等}
  # 特定穴类别
  five_shu: {name: 五输穴, en: Five-Shu points, kind: category, level: classical, statement: 所出为井，所溜为荥，所注为腧，所行为经，所入为合。, source: 《灵枢·九针十二原》《灵枢·本输》, probes: [所出为井, 所溜为荥]}
  five_phase: {name: 五输配五行, en: Five-Phase correspondence of the Five-Shu points, kind: category, level: classical, statement: 阴井木，阳井金；阴荥火，阳荥水；阴俞土，阳俞木；阴经金，阳经火；阴合水，阳合土。, source: 《难经·六十四难》, probes: [阴井木, 阳荥水]}
  nanjing68: {name: 五输主病（难经）, en: Five-Shu indications (Nanjing 68), kind: category, level: classical, statement: 井主心下满，荥主身热，俞主体重节痛，经主喘咳寒热，合主逆气而泄。, source: 《难经·六十八难》, probes: [井主心下满, 荥主身热]}
  lingshu44: {name: 五输取法（灵枢）, en: Five-Shu selection criteria (Lingshu 44), kind: category, level: classical, statement: 病在藏者取之井，病变于色者取之荥，病时间时甚者取之输，病变于音者取之经，经满而血者、病在胃及以饮食不节得病者取之于合。, source: 《灵枢·顺气一日分为四时》, probes: [病在藏者取之井, 病变于色者取之荥, 经满而血者]}
  yuan: {name: 原穴, en: Yuan-Source points, kind: category, level: classical, statement: 五藏有疾，当取之十二原；阴经以输为原，阳经别置一原（“三焦行于诸阳，故置一俞，名曰原”）。, source: 《灵枢·九针十二原》；《难经·六十二难》《六十六难》, probes: [五藏有疾当取之十二原, 三焦行于诸阳, 肺之原出于太渊]}
  luo: {name: 络穴, en: Luo-Connecting points, kind: category, level: classical, statement: 十五络：十二经各一，任脉、督脉之络与脾之大络；络穴兼及表里两经。, source: 《灵枢·经脉》；《难经·二十六难》“络有十五”, probes: [名曰列缺, 络有十五]}
  xi: {name: 郄穴, en: Xi-Cleft points, kind: category, level: classical, statement: 经气深聚之处；教学上阴经郄穴多用于血证，阳经郄穴多用于急性痛证——是倾向，不是排他之规。, source: 《针灸甲乙经》卷三（“手太阴之郄”等）, probes: [手太阴之郄]}
  back_shu: {name: 背俞穴, en: Back-Shu points, kind: category, level: classical, statement: 脏腑之气输注于背部之穴；教学上脏病多用背俞，而不排他。, source: 《难经·六十七难》“五藏募皆在阴，而俞皆在阳”, probes: [五藏募皆在阴, 阴病行阳]}
  front_mu: {name: 募穴, en: Front-Mu points, kind: category, level: classical, statement: 脏腑之气汇聚于胸腹之穴；教学上腑病多用募穴，而不排他。募穴未必在本脏腑之经（章门在肝经而为脾募）。, source: 《难经·六十七难》, probes: [五藏募皆在阴]}
  lower_he: {name: 下合穴, en: Lower He-Sea points, kind: category, level: classical, statement: 合治内府；胃合于三里，大肠合入于巨虚上廉，小肠合入于巨虚下廉，三焦合入于委阳，膀胱合入于委中央，胆合入于阳陵泉。, source: 《灵枢·邪气藏府病形》, probes: [合治内府, 胃合于三里]}
  hui: {name: 八会穴, en: Eight Influential Points, kind: category, level: classical, statement: 府会太仓，藏会季胁，筋会阳陵泉，髓会绝骨，血会鬲俞，骨会大杼，脉会太渊，气会三焦外一筋直两乳内也。, source: 《难经·四十五难》, probes: [府会太仓, 脉会太渊, 髓会绝骨]}
  confluent: {name: 八脉交会穴, en: Eight Confluent Points, kind: category, level: classical, statement: 公孙冲脉胃心胸，内关阴维下总同；临泣胆经连带脉，阳维目锐外关逢；后溪督脉内眦颈，申脉阳跷络亦通；列缺任脉行肺系，阴跷照海膈喉咙。, source: 《八脉交会八穴歌》（窦汉卿所传，见《针经指南》《针灸大全》）, probes: [公孙冲脉胃心胸, 内关阴维下总同, 临泣胆经连带脉, 列缺任脉行肺系]}
  crossing: {name: 交会穴, en: Crossing points, kind: category, level: classical, statement: 两经或数经相交会之穴，其传统主治可兼及所会诸经。, source: 《针灸甲乙经》卷三各穴下“某某之会”, probes: [足太阴厥阴少阴之会]}
  extra: {name: 经外奇穴, en: extra points, kind: category, level: standard, statement: 有定名、定位，而未归入或不便归入十四经的腧穴；与阿是穴不同。, source: WHO 2008《标准针灸穴位》；GB/T 12346—2021}
  # 配穴方法
  local_distal: {name: 近远配穴, en: local–distal combination, kind: combination, level: teaching, statement: 病位附近之穴配经络上相连的远部之穴。, source: 《灵枢·终始》；现代教材, probes: [病在上者下取之]}
  upper_lower: {name: 上下配穴, en: upper–lower combination, kind: combination, level: classical, statement: 上部之穴与下部之穴相配。, source: 《灵枢·终始》“病在上者下取之，病在下者高取之”, probes: [病在下者高取之]}
  anterior_posterior: {name: 前后配穴, en: anterior–posterior combination, kind: combination, level: classical, statement: 胸腹之穴与背部之穴相配（偶刺之法）。, source: 《灵枢·官针》“偶刺者，以手直心若背，直痛所，一刺前，一刺后”, probes: [偶刺者]}
  left_right: {name: 左右配穴, en: left–right combination, kind: combination, level: classical, statement: 两侧同取，或左病取右、右病取左（巨刺、缪刺），按病情而定。, source: 《素问·阴阳应象大论》“以右治左，以左治右”；《灵枢·官针》巨刺, probes: [以右治左, 巨刺]}
  same_channel: {name: 本经配穴, en: same-channel combination, kind: combination, level: teaching, statement: 同一经的穴相配。, source: 现代教材}
  interior_exterior: {name: 表里经配穴, en: interior–exterior channel combination, kind: combination, level: classical, statement: 互为表里的阴经与阳经之穴相配（肺与大肠、脾与胃、心与小肠、肾与膀胱、心包与三焦、肝与胆）。, source: 《素问·血气形志》“足太阳与少阴为表里”, probes: [足太阳与少阴为表里]}
  same_name: {name: 同名经配穴, en: same-name channel combination, kind: combination, level: teaching, statement: 手足同名经（太阴、少阴、厥阴、阳明、太阳、少阳）之穴相配。, source: 现代教材}
  yuan_luo: {name: 原络配穴（主客原络）, en: Yuan–Luo (host–guest) combination, kind: combination, level: classical, statement: 先病之经（主）取其原穴，后病的表里经（客）取其络穴。主客是处方的道理，不规定进针的先后。, source: 明·杨继洲《针灸大成》“十二经治症主客原络”；现代教材, probes: [主客原络]}
  shu_mu: {name: 俞募配穴, en: Back-Shu–Front-Mu combination, kind: combination, level: classical, statement: 同一脏腑的背俞穴与募穴相配。, source: 《难经·六十七难》“阴病行阳，阳病行阴，故令募在阴，俞在阳”, probes: [阴病行阳]}
  shu_yuan: {name: 俞原配穴, en: Back-Shu–Yuan combination, kind: combination, level: teaching, statement: 同一脏腑的背俞穴与其经之原穴相配。, source: 现代教材}
  lowerhe_mu: {name: 合募配穴, en: Lower He-Sea–Front-Mu combination, kind: combination, level: teaching, statement: 六腑的下合穴与募穴相配。, source: 现代教材；“合治内府”（《灵枢·邪气藏府病形》）, probes: [合治内府]}
  xi_hui: {name: 郄会配穴, en: Xi-Cleft–Influential combination, kind: combination, level: teaching, statement: 相关之经的郄穴配以相应的八会穴（如梁丘配中脘：中脘为腑会）。, source: 现代教材}
  confluent_pair: {name: 八脉交会配穴, en: confluent-point pair, kind: combination, level: classical, statement: 八脉交会穴两两相配，主其相合之部；可单用亦可成对，不必八穴尽用。, source: 《八脉交会八穴歌》, probes: [公孙冲脉胃心胸]}
  mother_child_cross: {name: 他经补母泻子, en: cross-channel mother–child, kind: combination, level: teaching, statement: 虚补母经之同气之穴（母经自身五行之穴），实泻子经之同气之穴；母、子以病经之五行而定。与本经之法可合用，也可只用其一；文献另有他种取法，须分别标明。, source: 《难经·六十九难》；现代教材, probes: [虚者补其母]}
  four_gates: {name: 四关穴, en: the Four Gates, kind: combination, level: empirical, statement: 今多指双侧合谷、太冲；“四关”一词历代所指不一，宜就原文读其义。, source: 《灵枢·九针十二原》；《标幽赋》；明清针灸书,
               probes: [{text: 十二原出于四关, reading: 《灵枢》：十二原出于四关——四关为肘膝四关节}, {text: 开四关而已之, reading: 《标幽赋》：寒热痹痛，开四关而已之}, {text: 四关者两手两足, reading: 四关为两手两足}, {text: 太冲合谷是也, reading: 四关为太冲、合谷}, {text: 所谓开四关者, reading: 开四关即合谷、太冲}]}
  # 施术
  mother_child: {name: 补母泻子, en: mother–child tonification and reduction, kind: technique, level: classical, statement: 虚者补其母，实者泻其子；母、子以病经的五行而定。选穴与补泻相关而各自为一事：原穴不当只视为补穴。, source: 《难经·六十九难》, probes: [虚者补其母, 实者泻其子]}
  own_phase: {name: 不实不虚，以经取之, en: neither excess nor deficiency — the channel itself, kind: technique, level: classical, statement: 不实不虚，以经取之者，是正经自生病，不中他邪也，当自取其经。后世多读作取本经与本经同五行之穴（同气之穴，如肺金之经渠）——其理与取母穴、子穴不同；同气之穴不必是原穴。, source: 《难经·六十九难》；现代教材, probes: [不实不虚以经取之]}
  localization: {name: 腧穴定位, en: point localization, kind: standard, level: standard, statement: 以体表解剖标志与骨度折量为主，指寸为辅；寸是比例单位，不是固定的厘米数，医者手指不能代替病人的比例。, source: GB/T 12346—2021《经穴名称与定位》}
  safety: {name: 针刺安全, en: needling safety, kind: caution, level: standard, statement: 胸背、颈项、眼区等处针刺不当可致气胸、脏器与神经损伤、出血与感染；须由合格人员按规范施术。, source: NCCIH 针灸疗效与安全说明；WHO 针灸实践与安全文件}
  # 五行之用
  five_phase_cycles: {name: 生克乘侮, en: "generation, control, overacting and counteracting", kind: principle, level: classical, statement: 气有余，则制己所胜而侮所不胜；其不及，则己所不胜侮而乘之，己所胜轻而侮之。教材据此言母病及子、子病犯母、相乘与相侮，乘、侮又各有太过、不及两种来由。, source: 《素问·五运行大论》；中医基础理论教材, probes: [制己所胜, 己所胜轻而侮之]}
  five_pathogens: {name: 五邪（难经·五十难）, en: the five pathogenic influences (Nanjing 50), kind: principle, level: classical, statement: 从后来者为虚邪，从前来者为实邪，从所不胜来者为贼邪，从所胜来者为微邪，自病者为正邪。假令心病，中风得之为虚邪，伤暑得之为正邪，饮食劳倦得之为实邪，伤寒得之为微邪，中湿得之为贼邪。——以邪之所从来分类，不是虚证、实证。, source: 《难经·五十难》, probes: [从后来者为虚邪, 从所不胜来者为贼邪, 自病者为正邪]}
  nanjing75: {name: 泻南方补北方, en: "drain the South, nourish the North (Nanjing 75)", kind: strategy, level: classical, statement: 东方实，西方虚，泻南方，补北方……南方火，火者，木之子也；北方水，水者，木之母也。水胜火。子能令母实，母能令子虚，故泻火补水，欲令金不得平木也。——言方位与五行，不言何经何穴；取何穴是后人的读法，注家所说不一。, source: 《难经·七十五难》, probes: [东方实西方虚, 泻南方补北方, 子能令母实, 不能治其虚何问其余]}
  prevent_transmission: {name: 见肝之病，当先实脾, en: strengthen the Spleen before Liver disease transmits to it, kind: principle, level: classical, statement: 上工治未病……见肝之病，知肝传脾，当先实脾；四季脾王不受邪，即勿补之。——治已病而顾及将传之脏；是否补之，据其脏的实际情况。, source: 《难经·七十七难》；《金匮要略·脏腑经络先后病脉证第一》, probes: [知肝当传之与脾, 当先实脾, 四季脾王不受邪, 即勿补之]}
  nanjing79: {name: 心病取手心主, en: Heart disorders through the Pericardium channel (Nanjing 79), kind: technique, level: classical, statement: 假令心病，泻手心主俞，是谓迎而夺之者也；补手心主井，是谓随而济之者也。——心病取手心主（心包）之经：泻其输（大陵，土，为火之子），补其井（中冲，木，为火之母）。, source: 《难经·七十九难》, probes: [泻手心主俞, 补手心主井]}
  saam: {name: 舍岩针法, en: Saam four-needle acupuncture, kind: technique, level: school, statement: 虚证之正格补其母、泻克我者；实证之胜格补克我者、泻其子；每一行于病经与该行之经各取一穴，共四穴（如肝虚：补曲泉、阴谷，泻中封、经渠；肝实：补中封、经渠，泻行间、少府）。是一家的模板，不是普遍之规。, source: "朝鲜半岛针法（传为舍岩道人所创）；Ahn C-B, A Study of Sa-Ahm Five Element Theory (Saam)"}
  pair_mother_child: {name: 表里经、同名经补母泻子, en: mother–child points through the paired or same-name channel, kind: technique, level: deduction, statement: 先由表里或手足同名之关系及于他经，再按母子之理取该经的五行之穴：心虚取小肠经木穴后溪、心实取小肠经土穴小海；肝虚取心包经水穴曲泽、肝实取心包经火穴劳宫。两步都须写明。, source: 张嘉程、苏志超、白雪、王金贵《五输穴子母补泻法及其临床应用探讨》，《天津中医药》2024;41(4):436-439（举例据所引，未在此核对全文）}
  wuxing_record: {name: 五行选穴记录, en: Five-Phase selection record, kind: standard, level: teaching, statement: 证候前提 → 所涉之经 → 五行关系 → 取穴之规 → 补泻意图 → 文献或经验出处；如此推理可以复核，并看清经典之规止于何处、另加的临床或理论假定从何处开始。, source: 选穴推理的记录方法}
  zishui_hanmu: {name: 滋水涵木, en: nourish Water to support Wood, kind: strategy, level: teaching, statement: 肝肾阴虚（水不涵木）：滋养肝肾之阴；兼肝阳上亢者并平肝潜阳。, source: 中医基础理论教材（五行学说的应用）, probes: [滋水涵木, {text: 水不涵木, reading: 病机之语}]}
  peitu_shengjin: {name: 培土生金, en: cultivate Earth to generate Metal, kind: strategy, level: teaching, statement: 脾肺气虚：扶脾与补肺相合。, source: 中医基础理论教材（五行学说的应用）, probes: [培土生金]}
  jinshui_xiangsheng: {name: 金水相生, en: mutually nourish Metal and Water, kind: strategy, level: teaching, statement: 肺肾阴虚：肺、肾之阴同调。, source: 中医基础理论教材（五行学说的应用）, probes: [金水相生]}
  yihuo_butu: {name: 益火补土, en: reinforce Fire to support Earth, kind: strategy, level: teaching, statement: 多为脾肾阳虚：温补肾阳以暖脾阳。此“火”多指肾阳、命门之火，不即心经或五输的火穴。, source: 中医基础理论教材（五行学说的应用）, probes: [益火补土, {text: 火不生土, reading: 病机之语}]}
  yimu_futu: {name: 抑木扶土, en: restrain Wood and support Earth, kind: strategy, level: teaching, statement: 肝脾不和或肝胃不和：调肝与扶助运化相合。, source: 中医基础理论教材（五行学说的应用）, probes: [抑木扶土, {text: 木乘土, reading: 病机之语}]}
  peitu_zhishui: {name: 培土制水, en: cultivate Earth to control Water, kind: strategy, level: teaching, statement: 脾虚而水湿停聚：扶脾与调理水液相合。, source: 中医基础理论教材（五行学说的应用）, probes: [培土制水]}
  zuojin_pingmu: {name: 佐金平木, en: assist Metal to balance Wood, kind: strategy, level: teaching, statement: 肝肺不调（如肝火犯肺）：调理肺之功能，兼平肝之扰。, source: 中医基础理论教材（五行学说的应用）, probes: [佐金平木, {text: 木火刑金, reading: 病机之语}]}
  xienan_bubei: {name: 泻南补北, en: drain the South and nourish the North, kind: strategy, level: teaching, statement: 心肾不交（心火亢于上、肾阴亏于下）：清心火、滋肾阴。此为后世之用；语出《难经·七十五难》“泻南方，补北方”，原文所论是东方（肝）实、西方（肺）虚。, source: 中医基础理论教材；《难经·七十五难》, probes: [泻南补北]}
  record: {name: 处方记录, en: prescription record, kind: standard, level: teaching, statement: 处方包括穴位、左右、施术方式、刺激方法、治疗频次与疗程；据症状与功能的变化、耐受与不良反应而调整。, source: 现代教材；WHO 针灸实践文件}

# ------------------------------------------------------------------ 现代证据（与理论分开）
# 只记载经过核对的系统评价；它们说明的是“针灸（按所研究的方式）对特定人群是否有益”，不验证五输、原络、补母泻子等规则
modern:
  vickers2018:
    citation: "Vickers AJ, Vertosick EA, Lewith G, et al.; Acupuncture Trialists' Collaboration. Acupuncture for Chronic Pain: Update of an Individual Patient Data Meta-Analysis. J Pain. 2018;19(5):455–474."
    pmid: "29198932"
    design: 个体病例数据荟萃分析（IPD meta-analysis）
    population: 慢性疼痛（肌肉骨骼痛、骨关节炎、慢性头痛、肩痛）
    size: 39 项试验，20 827 例
    finding: 针灸优于假针刺与不针刺对照，疗效随时间大部分保持；与假针刺的差别小于与不针刺的差别。
    limits: 是“针灸”整体在这些人群中的证据，不验证任何具体的选穴或配穴规则。
    applies: {regions: [lumbar, neck_posterior, neck_lateral, knee, shoulder, head, forehead, temple, occiput, vertex], symptoms: [low_back_pain, neck_stiffness, headache, joint_pain]}
  macpherson2013:
    citation: "MacPherson H, Maschino AC, Lewith G, et al. Characteristics of acupuncture treatment associated with outcome: an individual patient meta-analysis of 17,922 patients with chronic pain in randomised controlled trials. PLoS One. 2013;8(10):e77438."
    doi: 10.1371/journal.pone.0077438
    design: 个体病例数据荟萃分析
    population: 慢性疼痛的随机对照试验
    size: 29 项试验，17 922 例
    finding: 针刺风格、选穴方式（固定、半固定或个体化）、针数、治疗频次等多数特征与疗效差别的关联证据有限。
    limits: 数据、统计效能与混杂所限，且缺少辨证的信息；“某种配穴更优”须有专门设计的比较研究。
    applies: all
  lee2015:
    citation: "Lee A, Chan SKC, Fan LTY. Stimulation of the wrist acupuncture point PC6 for preventing postoperative nausea and vomiting. Cochrane Database Syst Rev. 2015;(11):CD003281."
    doi: 10.1002/14651858.CD003281.pub4
    design: Cochrane 系统评价
    population: 术后恶心呕吐的预防
    size: 59 项试验，7 667 例
    finding: 与假刺激相比，刺激内关可减少术后恶心与呕吐；评价者将证据质量评为低。
    limits: 限于术后恶心呕吐的预防，不推及其他原因的恶心呕吐，也不验证“胃气上逆”的理论解释。
    applies: {points: [PC6], symptoms: [nausea_vomiting]}
  kim2015:
    citation: "Kim JE, et al. Acupuncture for chronic fatigue syndrome and idiopathic chronic fatigue: a multicenter, nonblinded, randomized controlled trial. Trials. 2015;16:314."
    pmid: "26211002"
    doi: 10.1186/s13063-015-0857-0
    design: 多中心、非盲、三组平行的随机对照试验（体针加常规治疗、舍岩针加常规治疗、单用常规治疗）
    population: 慢性疲劳综合征与特发性慢性疲劳
    size: 150 例，四家医院
    finding: 主要结局（第 5 周疲劳严重度量表）：体针组低于常规治疗组（P = 0.023），舍岩针组未见显著差别；次要结局中，两治疗组的应激反应量表在第 5、13 周低于对照，舍岩针组的贝克抑郁量表在第 13 周低于对照。
    limits: 非盲，以常规治疗为对照（无假针刺），不逐一检验舍岩针法的各个四针组合；既不证明五行取穴的全部配方，也不否定任何一个具体组合。
    applies: {methods: [saam]}
# 三层知识（第 9 节）
evidence_levels:
  - {level: classical, name: 经典与教材理论, establishes: 为什么传统上这样取穴、这样配穴}
  - {level: standard, name: 术语、定位与操作规范, establishes: 怎样一致地描述与施行（GB/T 12346—2021；WHO 2022 中医药术语国际标准）}
  - {level: clinical, name: 临床研究, establishes: 对一定的人群是否有益、一种方法是否优于另一种}

# ------------------------------------------------------------------ 安全
cautions:
  thorax: {name: 胸背部, text: 深部为胸膜与肺，直刺过深可致气胸；宜平刺或斜刺、浅刺。}
  viscera: {name: 胁腹部, text: 深部为肝、胃、脾、肾等脏器，不宜深刺；脏器肿大者尤须谨慎。}
  lower_abdomen: {name: 下腹部, text: 针刺前宜排空小便；孕妇慎用。}
  nape: {name: 项部, text: 深部近延髓与椎动脉：风府不可向上深刺，风池针尖朝向鼻尖、不可向内上方深刺。}
  throat: {name: 天突, text: 先直刺浅入，再沿胸骨柄后缘向下，不可过深或偏斜，以免伤及气管与大血管。}
  eye: {name: 眼区, text: 血管丰富：轻缓进针，不提插捻转，出针按压，防止出血。}
  artery: {name: 动脉旁, text: 近动脉，进针时避开动脉搏动处。}
  umbilicus: {name: 神阙, text: 传统禁针，多用灸法。}
  pregnancy: {name: 孕期, text: 教材列为孕妇不宜针刺之穴（合谷、三阴交、昆仑、至阴、肩井等，以及下腹部、腰骶部腧穴）。}
general_cautions:
  - 由合格的执业人员在诊察之后施术；使用无菌一次性针具。
  - 出血倾向或服用抗凝药者、孕妇、安装心脏起搏器者（电针）须事先说明并评估。
  - 晕针、疼痛、出血、感染等不良反应须记录，并据以调整方案。
