  茯苓: {en: [Poria cocos]}
  泽泻: {en: [Alisma orientale]}
  牡丹皮: {en: [Paeonia suffruticosa, paeonol]}
  石膏: {en: [gypsum]}
  柴胡: {en: [Bupleurum, saikosaponin]}
  半夏: {en: [Pinellia ternata]}
  当归: {en: [Angelica sinensis]}
  川芎: {en: [Ligusticum chuanxiong]}
  三七: {en: [Panax notoginseng]}
