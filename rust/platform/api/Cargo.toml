[package]
name = "tao-api"
description = "api.impf.ai: the developer API and the organisations' accounts (docs/adr/0038-accounts-keys-and-credits.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tao-platform.workspace = true
tao-edge.workspace = true
worker.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
futures-util.workspace = true

# worker-build: no wasm-opt (a binary it would download, unpinned: docs/adr/0026-pinned-supply-chain-and-enforced-policies.md)
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
