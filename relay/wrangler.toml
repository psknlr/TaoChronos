# 道乃久默认服务 — the relay between chat.impf.ai and MiniMax (relay/README.md), and OpenAI for the second model.
# Deployed by .github/workflows/relay.yml.  Its secrets — MINIMAX_API_KEY and LOG_EXPORT_TOKEN; OPENAI_API_KEY,
# SPONSOR_SECRET, SENTINEL_SALT and ACTIVITY_KEY when the repository has them — are set from the repository's Actions
# secrets at each deployment; they are never written here or anywhere in the repository.
name = "taochronos-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
# request.signal: a visitor who leaves (or stops the answer) cancels the model call, which costs nothing further
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false  # no <version>-<name>.<account>.workers.dev address either: none of the zone's edge rules stand before one

# the Worker's own hostname; Cloudflare creates its DNS record and certificate (the name must not exist in DNS before)
[[routes]]
pattern = "chat-api.impf.ai"
custom_domain = true

[vars]
# MiniMax's mainland platform; a key from the international platform (platform.minimax.io) needs https://api.minimax.io/v1
UPSTREAM_BASE = "https://api.minimax.cn/v1"
MODELS = "MiniMax-M3"
# the model's name on the page (and in everything a visitor can see): the upstream is never named there
PUBLIC_MODEL = "Tao-R1"
# tokens a reply may use, its reasoning included (MiniMax-M3 counts it; the page asks up to this when the visitor set
# no number): the day's token budgets below bound what replies cost, not this
MAX_OUTPUT_TOKENS = "32768"
# a model service that sends nothing — no status, no header — for UPSTREAM_FIRST_BYTE_SECONDS is not waited for: the
# call is given up and made again, UPSTREAM_ATTEMPTS times in all (a 5xx of its own and a failed connection are asked
# again too; a refusal is not), before the visitor is told — nothing of a reply has gone out by then, and the visitor is
# counted once.  In the records to 2026-11-10: of 1,215 calls a page watched to their answer, none took 90 s to begin
# and 2.5% took more than 30 s; one call in ten never began (53 s to the service's own 5xx, or past the page's 120 s).
# Seconds × attempts stays under the page's own wait for a first reply (web/js/limits.js, firstReply: 120 s).
# "0" seconds: waited for as long as it takes; "1" attempt: asked once, as before
UPSTREAM_FIRST_BYTE_SECONDS = "30"
UPSTREAM_ATTEMPTS = "3"
# where the default model is asked from, in turn: "direct" — the Cloudflare location the visitor reached, where this
# Worker runs — and Durable Object location hints (wnam, enam, sam, weur, eeur, apac, oc, afr, me): an object placed
# there makes the call (EGRESS, below).  Why: a visitor in mainland China reaches Cloudflare in Amsterdam, Seattle, San
# Jose, Los Angeles or London (the sentinel's events), and the model service is in mainland China — asked from there, the
# request crosses the border a second time, on that location's own path.  In the records to 2026-11-10 it is on that
# path that requests never began: one in ten, one in five in the Beijing evening, more after an idle gap and with a
# longer request, a few visitors bearing most of them — while other visitors' requests in the same minutes, and the
# other services' from the same page, went through (docs/adr/0033-the-model-asked-from-more-than-one-place.md).
# An ask that is silent for UPSTREAM_HEDGE_SECONDS is joined — not given up — by one from the next place, and the first
# to answer is the reply: of the requests that answered, 92% had begun within 12 s, so about one in thirteen is asked
# twice (the second ended as soon as the first answers).  A place that was silent, failed or refused is asked last for
# five minutes (twice as long each time it does so again, half an hour at most) by the instance that saw it.
# The turns' records say which place answered and how many asks it took (`via`, `asks`): put first the place that
# answers.  GET /v1/egress shows whether the model service's host answers from each place, and how soon.
# "direct" alone: asked from where the Worker runs only, as before; "0" seconds: no place joins
UPSTREAM_VIA = "direct,apac"
UPSTREAM_HEDGE_SECONDS = "12"
# model calls (a question takes several: one per round of tool use)
PER_MINUTE = "30"
PER_DAY = "600"
TOTAL_PER_DAY = "5000"
# tokens (input + output, as the model service counts them) per visitor per day, and all visitors together per day: a
# call is refused once they are spent, so a visitor's cost is bounded by use and not only by calls.  Seen in the records
# so far: a turn p50 80k, p90 500k, at most 1.5M; a conversation at most 3.6M.  0: no limit
TOKENS_PER_DAY = "10000000"
TOTAL_TOKENS_PER_DAY = "200000000"
# the sentinel (security/README.md): observe — every request scored and, flagged, recorded with its address, never
# refused; enforce — an address over the block score is refused for six hours; off — nothing recorded
# enforce since 2026-10-28: in the 22 days of observe before (2026-10-06 to 10-28) the requests it would have refused
# (`shadow` events, data/security-logs/) were 7, all scanners — every request of theirs a 404, most from hosting
# networks, none with a browser's Sec-Fetch headers (docs/adr/0026-pinned-supply-chain-and-enforced-policies.md).  A
# visitor wrongly refused: BLOCK_SCORE up, or SENTINEL back to "observe" (security/README.md)
SENTINEL = "enforce"
# a scanner path (/wp-config.php, /.git/HEAD, /xmlrpc.php, …) refuses its address for a day, in observe mode too: block | observe
HONEYPOT = "block"
# the daily counts by place (security/usage.js): the owner's, shown on no page — read with the collector's token alone
# (LOG_EXPORT_TOKEN), by the repository's workflows.  A day runs on UTC+8 (STATS_UTC_OFFSET, in hours)
STATS_UTC_OFFSET = "8"
# the activity ledger (security/README.md, 活动账本; docs/adr/0035-the-activity-ledger.md): every request written down as
# an event — a page opened, a question, a model call — whatever the sentinel scored it, for a visitor's id and never an
# address.  On only with the secret ACTIVITY_KEY (32+ characters) and the D1 database the deployment then binds as
# ACTIVITY_DB (security/bind-ledger.sh); "off" here switches it off whatever else is set
ACTIVITY = "on"
# who is given an id: notice — a browser that opens a page, unless it asks not to be tracked (GPC, DNT) or its user
# switched the count off (设置 → 数据); optin — only once its user switched it on; off — nobody: everything is counted
# without a visitor.  The same in both Workers' wrangler.toml (tests/test_security_activity.py checks it)
ACTIVITY_IDS = "notice"
# in days: an id's life from the day it was issued (never extended by a visit); how long the events themselves are kept
# in the registry (then only their days' sums); a visitor's rows after their last visit; and what the relay remembers
# of which turn a call belonged to
VISITOR_DAYS = "390"
ACTIVITY_EVENT_DAYS = "90"
ACTIVITY_VISITOR_DAYS = "760"
ACTIVITY_TURN_DAYS = "7"
# conversation records, sent only by visitors who agreed; "off" stops collecting them
LOGS = "on"
# visitors' ratings of answers and what they wrote of them, sent only when they submit, kept with the records; "off"
# stops collecting them (and the page shows no thumbs).  FEEDBACK_PER_MINUTE / FEEDBACK_PER_DAY: per visitor (10, 100)
FEEDBACK = "on"
# the second model, offered beside Tao-R1 only when the Worker has the secret OPENAI_API_KEY: OpenAI's GPT-6 Luna, asked
# for by the page under OPENAI_PUBLIC_MODEL.  OPENAI_QUESTIONS_PER_DAY: questions per visitor per day (a question's tool
# rounds and self-check are not counted again; the page names its turn), OPENAI_TOTAL_QUESTIONS_PER_DAY all visitors
# together.  Under them, calls and tokens per visitor per day bound what one question's rounds (or a client that is not
# the page) can spend.  "off" stops offering it
OPENAI = "on"
OPENAI_BASE = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-6-luna"
OPENAI_PUBLIC_MODEL = "GPT-6 Luna"
OPENAI_QUESTIONS_PER_DAY = "3"
OPENAI_TOTAL_QUESTIONS_PER_DAY = "300"
OPENAI_PER_MINUTE = "10"
OPENAI_CALLS_PER_DAY = "60"
OPENAI_TOKENS_PER_DAY = "3000000"
OPENAI_TOTAL_TOKENS_PER_DAY = "60000000"
# where OpenAI is called from (a Durable Object placed there): OpenAI refuses some regions a visitor's nearest Cloudflare
# location may be in (Hong Kong, for one).  A list, tried in turn when OpenAI refuses the region of one: enam, eastern
# North America, then wnam, western.  "off" calls from the visitor's location.  GET /v1/egress shows each as OpenAI sees it
OPENAI_LOCATION = "enam,wnam"
# the least output cap sent to OpenAI: a reasoning model refuses a very small one
OPENAI_MIN_OUTPUT = "2048"
# the model the page chooses for a visitor who has chosen none (one the service offers), until DEFAULT_MODEL_UNTIL;
# then Tao-R1 again.  GPT-6 Luna through 9 November 2026, Singapore time (SGT, UTC+8): until 10 November 00:00 SGT.
# "" for both: Tao-R1
DEFAULT_MODEL = "GPT-6 Luna"
DEFAULT_MODEL_UNTIL = "2026-11-10T00:00:00+08:00"
# visitors' own API keys and model names, given to the service (赞助, the settings' 赞助 pane): kept encrypted under the
# secret SPONSOR_SECRET in a Durable Object of their own, never with the records; on only when that secret is set.
# SPONSOR_PER_DAY per visitor; SPONSOR_KEEP kept at most.  "off" stops taking them (the page hides the form)
SPONSOR = "on"
SPONSOR_PER_DAY = "5"
SPONSOR_KEEP = "1000"
ALLOWED_ORIGINS = "https://chat.impf.ai,https://psknlr.github.io"

# per visitor and Cloudflare location, over ten seconds: the first gate on a model call or a record, before the counters
# in the Durable Object are asked (cheap and local; approximate — the Durable Object keeps the exact per-day counts)
[[ratelimits]]
name = "BURST"
namespace_id = "7313"
simple = { limit = 40, period = 10 }

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[durable_objects.bindings]]
name = "LOGBOOK"
class_name = "LogBook"

# the visitors' sponsorships (relay/src/sponsors.js): apart from the records, drained nowhere
[[durable_objects.bindings]]
name = "SPONSORS"
class_name = "SponsorBook"

# where a model service is called from when not from where the Worker runs (relay/src/index.js, Egress; UPSTREAM_VIA for
# the default model, OPENAI_LOCATION for the second): keeps nothing
[[durable_objects.bindings]]
name = "EGRESS"
class_name = "Egress"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter", "LogBook"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SponsorBook"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Egress"]

[observability]
enabled = true
