# 道乃久 on Cloudflare — the Worker serving https://chat.impf.ai: the site, and its API to the full corpus (cloud/README.md).
# Deployed by .github/workflows/site.yml, which adds the bindings the account has: the Workers KV namespace the full
# corpus store is uploaded into (STORE) and the corpus Worker (a service binding: CORPUS).  Without them the site still
# serves: the page then runs the 要籍语料 in the browser.
name = "taochronos-site"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

# the site's own hostname: Cloudflare points chat.impf.ai at this Worker and issues its certificate.  Cloudflare puts a
# custom domain only on a name with no DNS record of the account's own: the CNAME that pointed chat.impf.ai at GitHub
# Pages is deleted first (cloud/SETUP.md, step 3)
[[routes]]
pattern = "chat.impf.ai"
custom_domain = true

# the site built by `taochronos web build` (the workflow builds it into _site at the repository's root).  The Worker runs
# first only for the pages (http → https, the security headers) and the API; every other file (the scripts, the
# in-browser runtime and corpus) Cloudflare serves directly — free and unmetered on every plan, where requests to the
# Worker count against the Free plan's 100,000 a day — with the headers in `_headers` (deploy.sh copies it into _site)
[assets]
directory = "../../_site"
binding = "ASSETS"
# (a page's .html address is redirected to the address without it: both are listed)
run_worker_first = ["/", "/index.html", "/about", "/about.html", "/attribution", "/attribution.html", "/api/*"]

[vars]
ALLOWED_ORIGINS = "https://chat.impf.ai"
HSTS_MAX_AGE = "86400"
# the sentinel (security/README.md): observe — every API call scored and, flagged, recorded with its address, never
# refused; enforce — an address over the block score is refused the API for six hours; off — nothing recorded
# enforce since 2026-10-28: in the 22 days of observe before (2026-10-06 to 10-28) the requests it would have refused
# (`shadow` events, data/security-logs/) were 7, all scanners — every request of theirs a 404, most from hosting
# networks, none with a browser's Sec-Fetch headers (docs/adr/0026-pinned-supply-chain-and-enforced-policies.md).  A
# visitor wrongly refused: BLOCK_SCORE up, or SENTINEL back to "observe" (security/README.md)
SENTINEL = "enforce"
# a scanner path (/wp-config.php, /.git/HEAD, /xmlrpc.php, …: nothing of the site's) refuses its address the API for a
# day, in observe mode too: block | observe
HONEYPOT = "block"
# the counts behind the page's 统计 pane in the settings (security/usage.js, docs/web.md): read with the secret
# STATS_TOKEN, or by anyone when STATS_PUBLIC = "1"; a day runs on UTC+8 (STATS_UTC_OFFSET, in hours)
STATS_PUBLIC = "0"
STATS_UTC_OFFSET = "8"
# the activity ledger (security/README.md, 活动账本; docs/adr/0035-the-activity-ledger.md): every request written down as
# an event — a page opened, a question, a model call — whatever the sentinel scored it, for a visitor's id and never an
# address.  On only with the secret ACTIVITY_KEY (32+ characters) and the D1 database the deployment then binds as
# ACTIVITY_DB (security/bind-ledger.sh); "off" here switches it off whatever else is set
ACTIVITY = "on"
# who is given an id: notice — a browser that opens a page, unless it asks not to be tracked (GPC, DNT) or its user
# switched the count off (设置 → 数据); optin — only once its user switched it on; off — nobody: everything is counted
# without a visitor.  The same in both Workers' wrangler.toml (tests/test_security_activity.py checks it)
ACTIVITY_IDS = "notice"
# in days: an id's life from the day it was issued (never extended by a visit); how long the events themselves are kept
# in the registry (then only their days' sums); a visitor's rows after their last visit; and what the relay remembers
# of which turn a call belonged to
VISITOR_DAYS = "390"
ACTIVITY_EVENT_DAYS = "90"
ACTIVITY_VISITOR_DAYS = "760"
ACTIVITY_TURN_DAYS = "7"
# the pages' Content-Security-Policy (empty: none is sent), written from what the page loads (security/README.md): its own
# files, the inline script and the two inline styles by their hashes (cloud/test/site.test.js checks them against web/),
# the Anthropic SDK from jsDelivr's npm files, Cloudflare's Web Analytics beacon (the edge adds it to every page; it is
# not in web/), any https model service a visitor names and a local one, images attached as data: and blob:.  Both
# report to /api/security/csp, with the sentinel's events.
# CSP is enforced: what stops a script that is not the page's — script-src (no inline script but the one hashed, no
# eval), object-src, base-uri — and what a script could send or show the page's data through: connect-src, img-src,
# worker-src, form-action, frame-ancestors.  Enforced since 2026-10-28, after three weeks of the whole policy reported
# (2026-10-06 to 10-28: 144 reports, 13 under these directives) without one from the page's own code: those 13 were
# browser extensions (5, an in-app browser's bridge among them) and Cloudflare's analytics beacon in a few browsers (8;
# refused, it costs a visit in Web Analytics, nothing the visitor sees): docs/adr/0026-pinned-supply-chain-and-enforced-
# policies.md.
# CSP_REPORT_ONLY is the whole policy, reported only: styles, fonts, media and frames are where extensions and in-app
# browsers add their own (a dark mode's or a translator's <style>, an icon font, a bridge's <iframe>), and refusing those
# would cost the visitor the extension, not protect the page.  The in-browser runtime's workers get their own policy in
# _headers (a worker's policy is the one on its own file)
CSP = "script-src 'self' 'sha256-8cHKOAsMjSAfwzaoDvyOuFfoKbHgnKmcCuF/FxBYBS4=' https://cdn.jsdelivr.net/npm/ https://static.cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'; manifest-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; report-uri /api/security/csp; report-to csp"
CSP_REPORT_ONLY = "default-src 'self'; script-src 'self' 'sha256-8cHKOAsMjSAfwzaoDvyOuFfoKbHgnKmcCuF/FxBYBS4=' https://cdn.jsdelivr.net/npm/ https://static.cloudflareinsights.com; style-src 'self' 'sha256-1C7/enbOHhE8E1GjWRJl/R1Z7ZQQu6fsIIlo1IC0R+E=' 'sha256-aPcvRsfwJr+7rNkTbydiD4Z2JolUcX881HfhUtux9n0='; style-src-attr 'unsafe-hashes' 'sha256-qFn50HMKisaTPwbV1pKoe3olf1lYhv+m32EWXEn8+S4='; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; font-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; report-uri /api/security/csp; report-to csp"
# sha256 of the token that may upload the full corpus store (`taochronos web upload`).  Empty: uploads are off.  To
# upload a new store, register a new token's sha256 in the repository variable STORE_TOKEN_SHA256 for as long as the
# upload takes (cloud/README.md); the token itself is kept nowhere here.
STORE_TOKEN_SHA256 = ""

# the sentinel's memory (security/sentinel.js): per visitor the counts and the score, the addresses refused, the events
# waiting for the repository's collector (the chat-logs workflow, with LOG_EXPORT_TOKEN — a secret deploy.sh sets)
[[durable_objects.bindings]]
name = "WATCH"
class_name = "Watch"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Watch"]

# per visitor and Cloudflare location, per minute: tool calls and research runs; reads (info, catalogs, passages, polls)
[[ratelimits]]
name = "CALL_LIMIT"
namespace_id = "7311"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "7312"
simple = { limit = 600, period = 60 }

[observability]
enabled = true
