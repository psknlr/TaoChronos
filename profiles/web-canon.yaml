# 要籍语料 — the corpus of the published site: the openly licensed texts of the ranked works (corpus/web, packed by
# `taochronos web pack`, built into a store by `taochronos web build`, indexed by the browser on first use).  Like
# full-corpus, without the whole lexicon harvested from the full corpus (it names what this corpus mostly does not hold):
# its core instead — the drugs and formulas the full corpus attests most (lexicon-core, `taochronos lexicon core`) — and
# the common drugs the harvest misses (lexicon-supplement), so that the compositions of the ranked works are read whole.
name: web-canon
extends: full-corpus
description: 要籍语料 — the openly licensed texts of the ranked works (the published site's corpus), as a store.
bundles:
  - {plugin: taochronos.plugins.classics, config: {domain: domains/classics, store: corpus/tcm.sqlite, lexicon_extra: [lexicon-supplement, lexicon-core], aliases: [aliases]}}
  - {plugin: taochronos.plugins.knowledge}
  # a drug's other names (国老, 通草 before 960) fill at most 3 of 10 places beside the asked name (ADR 0023), each hit
  # labelled by the search tool (via, flags, query.aliases); witnesses are those of the site's corpus (phase A)
  - {plugin: taochronos.plugins.retrieval, config: {alias: {enabled: true, witness_scope: web}}}
  - {plugin: taochronos.plugins.models.offline}
  - {plugin: taochronos.plugins.models.anthropic_provider}
  - {plugin: taochronos.plugins.models.openai_compat}
  - {plugin: taochronos.plugins.models.litellm_provider}
  - {plugin: taochronos.plugins.sandbox}
  - {plugin: taochronos.plugins.subagents}
  - {plugin: taochronos.plugins.modern, config: {domain: domains/modern, curated: corpus/modern/evidence.yaml, online: false}}
  - {plugin: taochronos.plugins.storage, config: {event_store: sqlite}}
