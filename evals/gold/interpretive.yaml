     quote: 太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，大青龙汤主之,
     relation: contraindicated, arguments: [[formula, 大青龙汤], [symptom, 烦躁]], expect: {verdict: contradicts}}
