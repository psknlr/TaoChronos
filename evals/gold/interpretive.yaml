# InterpretiveEval — hard interpretive cases: every quote below is verbatim, and every reading can still be wrong.
#
# Author annotation.  Passages named by id are in corpus/demo; `text` cases are short excerpts (≤ 120 characters) of
# pre-1900 public-domain works found in the full corpus, given with their book, and kept in the characters of that
# witness (the harness normalises variants itself).
#
# split — fixed before the suite first ran:
#   dev      cases behind a change already made to the rules (argument negation in the support reading; the
#            straddling cutoff of the time machine) and the positive controls used while making it;
#   heldout  every other case.  A held-out miss is reported, not fixed by a rule written for it; a fix needs new
#            held-out cases to be measured.
#
# classes and what is compared:
#   relation_inversion  the support verdict on a claim whose relation or argument reading is inverted (and controls)
#   negation_scope      the support verdict where a prohibition and a prescription stand side by side
#   consequence         the support verdict where 「X之则…」 recommends or warns by its consequence
#   reported_view       the stance of the statement: asserted by the author / reported (endorsed or not) / rejected
#   omitted_condition   whether the frame keeps the condition (若…者, 凡…, …者) of a quote that leaves it out
#   witness_mixing      whether the quote is found at the witness it cites (words of one witness under another's locator)
#   date_dispute        the order of two disputed dates, the date basis of a passage, its side of a cutoff
#
# arguments: [role, surface] or {role, surface, nth (occurrence in the quote, from 0), negated, referent (named by 之)}
cases:
