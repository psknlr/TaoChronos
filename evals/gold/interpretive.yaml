     relation: indicated_for, arguments: [[formula, 大黄牡丹汤], [pulse, 洪], [pulse, 数]], expect: {verdict: ambiguous},
     note: "「不可下也」与「大黄牡丹汤主之」相连，历代注家多以为倒装（当接「可下之，当有血」之后）——字面上是一桩公案，不能读成确定的适应证"}
