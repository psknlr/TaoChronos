  - {text: 朱震亨，字彦修，婺州义乌人。, place: yiwu, person: zhu_zhenheng}
  - {text: 张机，字仲景，南阳人。, place: nanyang, person: zhang_ji}
  - {text: 叶桂，字天士，号香岩，吴县人。, place: wuxian, person: ye_gui}
  - {text: 丹溪之学，行于江南。, place: null, person: null}
