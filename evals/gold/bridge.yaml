mapping:
  - {text: 男子消渴，小便反多，以饮一斗，小便一斗，肾气丸主之。, top3: [diabetes_mellitus, diabetes_insipidus], max_level: moderate}
  - {text: 三消之病，上消者，大渴引饮；中消者，多食善饥，不为肌肉，而日加削瘦；下消者，小便如膏，或小便甜。, top: diabetes_mellitus}
  - {text: 胸痹之病，喘息咳唾，胸背痛，短气。, top: angina_pectoris}
  - {text: 肠痈者，少腹肿痞，按之即痛，时时发热，自汗出，复恶寒，脓已成。, top: appendicitis}
  - {text: 疟，往来寒热，发作有时，头痛，汗出，渴欲饮水。, top: malaria}
  - {text: 下利脓血，里急后重，腹痛，发热。, top: shigellosis}
  - {text: 吐利交作，转筋，脉微欲绝，目眶陷，手指螺瘪。, top: cholera}
  - {text: 半身不遂，口眼㖞斜，语言謇涩，口角流涎。, top: ischemic_stroke}
  - {text: 卒倒，不省人事，口吐涎沫，四肢抽搐，醒后如常。, top: epilepsy}
  - {text: 身目俱黄，小便如皂荚汁，不欲饮食，倦怠乏力。, top: viral_hepatitis}
  - {text: 咳嗽，咯血，潮热，盗汗，形瘦。, top: pulmonary_tuberculosis}
  - {text: 喘息，喉中水鸡声，发作有时。, top: asthma}
  - {text: 痄腮，发热，耳下肿。, top: mumps}
  - {text: 咳唾脓血，吐如米粥，浊唾腥臭，胸痛。, top: lung_abscess}
  - {text: 身肿，面浮，小便不利，小便多沫。, top: nephrotic_syndrome}
  - {text: 骨节疼痛，关节肿大，屈伸不利，经年不愈。, top3: [rheumatoid_arthritis]}
  - {text: 头痛，项强，发热，呕吐，角弓反张。, top3: [meningitis]}
  - {text: 口噤不开，角弓反张，转筋，因破伤而得。, top: tetanus}
  - {text: 太阳病，发热，汗出，恶风，脉缓。, max_level: low}
  - {text: 脉浮紧，舌白，恶风。, max_level: insufficient}
