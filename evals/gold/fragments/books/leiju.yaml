- book: leiju
  passages:
    - {id: leiju.1, locator: {volume: 卷一, chapter: 论病大要}, text: 集古论曰：夫治病之道，先审其虚实，次察其寒热，虚者补之，实者泻之，寒者温之，热者清之，此其大要也。（出第一卷中千金同）}
    - {id: leiju.2, locator: {volume: 卷九, chapter: 咳嗽上气方}, text: 《集古》疗咳嗽上气，喉中如水鸡声方：射干三两，麻黄四两，生姜四两，细辛三两，紫菀三两，款冬花三两，五味子半升，大枣七枚，半夏半升。}
    - {id: leiju.3, locator: {volume: 卷九, chapter: 咳嗽上气方}, text: 右九味，以水一斗二升，煮取三升，分温三服。（出第三卷中）}
    - {id: leiju.4, locator: {volume: 卷九, chapter: 咳嗽上气方}, text: 又疗久咳不瘥，唾脓血方：桔梗三两，甘草二两，贝母二两，桑白皮三两。右四味，以水六升，煮取二升，分再服。（出第三卷中）}
    - {id: leiju.5, locator: {volume: 卷九, chapter: 咳嗽上气方}, text: 《深师》疗咳逆，胸满短气方：杏仁二两，紫苏二两，陈皮一两，桑白皮二两。右四味，以水五升，煮取二升，分再服。（出第十八卷中）}
    - {id: leiju.6, locator: {volume: 卷九, chapter: 咳嗽上气方}, text: 又疗暴咳失声方：杏仁一两，蜜一合，姜汁一合。右三味，合煎，细细含咽之。（出第十八卷中）}
    - {id: leiju.7, locator: {volume: 卷十五, chapter: 头风方}, text: 《集古》疗风头痛，目眩欲倒方：川芎二两，白芷二两，防风二两，细辛一两。右四味，捣筛为散，每服方寸匕，温酒下，日三。（出第五卷中）}
