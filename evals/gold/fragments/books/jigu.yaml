- book: jigu
  passages:
    - {id: jigu.1, locator: {volume: 卷一, chapter: 总论}, text: 夫治病之道，先审其虚实，次察其寒热，虚者补之，实者泻之，寒者温之，热者清之，此其大要也。}
    - {id: jigu.2, locator: {volume: 卷三, chapter: 咳嗽}, text: 疗咳嗽上气，喉中如水鸡声方：射干三两，麻黄四两，生姜四两，细辛三两，紫菀三两，款冬花三两，五味子半升，大枣七枚，半夏半升。右九味，以水一斗二升，煮取三升，分温三服。}
    - {id: jigu.3, locator: {volume: 卷三, chapter: 咳嗽}, text: 疗久咳不瘥，唾脓血方：桔梗三两，甘草二两，贝母二两，桑白皮三两。右四味，以水六升，煮取二升，分再服。}
    - {id: jigu.4, locator: {volume: 卷五, chapter: 头痛}, text: 疗风头痛，目眩欲倒方：川芎二两，白芷二两，防风二两，细辛一两。右四味，捣筛为散，每服方寸匕，温酒下，日三。}
    - {id: jigu.5, locator: {volume: 卷七, chapter: 小便}, text: 疗小便不通，少腹急痛方：滑石四两，冬葵子一升，通草二两，瞿麦二两。右四味，以水七升，煮取三升，分三服。}
    - {id: jigu.6, locator: {volume: 卷九, chapter: 杂疗}, text: 疗误吞钱不出方：以饴糖一斤，渐渐食之，钱自随出。}
