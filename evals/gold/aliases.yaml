# Alias-layer gold (spec §3.10): 120 items in six types and 80 resolution rows, frozen 2026-10-14 before the first run.
#
# Annotated on the web store (553 books, 168,278 passages, normaliser e5cf04a507c3): one annotator file per type, merged
# by an assembler, then revised after an adversarial review (the items marked "review fix").  Selection was by hand,
# not by propose's seed-23 draw: the annotators mined their own candidates with eval-local patterns (X一名Y, X即Y,
# X（即Y）, 俗名/又名/谓之, glosses, 本草 entry heads) over every book outside jc_c030 and bencao_gangmu_*, and the
# review kept only items whose asked form is a candidate of the §3.10 pools as ``aliases_gold.pools`` mines them (pool
# names the sub-pool); its replacements are the first fitting spare of the type and band, else the first fitting
# candidates of a seed-23 shuffle of the pool.  Nothing was taken from the alias layer; curated.yaml did not exist.
# All strings are in the pack's normalised spelling.
#
# items  {id, group, split, type, pool, query, asked, asked_cues, false_friends, referents, wrong, expect_candidates,
#          floor, band, adjudicated}
#   pool        the sub-pool of aliases_gold.POOLS the asked form comes from (alias/head: equation, gloss, entry;
#               ambiguous: lexicon, bielu, store; period: taboo, curated, dated; trap: false-friend, ordinary)
#   referents   [{head, names, valid, witness}]: the drugs the asked form denotes.  names = the names whose passages are
#               relevant (the head, or a short form covering it, unless the head is asked); valid = [from, to) in which
#               they denote this referent (period items only), null = always
#   asked_cues  when set, an asked-form occurrence counts only beside one of them (traps: the drug sense)
#   false_friends  strings masked before labelling (longer names containing the asked form, ordinary phrases)
#   wrong       names whose passages are a wrong reading (another referent, another period)
#   expect_candidates  the referents the system should list for the asked form; period items list only those valid
#               in the query window, a head item none, and a trap expected to stay unexpanded none: such a stop
#               keeps its head and witness (for candidate precision) but no names and no cues, so its relevant
#               passages are those writing the asked form
#   floor       {surface, year}: the soft first-use year (taboo rename, first dated use) behind the anachronism flags
#   band        passages writing the asked form outside the false friends, jc_c030 excluded: 1-2, 3-19, >=20
#   adjudicated every name with the passage that witnesses it (outside jc_c030 and bencao_gangmu_*), which writes the name
#               beside the asked form, a head or another name (in its text or its section heading): an equation, a
#               gloss, an entry, a chain; or, with ``parallel``, for the taboo spellings 元参 and 元胡 that no passage
#               writes beside the original (and 硝石, 慈石, whose passages write them beside the item's other referent):
#               the same line or recipe written each way in two passages
# group / split  items sharing any string (asked form, head, name, wrong name, cue or false friend) share a group,
#               named by the first of them in file order (its head for an alias item, else its asked form); split =
#               sha1(group) % 2: 0 dev, 1 heldout (``aliases_gold.groups``, ``split_of``; the (id, group, split) list is
#               pinned by ``aliases_gold.SPLIT_SHA256``).  Held-out results are reported, never tuned on: no held-out
#               string may be a tuned name, and curated.yaml may hold none of them (``heldout_surfaces``).
# tuned       the names the design was tuned on before this file existed: the retrieval prototype's 29-item gold
#               (both of its splits) and every drug name the spec writes (§2, the curated example of §3.3, §3.4–§3.7, the
#               synthetic cases and before numbers of §3.10, the tests of §3.11).  They may appear in dev items only.
# resolution  {surface, expect_heads, expect_action, group, split}, analysis only: expand (one drug), candidate (list
#               every head, never merge), none (neither expand nor list).  A row takes the group of the items it
#               touches, else its own surface.  Heads are the gold's heads, not necessarily 纲目's.
#
# Review replacements (the items commented "review fix") were the first spare of the type and band in a pool, else the
# first fitting candidates of a seed-23 shuffle of the pool (aliases_gold.pools on the web store).  Draws skipped:
#   head 1-2: 枳椇 (its names are a shared name and a shape word), 南烛枝叶 (a part); head 3-19: 殷孽 (姜石 is also
#   唐本's own stone), 腽肭脐 (a name of head-02), 石肝 (an alias, not a head), 绿青 (碧青/绿青 swapped by painters), 乌韭
#   (also 麦门冬's 一名), 马蓼 (蓼实 is another 蓼); ambiguous >=20: lexicon pairs of entries for one drug, 乌金, 黄瓜,
#   昌阳, 无心, 石龙, 土瓜 (a reading without a witness), 日及 (unattested); period: 白矾石, 鼠乡 (their referent 礜石
#   is tuned), 云珠, 长石 (no change of currency in the store), 其外皮 (a phrase); substring: 沙鱼, 燕屎, 胡瓜, 乌桕木 (the
#   longer name is a part or kind of the same drug), 大小蓟, 薰草, 含水藤, 莞草 (phrases), 桑花 (written only in
#   佛桑花), 蜈蚣草 (the longer name never written).
# The comment above each item is its annotator's: counts by period, the in-window counts, witnesses and doubts.
# Still to do (§3.10 step 4): the pooled adjudication of the top 50 hits of off, naive and on on both stores, and the
# hand check of a 10% sample of labels; names it adds need a witness and are dated in adjudicated.
# Corrections of 2026-10-15, after the first held-out report (logged in docs/evals.md): the names adjudicated
# ``by: correction`` — 凌霄, 姜芥, 鹿胶, 荼草, 游冬, 鸡舌香, 硝石, 慈石 — are real other names that dev runs showed missing,
# each with a witness in the store; they were added to dev items only (ids, groups and splits unchanged), and no
# held-out item was changed or looked at.  On review, 硝石 and 慈石 are witnessed by parallel rows (their passages
# wrote them only beside the item's other referent), and two non-drug strings the new names brought in are masked
# (凌霄观, a building, under 紫葳 and 鬼目; 姜芥水肿 under 假苏).
