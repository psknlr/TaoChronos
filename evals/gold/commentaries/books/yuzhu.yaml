- book: yuzhu
  passages:
    - {id: yuzhu.001, locator: {volume: 卷一}, text: 太阳之为病，脉浮，头项强痛而恶寒。此揭太阳病之总脉总证也。太阳膀胱经乃六经之首，主皮肤而统营卫，所以为受病之始。}
    - {id: yuzhu.002, locator: {volume: 卷一}, text: 太阳病，发热，汗出，恶风，脉缓者，名为中风。成氏谓风则伤卫，此说非也。风寒皆伤营卫，但有轻重之分耳。}
    - {id: yuzhu.003, locator: {volume: 卷一}, text: 太阳病，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名为伤寒。寒伤营血，血脉凝泣，故脉阴阳俱紧而体痛也。}
    - {id: yuzhu.004, locator: {volume: 卷一}, text: 太阳病，头痛，发热，汗出，恶风，桂枝汤主之。}
