# Gold entities for `study entities` (T7): sentences of the classics (short quotations, public domain) and sentences
# written for the test, annotated by the authors of TaoChronos following the conventions of
# domains/classics/entities.yaml (flat, maximal spans; negation as an attribute; Dose = number and unit; Preparation =
# making and taking).  Author-constructed and used during development: a regression set, not an expert benchmark.
#
# Each entity is [text, type]; a text that occurs twice in a sentence is listed once per occurrence, in order.
# Sentences whose entities no rule can reach (a disease name read as a finding, a treatment the lexicon lacks) are kept
# on purpose: they are what the model's review is for.

sentences:
  - text: 太阳病，头痛，发热，汗出，恶风，桂枝汤主之。
    source: 伤寒论
    entities: [[太阳病, Disease], [头痛, Symptom], [发热, Symptom], [汗出, Symptom], [恶风, Symptom], [桂枝汤, Formula]]
  - text: 太阳之为病，脉浮，头项强痛而恶寒。
    source: 伤寒论
    entities: [[太阳之为病, Disease], [脉浮, Pulse], [头项强痛, Symptom], [恶寒, Symptom]]
  - text: 太阳病，发热，汗出，恶风，脉缓者，名为中风。
    source: 伤寒论
    entities: [[太阳病, Disease], [发热, Symptom], [汗出, Symptom], [恶风, Symptom], [脉缓, Pulse], [中风, Disease]]
  - text: 太阳病，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名为伤寒。
    source: 伤寒论
    entities: [[太阳病, Disease], [发热, Symptom], [未发热, Symptom], [恶寒, Symptom], [体痛, Symptom], [呕逆, Symptom],
               [脉阴阳俱紧, Pulse], [伤寒, Disease]]
  - text: 伤寒二三日，心中悸而烦者，小建中汤主之。
    source: 伤寒论
    entities: [[伤寒, Disease], [二三日, Time], [心中悸, Symptom], [烦, Symptom], [小建中汤, Formula]]
  - text: 桂枝三两（去皮） 芍药三两 甘草二两（炙） 生姜三两（切） 大枣十二枚（擘）
    source: 伤寒论·桂枝汤方
    entities: [[桂枝, Herb], [三两, Dose], [去皮, Preparation], [芍药, Herb], [三两, Dose], [甘草, Herb], [二两, Dose],
               [炙, Preparation], [生姜, Herb], [三两, Dose], [切, Preparation], [大枣, Herb], [十二枚, Dose], [擘, Preparation]]
  - text: 右五味，㕮咀三味，以水七升，微火煮取三升，去滓，适寒温，服一升。
    source: 伤寒论·桂枝汤方
    entities: [[㕮咀, Preparation], [以水七升, Preparation], [微火煮取三升, Preparation], [去滓, Preparation], [适寒温, Preparation],
               [服一升, Preparation]]
  - text: 厥阴之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蛔，下之利不止。
    source: 伤寒论
    entities: [[厥阴之为病, Disease], [消渴, Symptom], [气上撞心, Symptom], [心中疼热, Symptom], [饥而不欲食, Symptom],
               [吐蛔, Symptom], [下之, Treatment], [利不止, Symptom]]
  - text: 成无己注曰：此太阳中风也。
    source: constructed
    entities: [[成无己, Commentator], [太阳中风, Syndrome]]
