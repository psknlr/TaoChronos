# TaoChronos demonstration corpus — bibliographic layer (Gate G0 reads `source`).
# Dates are approximate scholarly conventions; ranges express uncertainty.
defaults:
  source: &demo_source
    origin: TaoChronos demonstration corpus
    license: "Underlying works are pre-1900 public-domain texts; this excerpt transcription is released under CC0-1.0"
    acquisition: "Short excerpts transcribed by the TaoChronos authors from commonly circulated modern typeset editions, for software demonstration"
    transcription: "Not collated against any specific edition; may contain transcription or punctuation errors; verify before citing"
    verified: false

books:
