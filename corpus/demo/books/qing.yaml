- book: yizong_jinjian
  edition: yizong_jinjian@tongxing
  passages:
    - id: yizong_jinjian.yongju
      locator: {chapter: 外科心法要诀, section: 痈疽总论歌}
      kind: verse
      text: 痈疽原是火毒生，经络阻隔气血凝，外因六淫八风感，内因六欲共七情。
      tags: [疮疡, 痈疽, 转录, track:C]
      notes: 首两句与《外科正宗·痈疽原委论》相同（文本复用/转录的检测样例）。

    - id: yizong_jinjian.wuwei
      locator: {chapter: 外科心法要诀, section: 疔疮·五味消毒饮}
      kind: formula
      text: 五味消毒饮：金银花三钱，野菊花、蒲公英、紫花地丁、紫背天葵子各一钱二分。
      tags: [方剂, 疮疡, 金银花, track:C]

- book: wenrelun
  edition: wenrelun@tongxing
  passages:
    - id: wenrelun.1
      locator: {chapter: 温热论}
      text: 温邪上受，首先犯肺，逆传心包。
      tags: [温病, track:A]

    - id: wenrelun.2
      locator: {chapter: 温热论}
      text: 辨营卫气血虽与伤寒同，若论治法则与伤寒大异也。
      tags: [温病, 伤寒, 学派, track:A]

    - id: wenrelun.3
      locator: {chapter: 温热论}
      text: 大凡看法，卫之后方言气，营之后方言血。在卫汗之可也，到气才可清气，入营犹可透热转气，入血就恐耗血动血，直须凉血散血。
      tags: [温病, 卫气营血, track:A]

    - id: wenrelun.4
      locator: {chapter: 温热论}
      text: 且吾吴湿邪害人最广，如面色白者，须要顾其阳气，湿胜则阳微也。
      tags: [湿, 温病, 地域, track:A]

- book: wenbing_tiaobian
  edition: wenbing_tiaobian@tongxing
  passages:
    - id: wenbing_tiaobian.s01
      locator: {volume: 卷一, chapter: 上焦篇, section: 第一条}
      text: 温病者：有风温、有温热、有温疫、有温毒、有暑温、有湿温、有秋燥、有冬温、有温疟。
      tags: [温病, track:A]

    - id: wenbing_tiaobian.s04
      locator: {volume: 卷一, chapter: 上焦篇, section: 第四条}
      text: 太阴风温、温热、温疫、冬温，初起恶风寒者，桂枝汤主之；但热不恶寒而渴者，辛凉平剂银翘散主之。
      tags: [温病, 桂枝汤, 银翘散, track:A]

    - id: wenbing_tiaobian.f.yinqiao
      locator: {volume: 卷一, chapter: 上焦篇, section: 银翘散方}
      kind: formula
      text: 连翘一两，银花一两，苦桔梗六钱，薄荷六钱，竹叶四钱，生甘草五钱，芥穗四钱，淡豆豉五钱，牛蒡子六钱。
      tags: [方剂, 银翘散, 金银花, track:C]

    - id: wenbing_tiaobian.s30
      locator: {volume: 卷一, chapter: 上焦篇, section: 暑温·清营汤}
      text: 脉虚夜寐不安，烦渴舌赤，时有谵语，目常开不闭，或喜闭不开，暑入手厥阴也。手厥阴暑温，清营汤主之；舌白滑者，不可与也。
      tags: [温病, 清营汤]

    - id: wenbing_tiaobian.f.qingying
      locator: {volume: 卷一, chapter: 上焦篇, section: 清营汤方}
      kind: formula
      text: 犀角三钱，生地五钱，元参三钱，竹叶心一钱，麦冬三钱，丹参二钱，黄连一钱五分，银花三钱，连翘（连心用）二钱。
      tags: [方剂, 清营汤, 避讳, 金银花]
      notes: “元参”即“玄参”，清人避康熙帝玄烨讳而改。

    - id: wenbing_tiaobian.s43
      locator: {volume: 卷一, chapter: 上焦篇, section: 湿温·三仁汤}
      text: 头痛恶寒，身重疼痛，舌白不渴，脉弦细而濡，面色淡黄，胸闷不饥，午后身热，状若阴虚，病难速已，名曰湿温。汗之则神昏耳聋，甚则目瞑不欲言，下之则洞泄，润之则病深不解，长夏深秋冬日同法，三仁汤主之。
      tags: [湿, 湿温, track:A]

    - id: wenbing_tiaobian.f.sanren
      locator: {volume: 卷一, chapter: 上焦篇, section: 三仁汤方}
      kind: formula
      text: 杏仁五钱，飞滑石六钱，白通草二钱，白蔻仁二钱，竹叶二钱，厚朴二钱，生薏仁六钱，半夏五钱。
      tags: [方剂, 湿温, track:A]

    - id: wenbing_tiaobian.x.xijiao
      locator: {volume: 卷三, chapter: 下焦篇, section: 犀角地黄汤}
      text: 时欲漱口不欲咽，大便黑而易者，有瘀血也，犀角地黄汤主之。
      tags: [瘀, 犀角地黄汤, track:A, track:B]

    - id: wenbing_tiaobian.zashuo
      locator: {volume: 卷四, chapter: 杂说, section: 治病法论}
      text: 治上焦如羽，非轻不举；治中焦如衡，非平不安；治下焦如权，非重不沉。
      tags: [治则, 三焦]

- book: yilin_gaicuo
  edition: yilin_gaicuo@tongxing
  passages:
    - id: yilin_gaicuo.qixue
      locator: {volume: 上卷, chapter: 气血合脉说}
      text: 治病之要诀，在明白气血。
      tags: [气血, 瘀, track:A]

    - id: yilin_gaicuo.xuefu
      locator: {volume: 上卷, chapter: 血府逐瘀汤所治症目, section: 血府逐瘀汤}
      kind: formula
      text: 血府逐瘀汤：当归三钱，生地三钱，桃仁四钱，红花三钱，枳壳二钱，赤芍二钱，柴胡一钱，甘草二钱，桔梗一钱半，川芎一钱半，牛膝三钱。
      tags: [方剂, 瘀, track:A]

    - id: yilin_gaicuo.buyang
      locator: {volume: 下卷, chapter: 瘫痿论, section: 补阳还五汤}
      kind: formula
      text: 补阳还五汤：此方治半身不遂，口眼歪斜，语言謇涩，口角流涎，大便干燥，小便频数，遗尿不禁。黄芪四两（生），归尾二钱，赤芍一钱半，地龙一钱（去土），川芎一钱，桃仁一钱，红花一钱。
      tags: [方剂, 中风, 瘀, track:A]

    - id: yilin_gaicuo.bansui
      locator: {volume: 下卷, chapter: 半身不遂本源}
      text: 半身不遂，亏损元气，是其本源。
      tags: [中风, 风, 元气, track:A]
