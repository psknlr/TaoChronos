# What the corpus leaves out (see plugins/classics/ingest/policy.py), reviewed book by book.
#
#   当代出版物        — works first written or compiled after 1949 (modern textbooks, dictionaries, compilations)
#   当代名医著作      — writings and case records of physicians of the People's Republic era
#   现代校注本        — modern annotated / translated editions, and modern reconstructions of lost works (辑校本)
#
# Republican-era works (1912–1949) are historical sources and stay (category 近代); their modern editors'
# paratext (内容提要, 整理说明, 点校说明 …) is dropped at ingest.  An automatic screen (years after 1940, modern
# units and institutions, annotation apparatus, numbered footnotes, a modern editor's source references in a
# reconstructed lost work) flags the rest; `keep: true` overrules it where it is wrong.  Excluded books are
# recorded in the generated catalogs with their reason and never enter the corpus store.
#
# Texts that surfaced in modern times under an ancient name — the 桂林古本 伤寒杂病论 (白云阁藏本 1939, 桂林本 1960),
# the 辅行诀脏腑用药法要 (brought out 1918–1974), like the Republican 长沙古本 and 康平本 — are not modern publications:
# they are kept (`keep: true`, or `keep` for a title) as sources of the time they appeared, dated by their
# appearance and marked pseudepigraphic or disputed in the source overrides, never by the date they claim.
#
# Modern editions of old books (辑校本 of lost works, annotated and 阐释 editions) and one contemporary work were
# reviewed again and kept on request (`keep: true`, the note says how): the old text stays the main layer, dated as
# the book; the editors' commentary becomes a layer of its own, dated by the edition, and their source references,
# sigla, note calls and converted doses leave the text for the passage's metadata (rules in jicheng-overrides.yaml
# and wikisource-overrides.yaml, see plugins/classics/ingest/apparatus.py).  What is dated 1950 or later belongs to no
# analysis period.

