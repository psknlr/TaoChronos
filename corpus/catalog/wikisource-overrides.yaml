# Corrections to the Wikisource catalog (keyed by page title; see plugins/classics/ingest/wikisource.py).
# Works whose own header gives no usable date, and the "ancient recensions" of the 傷寒雜病論 that first appeared
# in print in the Republican era — dated by their appearance, never by the date they claim.

天回醫簡:
  composition: [-206, -87]
  dynasty: 西汉
  category: 医经
  notes_text: 成都天回镇老官山汉墓出土医简（2012—2013年发掘），据整理者释文录入；墓葬约当西汉景帝、武帝之时，学者多认为出自扁鹊（“敝昔”）一派

傷寒雜病論 (長沙古本):
  dynasty: 民国
  force_ingest: true  # a distinct recension, not a copy of the 宋本
  title: 伤寒杂病论（长沙古本）
  composition: [1932, 1934]
  attribution: pseudepigraphic
  notes_text: 所谓“长沙古本”，民国时随刘世祯《伤寒杂病论义疏》问世，真伪有争议；按问世年代断代

傷寒雜病論 (康平古本):
  dynasty: 民国
  force_ingest: true  # a distinct recension, not a copy of the 宋本
  title: 伤寒杂病论（康平本）
  composition: [1937, 1947]
  attribution: pseudepigraphic
  notes_text: 所谓“康平本”，日本抄本，1937年大塚敬节校刊、1940年代传入中国，所称康平年间（1058—1065）抄写之说未能证实；按刊行年代断代

傷寒雜病論白雲閣藏本:
  dynasty: 民国
  force_ingest: true  # a distinct recension, not a copy of the 宋本
  title: 伤寒杂病论（白云阁藏本）
  composition: [1939, 1939]
  attribution: pseudepigraphic
  notes_text: 1939年白云阁刊本（维基文库录入时参校1948年会通本、1960年桂林本），与“桂林古本”同源，真伪有争议；按刊行年代断代

事林廣記/續集/卷10:
  title: 事林广记·续集·卷十（医学类）
  composition: [1330, 1333]
  dynasty: 元
  category: 本草
  notes_text: 南宋陈元靓编类书《事林广记》续集卷十“医学类”（药忌、炮制），据元至顺间刊本系统，按元刊年代断代

醫方類聚:  # in Category:醫書, outside the 中醫 tree
  title: 医方类聚
  authors: [金礼蒙, 柳诚源, 闵普和]
  dynasty: 朝鲜
  composition: [1443, 1445]
  category: 方书
  notes_text: 朝鲜世宗（李祹）命金礼蒙、柳诚源、闵普和等据中国医书一百五十余种分门类编，1445年编成，1477年活字初刊；维基文库仅录凡例、引用诸书及部分卷次；所引宋元明医书原文可资辑佚与校勘

# --- Modern editions kept at the user's request (see exclusions.yaml and plugins/classics/ingest/apparatus.py): the old
# text is the main layer, the modern editor's work a layer of its own; copies of kept 笈成 books carry that book's work,
# so the catalog recognises them as copies.
醫理真傳:
  title: 医理真传
  authors: [郑寿全]
  dynasty: 清
  composition: [1869, 1869]
  notes_text: 郑钦安原著（同治己巳，1869）；据唐步祺《郑钦安医书阐释》（巴蜀书社1996）中的《医理真传》录入：唐氏【阐释】及其后未标记的段落（至下一问答、方名或标题）单列为层；电子版序、代序、今人序与前言不入库；原文中（　）〔　〕为唐氏校记，照录
  paragraphs:
    - {pattern: '^(?:□|问曰|答曰|或问|用药意解|[^\s，。（]{2,12}(?:汤|散|丸|饮|丹|膏|方)$)', block: true}
    - {pattern: '^【阐释】', layer: 唐步祺阐释, year: [1987, 1996], attribution: 唐步祺《医理真传阐释》（巴蜀书社）, block: true}
  drop_sections: ['^火神立名之本', '^序$']

婦人壽草:
  title: 妇人寿草
  authors: [香月牛山]
  dynasty: 日本
  composition: [1726, 1726]
  category: 妇科
  mixed: {layer: 今人汉译（据1986年小野正弘校订日文本）, year: [1986, 2010], attribution: 维基文库“一步两搭桥”整理汉译，后四卷删}
  cites_work: [1726, 1726]
  notes_text: 香月牛山撰于享保十一年（1726）；今人据1986年燎原书店小野正弘校订的日文铅字本汉译，文句为今人译文，整书按译文断代（在分析分期之外）

