# Catalog of the Kanseki Repository texts ingested by TaoChronos: KR3e 醫家類 = 《四库全书·子部·医家类》,
# all 100 works.  The texts themselves are NOT in this repository: `taochronos corpus fetch kanripo` clones
# them into the data directory and `taochronos corpus ingest` builds the corpus store.
#
# Dating policy (read before trusting a date):
# * `composition` dates the work's main layer.  A witness is never dated earlier than its own production
#   unless it is the standard transmission of an earlier text (e.g. 素问 in the 王冰/新校正 recension).
# * Layers the transcription lets us separate get their own dates: double-column notes (`notes`, `markers`),
#   indented commentary blocks (`indented_commentary`), chapters added later (`chapter_layers`), and sections
#   appended by later editors (`section_layers`).
# * When layers cannot be separated reliably, `mixed` dates every passage by the latest layer and keeps the
#   older material's date as `t_citation` — conservative for "earliest attestation" questions.
# * Front matter (卷首: 提要, prefaces, contents) is dated by the 提要 date (乾隆 year parsed from the text) or
#   the edition.  Dates marked 待核 in `notes` are approximate and await expert review.
# Dates are years CE (negative = BCE); ranges express uncertainty.

source:
  id: kanripo
  name: 漢籍リポジトリ Kanseki Repository（Christian Wittern 等）
  url: https://www.kanripo.org/
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/
  repo: https://github.com/kanripo/{kr_lower}
  acquisition: shallow git clone of each text repository; the commit is recorded in corpus/sources.lock.yaml
  transcription: 汉籍仓库据文渊阁四库全书（WYG）或四部丛刊（SBCK）影印本录入，字形已按 normlist 规范化；未经本项目逐字校勘
  verified: false

editions:
  WYG: {name: 文渊阁四库全书本, year: [1773, 1782], quality: 0.6}
  SBCK: {name: 四部丛刊影印本, year: [1919, 1936], quality: 0.7}

