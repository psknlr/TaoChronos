# Curated records of the CMETA editions (keyed by the site's book id; see plugins/classics/ingest/cmeta.py).
# Every edition is a witness of a work already in the corpus: `work` joins it to the other transcriptions, the date of
# the work stays the work's (composition), the edition's own year goes to `edition_year`.  素问's notes take their dated
# layers as in the Kanripo and 笈成 copies (王冰注 762, 新校正 1068, the 运气七篇 added by 王冰).

shanghan_zhao_kaimei:
  title: 伤寒论（宋本·安政本）
  work: shanghanlun
  authors: [张机]
  dynasty: 东汉
  composition: [200, 219]
  category: 伤寒
  edition: 日本安政三年（1856）覆刻明万历赵开美本（台北故宫博物院藏，故观003364—003367）
  edition_year: [1856, 1856]
  holding: 國立故宮博物院
  notes_text: 赵开美本（宋本）系统之日本覆刻本；CMETA 据故宫藏本影像逐页精校

shanghan_npm:
  title: 伤寒论（宋本·台北故宫）
