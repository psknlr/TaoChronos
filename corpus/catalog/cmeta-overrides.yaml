suwen_gucongde:
  title: 重广补注黄帝内经素问（顾从德本）
  work: suwen
  authors: [佚名（托名黄帝、岐伯）]
  dynasty: 战国—西汉
  composition: [-300, 25]
  attribution: pseudepigraphic
  category: 医经
  edition: 明嘉靖二十九年（1550）顾从德覆宋刊本（台北故宫博物院藏，故善007799—007808）
  edition_year: [1550, 1550]
  holding: 國立故宮博物院
  notes: {layer: 王冰注, year: [762, 762], attribution: 唐·王冰次注}
  markers: [{prefix: 新校正云, layer: 新校正, year: [1068, 1068], attribution: 宋·林亿、孙奇、高保衡等}]
  chapter_layers: [{pattern: "天元紀大論|五運行大論|六微[旨㫖]大論|氣交變大論|五常政大論|六元正紀大論|至[真眞]要大論",
                    layer: 运气七篇（王冰补入）, year: [762, 762], attribution: 王冰次注时补入，来源与年代存疑（一说为《阴阳大论》）}]
  notes_text: 运气七篇按王冰补入之年保守断代；王冰注、新校正按其年代分层

lingshu_sibucongkan:
