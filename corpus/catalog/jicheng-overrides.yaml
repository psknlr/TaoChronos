# Curated dating and layer rules for the 笈成 (JiCheng) collection, keyed by file code (data/<X>/<code>.txt).
# Everything not listed here is catalogued automatically from the book's own [book] block (年份 / 朝代, with
# reign-era parsing) and, when a work is also in the Kanripo catalog, from that entry's date — see
# `taochronos corpus catalog jicheng`, which writes corpus/catalog/jicheng.yaml.
#
# The vocabulary is the Kanripo catalog's (see kanripo-kr3e.yaml): `composition` dates the main layer; `z_layer` /
# `s_layer` give the [z] 注 / [s] 疏 notes a dated layer of their own (otherwise they stay inline); `markers` split
# notes at a marker; `mixed` + `cites_work` date a witness whose layers are not marked (an annotated classic whose
# commentary is not tagged) by its latest layer; `chapter_layers` / `section_layers` date added chapters or sections.
# `modern: true` marks works of the 20th century or later (not evidence for historical questions, and possibly
# still in copyright — local research use only); `category: 非医籍` marks non-medical works; `exclude: true`
# skips a file entirely.  Dates marked 待核 await review.

