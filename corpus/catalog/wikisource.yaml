  notes_text: 晉葛洪撰。洪字稚川，句容人。元帝為丞相時，辟為掾。以平賊功，賜爵關內侯，遷散騎常侍。自乞出為句漏令。後終於羅浮山，年八十一。事跡具《晉書·本傳》。是書初名《肘後卒救方》，梁陶宏景補其闕漏，得一百一首，為《肘後百一方》。金楊用道又取唐慎微證類本草諸方附於肘後隨證之下，為《附廣肘後方》。元世袓至元間，有烏某者，得其本於平鄉郭氏，始刻而傳之。段成己為之序，稱葛、陶二君共成此編，而不及楊用道。此本為明嘉靖
