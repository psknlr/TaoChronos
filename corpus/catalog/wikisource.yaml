  notes_text: 臣等謹案，《此事難知》二卷，元王好古撰。好古字海藏，趙州人，李杲之高弟也。是編專述杲之緒論，於傷寒證治尤詳，其問三焦有幾，分別手足，明孫一奎極稱其功，但謂命門包絡於右尺同診，又謂包絡亦有三焦之稱，未免誤會經旨。史稱杲長於傷寒，而《會要》一書，元好問實序之，今其書已失傳，則杲之議論猶賴此以存其一二。前有至大元年自序，稱得師不傳之秘，旬儲月積寖就篇帙，蓋好古所自爲裒輯者，今本《東垣十書》竟屬之杲則非矣
