  notes_text: 黃帝內經素問校義一卷，清胡澍撰。澍字荄甫，績溪人，精於訓詁。是書以宋本內經爲主，用元熊氏本明道藏本，及唐以前載籍勘正之。全元起王太僕舊注之誤，多所摘發，蓋以漢學考據之法而施之醫事者也。清儒以漢學家法治醫者，別有孫淵如、顧光之輯《神農本草經》，俞曲園之《內經辯言》，並此而四矣。
