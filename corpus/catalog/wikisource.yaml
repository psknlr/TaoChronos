  notes_text: 臣等謹案，《世醫得效方》二十卷，元危亦林撰。 亦林字達齋，南豐人，官本州醫學教授。 是編積其高祖以下，五世所集醫方，合而成書。一曰大方脈，科分子目九十有一；二曰小方脈，科分子目七十有一；三曰風科，科分子目十；四曰產科，兼婦人雜病，科分三十有三；五曰眼科，科分子目二十；六口齒，廉咽喉科，科分子目六；七曰正骨，廉金鏃科，科分子目二十九；八曰瘡腫科，科分二十四。
