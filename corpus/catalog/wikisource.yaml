  notes_text: 《脈訣乳海》六卷，爲王邦傅所作。王君以河洛之精義，發叔和之奧旨，而於營衛循行之道尤深致意焉。其理論之精詳，引證之博雅，爲金元以後所僅見。夫《王氏脈訣》流傳已久，本爲學醫者所家弦戶誦，今得王君以獨闢之見解，發揮而註釋之，其有裨於脈學，誠非淺尠。名之曰乳海，乳者言其開食必先，海者言其含蘊無盡也。
