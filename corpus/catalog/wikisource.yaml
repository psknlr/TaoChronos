  notes_text: 《全生指迷方》四卷，宋王貺撰。案書錄解題：貺，字子亨，考城人，名醫之婿，宣和中以醫得幸，官至朝請大夫， 是書《宋史•藝文志》作三卷，而傳本久絕，故醫家罕所徵引，或至不知其名。今檢《永樂大典》所收，按條掇拾，雖未必盡符原本，然大要已略具矣。 方書所載，大都皆標某湯、某丸、主治某病，詳其藥銖兩而止。獨貺此書，於每證之前，非惟具其病狀，且一一論其病源，使讀者有所據依，易於運用。
