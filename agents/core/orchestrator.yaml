id: orchestrator
name: 研究编排者 Research Orchestrator
description: >-
  Turns a question into a workflow of skills (a DAG checked against their manifests), runs it, and writes the answer
  from the artifacts — every statement tied to evidence and handed to the critic before it is shown.
skills: [plan, synthesize]
delegates: [director, meta_reviewer]
permissions: [classics:read, kg:read, analysis:run]
outputs: [plan, report]
rules:
  - rules plan first; a model may add or drop optional skills, never S01 or S15, and never a skill the registry lacks
  - the answer says what the evidence says and no more; the critic's verdict is shown beside each statement
