# 封禁名单：边缘的 IP 列表 taochronos_block（rules.yaml 的 list），规则 tc-block-list 让其中的地址在两个主机上都只得到 403
# （security/README.md「封禁名单」）。security/apply.py 把这里未过期的条目写进列表；改了本文件合并进 main 后，security
# 工作流自动只同步名单。
#
# 只收表现出攻击意图的地址：找漏洞或密钥的路径（.git、.env、wp-、配置文件……）、冒充爬虫、成批的探测。只是请求头不像浏览器、
# 只抓了首页、或来自机房网络，都不够——那可能是真实访客（大陆访客常走机房 VPN）、链接预览或安全检测。每条写明看到了什么
# （why）与何时（seen）。封禁是永久的；只想封一段时间的，写上到期日（until: YYYY-MM-DD），过期后 apply 时自动移出。
# 扫描器的地址常是租来的，日后若有真实访客因此打不开网站，删掉那一行、合并进 main 即解封。
#
# 在 Cloudflare 控制台里手动加进列表的地址（应急）不带 [taochronos] 标记，apply 保留它们；事后照样补进这里。
# 站长也可以点名封禁没有攻击意图的扫描器（如自报身份的互联网测绘），why 里写明「按站长要求」。

